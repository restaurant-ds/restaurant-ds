<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test OneSignal D&S</title>
<style>
body{font-family:monospace;padding:16px;background:#0a0a0a;color:#fff;font-size:14px;line-height:1.6}
h1{color:#ffc107;font-family:Georgia,serif}
.box{background:#1a1a1a;border-left:4px solid #ffc107;padding:10px;margin:8px 0;border-radius:6px}
.ok{color:#4ade80;font-weight:bold}
.err{color:#f87171;font-weight:bold}
.warn{color:#ffc107;font-weight:bold}
.wait{color:#60a5fa}
button{background:#ffc107;color:#0a0a0a;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;font-size:16px;margin:10px 0;width:100%}
button.alt{background:#333;color:#fff}
pre{background:#000;padding:10px;border-radius:6px;overflow-x:auto;font-size:11px;color:#4ade80}
</style>
</head>
<body>
<h1>🔔 Test OneSignal</h1>

<div class="box">
  <strong>Statut du navigateur :</strong>
  <div id="browser-info"></div>
</div>

<div class="box">
  <strong>Permission notification :</strong>
  <div id="perm-status">⏳ Vérification…</div>
</div>

<div class="box">
  <strong>Service Worker :</strong>
  <div id="sw-status">⏳ Vérification…</div>
</div>

<div class="box">
  <strong>OneSignal SDK :</strong>
  <div id="os-status">⏳ Chargement…</div>
</div>

<div class="box">
  <strong>OneSignal Subscription :</strong>
  <div id="sub-status">⏳ En attente…</div>
</div>

<button onclick="askPermission()">🔔 Demander la permission</button>
<button class="alt" onclick="location.reload()">🔄 Recharger</button>

<div style="margin-top:20px">
  <strong>Logs détaillés :</strong>
  <pre id="logs">Démarrage…</pre>
</div>

<script>
const log = (msg, cls) => {
  const el = document.getElementById("logs");
  el.textContent += "\n" + msg;
  el.scrollTop = el.scrollHeight;
  console.log(msg);
};

// Info navigateur
document.getElementById("browser-info").innerHTML =
  "URL: " + location.href + "<br>" +
  "HTTPS: " + (location.protocol === "https:" ? "<span class='ok'>✅</span>" : "<span class='err'>❌</span>") + "<br>" +
  "User-Agent: " + navigator.userAgent.substring(0, 80);

// Permission
const updatePerm = () => {
  if (!("Notification" in window)) {
    document.getElementById("perm-status").innerHTML = "<span class='err'>❌ Non supporté</span>";
    return;
  }
  const p = Notification.permission;
  const cls = p === "granted" ? "ok" : p === "denied" ? "err" : "warn";
  document.getElementById("perm-status").innerHTML = "<span class='" + cls + "'>" + p + "</span>";
  log("Permission: " + p);
};

async function askPermission() {
  if (!("Notification" in window)) { alert("Non supporté"); return; }
  log("Demande de permission…");
  const p = await Notification.requestPermission();
  log("Résultat: " + p);
  updatePerm();
  if (p === "granted") {
    setTimeout(() => location.reload(), 1000);
  }
}

updatePerm();

// Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    let html = "";
    if (regs.length === 0) {
      html = "<span class='warn'>⚠️ Aucun SW enregistré</span>";
    } else {
      regs.forEach(r => {
        html += "<span class='ok'>✅</span> " + r.scope + "<br>";
        log("SW enregistré: " + r.scope);
      });
    }
    document.getElementById("sw-status").innerHTML = html;
  }).catch(e => {
    document.getElementById("sw-status").innerHTML = "<span class='err'>❌ " + e.message + "</span>";
  });
} else {
  document.getElementById("sw-status").innerHTML = "<span class='err'>❌ Non supporté</span>";
}

// OneSignal
log("Injection du SDK OneSignal…");
window.OneSignalDeferred = window.OneSignalDeferred || [];
window.OneSignalDeferred.push(async function(OneSignal) {
  log("✅ SDK OneSignal chargé");
  document.getElementById("os-status").innerHTML = "<span class='ok'>✅ SDK chargé</span>";
  try {
    await OneSignal.init({
      appId: "8fdaa67c-c57e-4794-b668-0373607cf39c",
      allowLocalhostAsSecureOrigin: true,
      notifyButton: { enable: false },
      serviceWorkerParam: { scope: "/restaurant-ds/" },
      serviceWorkerPath: "/restaurant-ds/OneSignalSDKWorker.js"
    });
    log("✅ OneSignal.init() réussi");
    document.getElementById("os-status").innerHTML = "<span class='ok'>✅ Initialisé</span>";
    
    const id = await OneSignal.User.PushSubscription.id;
    const opt = await OneSignal.User.PushSubscription.optedIn;
    document.getElementById("sub-status").innerHTML =
      "ID: " + (id || "<span class='err'>Aucun</span>") + "<br>" +
      "Abonné: " + (opt ? "<span class='ok'>✅ OUI</span>" : "<span class='err'>❌ NON</span>");
    log("Subscription ID: " + id);
    log("Opted in: " + opt);
    
    if (!opt && Notification.permission === "granted") {
      log("Tentative d'abonnement automatique…");
      try {
        await OneSignal.User.PushSubscription.optIn();
        log("✅ Abonnement réussi");
      } catch(e) {
        log("❌ Erreur abonnement: " + e.message);
      }
    }
  } catch(e) {
    log("❌ Erreur init: " + e.message);
    document.getElementById("os-status").innerHTML = "<span class='err'>❌ " + e.message + "</span>";
  }
});

const s = document.createElement("script");
s.src = "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
s.defer = true;
document.head.appendChild(s);
log("Script OneSignal injecté dans la page");
</script>
</body>
</html>
