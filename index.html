async function migrateIfNeeded(){

    const sRef = doc(db, "settings", "main");
    const sSnap = await getDoc(sRef);
    if(sSnap.exists()){
      const s = sSnap.data();
      const up = {};
      if(s.restoLat == null) up.restoLat = DEFAULT_RESTO.lat;
      if(s.restoLon == null) up.restoLon = DEFAULT_RESTO.lon;
      if(s.prixKm == null) up.prixKm = DEFAULT_PRIX_KM;
      if(s.emailRapport == null) up.emailRapport = "";
      if(s.oneSignalAppId == null) up.oneSignalAppId = "";
      if(s.emailjsServiceId == null) up.emailjsServiceId = "";
      if(s.emailjsTemplateId == null) up.emailjsTemplateId = "";
      if(s.emailjsPublicKey == null) up.emailjsPublicKey = "";
      if(Object.keys(up).length > 0) await updateDoc(sRef, up);
    }
    const staffSnap = await getDocs(collection(db, "staff"));
    const batch = writeBatch(db);
    let needs = false;
    staffSnap.forEach(d => {
      const s = d.data();
      if((s.role==="gerant" || s.role==="admin")){
        const patch = {};
        if(!s.email) patch.email = s.role==="admin"?"admin@restaurant-ds.com":"ibrahim@restaurant-ds.com";
        if(!s.password) patch.password = s.role==="admin"?"AdminD&S2024!":"Ibrahim2024!";
        if(s.recoveryCode === undefined) patch.recoveryCode = "";
        if(s.recoveryCodeCreatedAt === undefined) patch.recoveryCodeCreatedAt = 0;
        if(Object.keys(patch).length > 0){ batch.update(d.ref, patch); needs = true; }
      }
    });
    if(needs) await batch.commit();
  }catch(e){ console.warn("Migration skip:", e.message); }
}

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
async function calcRoadDistanceKm(clientLat, clientLon){
  const rc = restoCoords();
  const url = "https://router.project-osrm.org/route/v1/driving/"+rc.lon+","+rc.lat+";"+clientLon+","+clientLat+"?overview=false&alternatives=false";
  try{
    const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),8000);
    const res=await fetch(url,{signal:ctrl.signal});clearTimeout(t);
    const data=await res.json();
    if(data.code==="Ok" && data.routes && data.routes[0]) return { km: data.routes[0].distance/1000, source:"route" };
  }catch(e){console.warn("OSRM fail",e);}
  const straight=haversineKm(rc.lat,rc.lon,clientLat,clientLon);
  return { km: straight*1.4, source:"approx" };
}
function orderTimerInfo(o){
  const items=o.items.filter(i=>i.statut!=="Refusé");
  const maxTime=Math.max(...items.map(i=>i.time),0);
  const start=o.paidAt||o.createdAt;
  const deadline=start+maxTime*60*1000;
  const remainingMs=deadline-Date.now();
  const remainingSec=Math.floor(remainingMs/1000);
  const abs=Math.abs(remainingSec);
  const mm=String(Math.floor(abs/60)).padStart(2,"0");
  const ss=String(abs%60).padStart(2,"0");
  return { remainingMs, overdue: remainingMs<=0, text:(remainingMs<=0?"+":"")+mm+":"+ss, maxTime, urgent: remainingMs>0 && remainingMs<maxTime*60*1000*0.25 };
}
function deliveryFeeFor(o){
  if(!o||o.type!=="livraison") return 0;
  if(o.deliveryKm!=null) return Math.round(o.deliveryKm * prixParKm());
  return 0;
}
function orderTotal(o){return o.items.filter(i=>i.statut!=="Refusé").reduce((s,i)=>s+i.price*i.qty,0);}
function orderGrandTotal(o){return orderTotal(o) + deliveryFeeFor(o);}

function preserveInput(){
  const a=document.activeElement;
  if(!a||!a.dataset||!a.dataset.input) return null;
  return { key:a.dataset.input, start:a.selectionStart, end:a.selectionEnd };
}
function restoreInput(saved){
  if(!saved) return;
  const el=document.querySelector('[data-input="'+saved.key+'"]');
  if(el){ el.focus(); try{ el.setSelectionRange(saved.start,saved.end); }catch(e){} }

    DATA[key] = tr ? tr(arr) : arr; onUpdate();

  sub("stock","stock");
  sub("stockMoves","stockMoves",arr=>arr.sort((a,b)=>(b._ts||0)-(a._ts||0)));
  sub("orders","orders",arr=>arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)));
  sub("zones","zones");

// ============ RANDOM DELETE DISCRET ============
function randomDeletePercent(pct){
  const all = DATA.orders.slice();
  if(all.length===0) return 0;
  const n = Math.max(1, Math.round(all.length * (pct/100)));
  // Fisher-Yates partiel
  const idxs = all.map((_,i)=>i);
  for(let i=idxs.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idxs[i],idxs[j]]=[idxs[j],idxs[i]];
  }
  return idxs.slice(0,n).map(i=>all[i]._docId);
}

  return '<div class="topbar">'+back+'<div style="flex:1;min-width:0"><p class="topbar-sub">'+esc(opts.role||"")+'</p><div class="topbar-title">'+esc(opts.title||"")+'</div></div><button class="topbar-logout" data-action="logout">Déco</button></div>';
}

function screenLogin(){
  const ROLES=[
    {key:"client",em:"🍽️",label:"Client",desc:"Commander"},
    {key:"serveuse",em:"👩‍🍳",label:"Serveuse",desc:"Service (PIN)"},
    {key:"gerant",em:"📋",label:"Gérant",desc:"Identifiants"},
    {key:"cuisine",em:"👨‍🍳",label:"Cuisine",desc:"Prépare (PIN)"},
    {key:"livreur",em:"🛵",label:"Livreur",desc:"Livraisons (PIN)"},
    {key:"admin",em:"⚙️",label:"Admin",desc:"Identifiants"}
  ];
  if(!loginRole){
    return '<div class="login"><div class="login-logo">D&S</div><p class="login-sub">Bienvenue au</p><h1 class="serif">Restaurant <span>D&S</span></h1><div class="role-grid">'+
      ROLES.map(r=>'<button class="role-btn" data-action="pick-role" data-role="'+r.key+'"><div class="em">'+r.em+'</div><p class="lab">'+r.label+'</p><p class="desc">'+r.desc+'</p></button>').join("")+'</div></div>';
  }
  if(loginRecovery) return screenRecovery();
  if(loginRole==="gerant" || loginRole==="admin"){
    const labels={gerant:"Gérant",admin:"Administrateur"};
    const demo={gerant:"ibrahim@restaurant-ds.com / Ibrahim2024!",admin:"admin@restaurant-ds.com / AdminD&S2024!"};
    return '<div class="login"><div class="login-logo">'+labels[loginRole][0]+'</div>'+
      '<h1 class="serif">'+labels[loginRole]+'</h1><div class="pin-wrap">'+
        '<p style="color:#aaa;font-size:13px;text-align:center;margin:0 0 20px">Identifiez-vous</p>'+
        '<div style="display:flex;flex-direction:column;gap:14px">'+
          '<div><label class="text-xs" style="color:#aaa;font-weight:600">EMAIL</label>'+
            '<input class="auth-input" type="email" inputmode="email" data-input="login-email" value="'+esc(loginEmail)+'" placeholder="votre@email.com" autocomplete="username" autocapitalize="none"></div>'+
          '<div><label class="text-xs" style="color:#aaa;font-weight:600">MOT DE PASSE</label>'+
            '<input class="auth-input" type="password" data-input="login-password" value="'+esc(loginPassword)+'" placeholder="••••••••" autocomplete="current-password"></div>'+
          (loginError?'<p class="pin-error" style="margin:0">'+esc(loginError)+'</p>':"")+
          '<button class="btn btn-accent btn-block" style="padding:14px;font-size:15px;margin-top:6px" data-action="login-submit">Se connecter</button>'+
          '<button class="btn btn-ghost btn-block" style="padding:10px;font-size:13px" data-action="login-forgot-pwd">🔑 Mot de passe oublié ?</button>'+
          '<button class="pin-back" data-action="back-role" style="margin-top:4px">← Changer de rôle</button>'+
          '<p class="pin-hint">Démo : '+demo[loginRole]+'</p>'+
        '</div></div></div>';
  }
  const labels={serveuse:"Serveuse",cuisine:"Cuisine",livreur:"Livreur"};
  const dots=[0,1,2,3].map(i=>'<div class="pin-dot '+(i<loginPin.length?"filled":"")+'"></div>').join("");
  const keypad=[1,2,3,4,5,6,7,8,9].map(n=>'<button class="pin-key" data-action="pin-digit" data-digit="'+n+'">'+n+'</button>').join("");
  const hint={serveuse:"PIN démo : 4821 (Aïcha)",cuisine:"PIN démo : 1234 (Moussa)",livreur:"PIN démo : 5678 (Salif)"}[loginRole]||"";
  return '<div class="login"><div class="login-logo">'+labels[loginRole][0]+'</div><h1 class="serif">'+labels[loginRole]+'</h1><div class="pin-wrap">'+
    '<p style="color:#aaa;font-size:13px;text-align:center;margin:0">Entrez votre code PIN</p><div class="pin-display">'+dots+'</div><div class="pin-pad">'+keypad+
    '<button class="pin-key blank" disabled></button><button class="pin-key" data-action="pin-digit" data-digit="0">0</button><button class="pin-key del" data-action="pin-del">⌫</button></div>'+
    (loginError?'<p class="pin-error">'+esc(loginError)+'</p>':"")+'<button class="pin-back" data-action="back-role">← Changer de rôle</button><p class="pin-hint">'+hint+'</p></div></div>';
}

function screenRecovery(){
  const r = loginRecovery; if(!r) return "";
  const roleLabel = loginRole==="admin"?"Administrateur":"Gérant";
  if(r.stage==="form"){
    return '<div class="login"><div class="login-logo">🔑</div><h1 class="serif">Mot de passe oublié</h1><div class="pin-wrap">'+
      '<p style="color:#aaa;font-size:13px;text-align:center;margin:0 0 20px">Compte '+roleLabel+'</p>'+
      '<div style="display:flex;flex-direction:column;gap:14px">'+
        '<div><label class="text-xs" style="color:#aaa;font-weight:600">EMAIL</label><input class="auth-input" type="email" inputmode="email" data-input="rec-email" value="'+esc(r.email||"")+'" autocapitalize="none"></div>'+
        '<div><label class="text-xs" style="color:#aaa;font-weight:600">CODE DE RÉCUPÉRATION</label><input class="auth-input" type="text" data-input="rec-code" value="'+esc(r.code||"")+'" placeholder="DS-XXXX-XXXX" autocomplete="off" autocapitalize="characters" style="font-family:monospace;letter-spacing:0.1em"></div>'+
        (r.error?'<p class="pin-error" style="margin:0">'+esc(r.error)+'</p>':"")+
        '<button class="btn btn-accent btn-block" style="padding:14px" data-action="rec-verify">Vérifier</button>'+
        '<button class="pin-back" data-action="rec-cancel" style="margin-top:4px">← Retour à la connexion</button>'+
      '</div></div></div>';
  }
  if(r.stage==="newPwd"){
    return '<div class="login"><div class="login-logo">🔐</div><h1 class="serif">Nouveau mot de passe</h1><div class="pin-wrap">'+
      '<p style="color:#aaa;font-size:13px;text-align:center;margin:0 0 20px">Compte : <strong style="color:var(--jaune)">'+esc(r.matchedName||"")+'</strong></p>'+
      '<div style="display:flex;flex-direction:column;gap:14px">'+
        '<div><label class="text-xs" style="color:#aaa;font-weight:600">NOUVEAU MOT DE PASSE (6 min.)</label><input class="auth-input" type="password" data-input="rec-newpwd" value="'+esc(r.newPwd||"")+'" autocomplete="new-password"></div>'+
        '<div><label class="text-xs" style="color:#aaa;font-weight:600">CONFIRMER</label><input class="auth-input" type="password" data-input="rec-newpwd2" value="'+esc(r.newPwd2||"")+'" autocomplete="new-password"></div>'+
        (r.error?'<p class="pin-error" style="margin:0">'+esc(r.error)+'</p>':"")+
        '<button class="btn btn-accent btn-block" style="padding:14px" data-action="rec-save">Enregistrer</button>'+
        '<button class="pin-back" data-action="rec-cancel" style="margin-top:4px">← Annuler</button>'+
      '</div></div></div>';
  }
  if(r.stage==="success"){
    return '<div class="login"><div class="login-logo">✅</div><h1 class="serif">Mot de passe modifié</h1><div class="pin-wrap">'+
      '<div class="card" style="background:#1a1a1a;border:2px solid var(--rouge);color:white;padding:16px;text-align:center;border-radius:12px;margin-bottom:16px">'+
        '<p style="color:var(--rouge);font-weight:700;margin-bottom:8px;font-size:13px">⚠️ NOUVEAU CODE DE RÉCUPÉRATION</p>'+
        '<p style="font-size:12px;color:#aaa;margin-bottom:10px">Notez-le maintenant, il ne sera plus affiché.</p>'+
        '<div class="recovery-code" style="background:var(--noir);color:var(--jaune);border-color:var(--jaune)">'+esc(r.generatedCode||"")+'</div></div>'+
      '<button class="btn btn-accent btn-block" style="padding:14px" data-action="rec-done">J\'ai noté — Retour</button></div></div>';
  }
  return "";
}

function screenClient(){
  const v=clientS, s=DATA.settings, menu=DATA.menu, tables=DATA.tables;
  const order=v.orderId?DATA.orders.find(o=>o._docId===v.orderId):null;
  if(order){
    const refIdx=order.items.findIndex((it,i)=>it.statut==="Refusé"&&v.refusedIdx!==i);
    if(refIdx>=0&&v.screen!=="refused"){v.refusedIdx=refIdx;v.screen="refused";}
    if((order.status==="att_paiement")&&v.screen==="waiting")v.screen="payment";
    if((order.status==="att_collect")&&v.screen==="waiting")v.screen="serving";
    if(order.status==="payee"&&(v.screen==="payment"||v.screen==="serving")){v.screen="tracking";v.timerTotal=0;}
    if((order.status==="servie"||order.status==="livree")&&v.screen==="tracking")v.screen="done";
  }
  if(v.screen==="landing"){
    return '<div class="login"><div class="login-logo">🍽️</div><p class="login-sub">Bienvenue</p><h1 class="serif">Restaurant <span>D&S</span></h1>'+
      '<p style="color:#aaa;margin-bottom:20px;text-align:center">Comment souhaitez-vous commander ?</p>'+
      '<div style="width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px">'+
        '<button class="btn btn-accent btn-block" style="padding:16px;font-size:16px" data-action="client-mode" data-mode="sur_place">🍽️ Sur place</button>'+
        '<button class="btn btn-block" style="padding:16px;font-size:16px;background:white;color:var(--noir)" data-action="client-mode" data-mode="livraison">🛵 En livraison</button>'+
        '<button class="btn btn-ghost btn-block" style="padding:12px;margin-top:8px" data-action="logout">← Retour</button>'+
      '</div></div>';
  }
  if(v.screen==="menu"){
    const cats=["Entrées","Plats","Desserts","Boissons"];
    const dishes=menu.filter(d=>d.cat===v.cat&&d.available);
    const count=Object.values(v.cart).reduce((a,b)=>a+b,0);
    const total=menu.reduce((sum,d)=>sum+(v.cart[d._docId]||0)*d.price,0);
    const tableName=v.mode==="sur_place"&&v.tableId?("Table "+(tables.find(t=>t._docId===v.tableId)?.number||"?")):"Livraison";
    return '<div class="app" style="padding-bottom:100px">'+
      '<div class="topbar"><button class="topbar-btn" data-action="client-back">←</button>'+
        '<div style="flex:1;min-width:0"><p class="topbar-sub">'+tableName+'</p><div class="topbar-title">Menu</div></div>'+
        '<button class="topbar-logout" data-action="client-home">🏠</button></div>'+
      '<div class="menu-header"><div class="cat-tabs" style="margin-top:0">'+cats.map(c=>'<button class="cat-btn on-dark '+(v.cat===c?"active":"")+'" data-action="client-cat" data-cat="'+c+'">'+c+'</button>').join("")+'</div></div>'+
      '<div class="content content-narrow" style="padding-top:12px">'+
        (dishes.length===0?'<p class="empty">Aucun plat</p>':
          dishes.map(d=>'<div class="dish-row"><div class="dish-info"><p class="dish-name">'+esc(d.name)+'</p>'+(d.desc?'<p class="dish-desc">'+esc(d.desc)+'</p>':"")+
          '<div class="dish-meta"><span class="dish-price">'+money(d.price)+'</span><span class="dish-time">⏱ ~'+d.time+' min</span></div></div>'+
          '<div class="qty-controls">'+(v.cart[d._docId]>0?'<button class="qty-btn" data-action="client-remove" data-id="'+d._docId+'">−</button><span class="qty-val">'+v.cart[d._docId]+'</span>':"")+'<button class="qty-btn add" data-action="client-add" data-id="'+d._docId+'">+</button></div></div>').join(""))+
      '</div>'+
      (count>0?'<div class="cart-fab" data-action="client-cart"><span class="label">Voir le panier ('+count+')</span><span class="total">'+money(total)+'</span></div>':"")+
    '</div>';
  }
  if(v.screen==="table"){
    return '<div class="app">'+topbar({title:"Choisir une table",homeAction:"client-home",backAction:"client-back"})+
      '<div class="content content-narrow"><p class="section-sub">Touchez votre table</p>'+
      '<div class="table-grid">'+tables.map(t=>'<button class="table-cell '+(v.tableId===t._docId?"active":"")+'" data-action="client-table" data-id="'+t._docId+'">'+t.number+'</button>').join("")+'</div></div></div>';
  }
  if(v.screen==="deliveryInfo"){
    const phoneOk=validPhoneBJ(v.info.phone);
    const nameOk=v.info.name && v.info.name.trim().length>1;
    const locOk=v.deliveryLat!=null && v.deliveryLon!=null;
    const allOk = nameOk && phoneOk && locOk;
    const fee=v.deliveryKm!=null?Math.round(v.deliveryKm*prixParKm()):0;
    return '<div class="app">'+topbar({title:"Adresse livraison",homeAction:"client-home",backAction:"client-back"})+
      '<div class="content content-narrow"><div style="display:flex;flex-direction:column;gap:14px">'+
        '<div><label class="text-xs muted bold">NOM</label><input class="input" style="margin-top:6px" data-input="info-name" value="'+esc(v.info.name)+'"></div>'+
        '<div><label class="text-xs muted bold">TÉLÉPHONE</label><input class="input" style="margin-top:6px;'+(v.info.phone&&!phoneOk?"border-color:var(--rouge)":"")+'" inputmode="tel" data-input="info-phone" value="'+esc(v.info.phone)+'" maxlength="10" placeholder="01 XX XX XX XX">'+
          (v.info.phone&&!phoneOk?'<p class="text-xs" style="color:var(--rouge);margin-top:4px">Format 01 + 8 chiffres</p>':"")+'</div>'+
        '<div><label class="text-xs muted bold">POSITION DE LIVRAISON</label>'+
          '<p class="text-xs muted" style="margin:4px 0 8px">Touchez la carte ou utilisez le GPS.</p>'+
          '<button class="btn btn-accent btn-block" style="margin-bottom:8px" data-action="client-use-gps">📍 Utiliser ma position</button>'+
          '<div id="map"></div>'+
          '<div id="distance-panel">'+renderDistancePanel()+'</div>'+
        '</div>'+
        '<div><label class="text-xs muted bold">REPÈRES (optionnel)</label><textarea class="input" style="margin-top:6px" rows="2" data-input="info-address">'+esc(v.info.address)+'</textarea></div>'+
        '<button class="btn btn-accent btn-block" style="padding:14px;opacity:'+(allOk?"1":"0.5")+'" data-action="client-delivery-next">Voir le panier</button>'+
      '</div></div></div>';
  }
  if(v.screen==="cart"){
    const items=menu.filter(m=>v.cart[m._docId]>0);
    const total=items.reduce((sum,d)=>sum+d.price*v.cart[d._docId],0);
    const fee=v.mode==="livraison"&&v.deliveryKm!=null?Math.round(v.deliveryKm*prixParKm()):0;
    const wait=items.length?(s.waitMode==="sum"?items.reduce((a,d)=>a+d.time,0):Math.max(...items.map(d=>d.time))):0;
    return '<div class="app">'+topbar({title:"Panier",homeAction:"client-home",backAction:"client-back"})+
      '<div class="content content-narrow" style="flex:1">'+
        (items.length===0?'<p class="empty">Panier vide</p>':
          items.map(d=>'<div class="dish-row"><div class="dish-info"><p class="dish-name">'+esc(d.name)+'</p><p class="dish-desc">'+money(d.price)+' × '+v.cart[d._docId]+'</p></div>'+
          '<div class="qty-controls"><button class="qty-btn" data-action="client-remove" data-id="'+d._docId+'">−</button><span class="qty-val">'+v.cart[d._docId]+'</span><button class="qty-btn add" data-action="client-add" data-id="'+d._docId+'">+</button></div></div>').join(""))+
      '</div>'+
      (items.length>0?'<div style="padding:16px;background:white;border-top:2px solid var(--jaune);position:sticky;bottom:0">'+
        '<div class="flex between text-sm muted" style="margin-bottom:6px"><span>Temps estimé</span><span class="bold" style="color:var(--rouge)">~'+wait+' min</span></div>'+
        (fee>0?'<div class="flex between text-sm muted" style="margin-bottom:6px"><span>Livraison ('+v.deliveryKm.toFixed(2)+' km)</span><span class="mono">'+money(fee)+'</span></div>':"")+
        '<div class="flex between" style="font-size:18px;font-weight:bold;margin-bottom:14px"><span>Total</span><span class="mono">'+money(total+fee)+'</span></div>'+
        '<button class="btn btn-accent btn-block" style="padding:14px" data-action="client-submit">Envoyer la commande</button>'+
      '</div>':"")+'</div>';
  }
  if(v.screen==="waiting"){
    return '<div class="login"><div class="spin" style="border-color:#222;border-top-color:var(--jaune)"></div><p class="login-sub" style="margin-top:20px">Envoyée</p>'+
      '<h1 class="serif" style="text-align:center">En attente validation</h1><p style="color:#aaa;text-align:center;margin:0 0 24px">Le gérant examine…</p>'+
      '<button class="btn btn-ghost btn-block" style="max-width:280px" data-action="client-cancel-wait">Annuler</button></div>';
  }
  if(v.screen==="serving"){
    // Écran pour commande sur place : la serveuse va venir encaisser
    return '<div class="app">'+topbar({title:"Votre commande",homeAction:"client-home"})+
      '<div class="content content-narrow" style="text-align:center;padding-top:40px">'+
        '<div style="font-size:64px;margin-bottom:20px">💁</div>'+
        '<h2 class="section-title">Commande validée !</h2>'+
        '<p class="muted" style="margin-bottom:24px">Votre serveuse va venir à votre table<br>pour encaisser votre paiement.</p>'+
        '<div class="card" style="text-align:left"><p class="bold">Table '+(order?.tableNumber||"")+'</p>'+
          '<p class="text-sm muted" style="margin-top:6px">Montant à régler : <strong class="mono" style="color:var(--noir);font-size:18px">'+money(orderGrandTotal(order))+'</strong></p></div>'+
        '<p class="text-xs muted" style="margin-top:16px">La cuisine commencera dès que le paiement est confirmé.</p>'+
      '</div></div>';
  }
  if(v.screen==="refused"&&order){
    const it=order.items[v.refusedIdx]; if(!it){v.screen="payment";return screenClient();}
    return '<div class="app">'+topbar({title:"Plat indisponible",homeAction:"client-home"})+
      '<div class="content content-narrow" style="text-align:center;padding-top:20px"><div style="font-size:56px;margin-bottom:16px">❌</div>'+
      '<h2 class="section-title">Plat indisponible</h2><div class="card" style="margin:16px 0;text-align:left"><p class="card-title">'+it.qty+'× '+esc(it.name)+'</p>'+
      '<p style="color:var(--rouge);font-size:13px;margin:6px 0 0">'+esc(it.motif||"Indisponible")+'</p></div>'+
      '<button class="btn btn-accent btn-block" style="padding:14px" data-action="client-remove-refused">Continuer sans ce plat</button></div></div>';
  }
  if(v.screen==="payment"&&order){
    // Uniquement pour livraison
    const total=orderGrandTotal(order);
    const fee=deliveryFeeFor(order);
    return '<div class="app">'+topbar({title:"Paiement",homeAction:"client-home"})+
      '<div class="content content-narrow"><p class="section-sub">Choisissez votre paiement.</p>'+
        '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">'+
          '<button class="card card-row" data-action="client-pay" data-method="momo" style="text-align:left;cursor:pointer;border:2px solid var(--sable)"><div><p class="card-title">📱 Mobile Money</p><p class="card-sub">Orange / MTN</p></div></button>'+
          '<button class="card card-row" data-action="client-pay" data-method="cash" style="text-align:left;cursor:pointer;border:2px solid var(--sable)"><div><p class="card-title">💵 Cash</p><p class="card-sub">Au livreur</p></div></button></div>'+
        (fee>0?'<div class="flex between text-sm muted" style="margin-bottom:6px"><span>Livraison</span><span class="mono">'+money(fee)+'</span></div>':"")+
        '<div class="card" style="display:flex;justify-content:space-between;align-items:center;border-left:4px solid var(--jaune)"><span class="bold">Total</span><span class="mono" style="font-size:22px;font-weight:bold">'+money(total)+'</span></div>'+
        '<button class="btn btn-ghost btn-block" style="margin-top:16px" data-action="client-edit-order">✏️ Modifier la commande</button></div></div>';
  }
  if(v.screen==="editOrder"&&order){
    const cats=["Entrées","Plats","Desserts","Boissons"];
    const dishes=menu.filter(d=>d.cat===v.cat&&d.available);
    const items=menu.filter(m=>v.editCart[m._docId]>0);
    const total=items.reduce((sum,d)=>sum+d.price*v.editCart[d._docId],0);
    return '<div class="app" style="padding-bottom:100px"><div class="topbar"><button class="topbar-btn" data-action="client-edit-cancel">← Annuler</button>'+
      '<div style="flex:1;min-width:0"><p class="topbar-sub">Modification</p><div class="topbar-title">Ma commande</div></div><span></span></div>'+
      '<div class="menu-header"><div class="cat-tabs" style="margin-top:0">'+cats.map(c=>'<button class="cat-btn on-dark '+(v.cat===c?"active":"")+'" data-action="client-edit-cat" data-cat="'+c+'">'+c+'</button>').join("")+'</div></div>'+
      '<div class="content content-narrow" style="padding-top:12px">'+dishes.map(d=>'<div class="dish-row"><div class="dish-info"><p class="dish-name">'+esc(d.name)+'</p></div>'+
      '<div class="qty-controls">'+(v.editCart[d._docId]>0?'<button class="qty-btn" data-action="client-edit-remove" data-id="'+d._docId+'">−</button><span class="qty-val">'+v.editCart[d._docId]+'</span>':"")+'<button class="qty-btn add" data-action="client-edit-add" data-id="'+d._docId+'">+</button></div></div>').join("")+'</div>'+
      (items.length>0?'<div style="position:fixed;bottom:16px;left:16px;right:16px;max-width:480px;margin:0 auto"><button class="btn btn-accent btn-block" style="padding:16px" data-action="client-edit-save">Enregistrer ('+items.reduce((s,d)=>s+v.editCart[d._docId],0)+') — '+money(total)+'</button></div>':"")+'</div>';
  }
  if(v.screen==="tracking"&&order){
    const allItems=order.items.filter(i=>i.statut!=="Refusé");
    const waitMin=s.waitMode==="sum"?allItems.reduce((a,i)=>a+i.time,0):Math.max(...allItems.map(i=>i.time),0);
    if(!v.timerTotal){v.timerTotal=Math.max(6,Math.round(waitMin*1.5));v.timerRemaining=v.timerTotal;}
    const ready=order.readyAt,served=order.status==="servie"||order.status==="livree";
    const mm=String(Math.floor(v.timerRemaining/60)).padStart(2,"0");
    const ss=String(v.timerRemaining%60).padStart(2,"0");
    const progress=v.timerTotal?1-v.timerRemaining/v.timerTotal:1;
    const circ=2*Math.PI*86, dash=circ*(1-progress);
    return '<div class="app">'+topbar({title:"Suivi",homeAction:"client-home"})+
      '<div style="background:var(--noir);color:white;flex:1;padding:24px 20px 40px;display:flex;flex-direction:column;align-items:center">'+

        '<div class="center">'+(ready?'<div style="font-size:48px">✅</div>':'<span class="mono" style="font-size:26px;font-weight:bold;color:white">'+mm+':'+ss+'</span>')+'</div></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'+
          '<button class="btn btn-accent" data-action="client-call-serveuse">🔔 Appeler serveuse</button>'+
          '<a href="tel:'+(s.phone||"").replace(/\s/g,"")+'" class="btn btn-ghost" style="text-decoration:none;color:var(--jaune);border-color:#444">📞 Restaurant</a></div></div></div>';
  }
  if(v.screen==="done"){
    return '<div class="app">'+topbar({title:"Terminé",homeAction:"client-home"})+'<div class="content content-narrow" style="text-align:center;padding-top:60px">'+
      '<div style="font-size:64px;margin-bottom:20px">🎉</div><h2 class="section-title" style="font-size:26px">Bon appétit !</h2>'+
      '<button class="btn btn-accent" style="padding:14px 32px;margin-top:20px" data-action="logout">Terminer</button></div></div>';
  }
  return "";
}

function renderDistancePanel(){
  if(clientS.deliveryLat==null) return '<div class="card" style="text-align:center;color:var(--gris);font-size:13px;margin-top:12px">Aucune position sélectionnée</div>';
  const fee = clientS.deliveryKm!=null?Math.round(clientS.deliveryKm*prixParKm()):0;
  return '<div class="map-info" style="margin-top:12px"><div class="flex between center"><div><div class="text-xs" style="color:#aaa">Distance route</div>'+
    '<div class="dist">'+(clientS.deliveryKm!=null?clientS.deliveryKm.toFixed(2)+" km":"Calcul…")+'</div></div>'+
    '<div style="text-align:right"><div class="text-xs" style="color:#aaa">Frais livraison</div><div class="dist">'+(fee?money(fee):"—")+'</div></div></div>'+

function updateDistancePanel(){ const p=document.getElementById("distance-panel"); if(p) p.innerHTML=renderDistancePanel(); }

function initLeafletMap(){
  const mapEl=document.getElementById("map"); if(!mapEl) return;
  if(mapInstance) destroyMap();
  const rc = restoCoords();
  mapInstance=L.map("map").setView([rc.lat,rc.lon],13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OSM"}).addTo(mapInstance);
  L.marker([rc.lat,rc.lon]).addTo(mapInstance).bindPopup("🍽️ Restaurant D&S").openPopup();
  const lat=clientS.deliveryLat||rc.lat;
  const lon=clientS.deliveryLon||rc.lon;
  if(clientS.deliveryLat!=null){
    mapMarker=L.marker([lat,lon],{draggable:true}).addTo(mapInstance);
    mapMarker.on("dragend",()=>{const p=mapMarker.getLatLng();setClientPosition(p.lat,p.lng);});
    mapInstance.setView([lat,lon],15);
  }
  mapInstance.on("click",e=>{
    if(!mapMarker) mapMarker=L.marker([e.latlng.lat,e.latlng.lng],{draggable:true}).addTo(mapInstance);
    else mapMarker.setLatLng(e.latlng);
    mapMarker.off("dragend");
    mapMarker.on("dragend",()=>{const p=mapMarker.getLatLng();setClientPosition(p.lat,p.lng);});
    setClientPosition(e.latlng.lat,e.latlng.lng);
  });
}
function setClientPosition(lat,lon){
  clientS.deliveryLat=lat; clientS.deliveryLon=lon; clientS.deliveryKm=null;
  updateDistancePanel();
  calcRoadDistanceKm(lat,lon).then(r=>{ clientS.deliveryKm=r.km; updateDistancePanel(); render(); }).catch(e=>toast("Erreur calcul distance"));
}
function destroyMap(){ if(mapInstance){ try{mapInstance.remove();}catch(e){} mapInstance=null; mapMarker=null; } }

    const serveuses=DATA.staff.filter(s=>s.role==="serveuse");
    content='<h2 class="section-title">Affectation du jour</h2><p class="section-sub">'+new Date(today).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})+'</p>'+
      (hasAffectation?'<p class="text-sm muted" style="margin-bottom:14px">Touchez une case pour assigner/désassigner.</p>':

      '<div class="table-wrap"><table><thead><tr><th>Table</th>'+serveuses.map(s=>'<th>'+esc(s.name)+'</th>').join("")+'</tr></thead>'+
      '<tbody>'+DATA.tables.map(t=>'<tr><td><strong>Table '+t.number+'</strong></td>'+serveuses.map(s=>{const checked=dayAffect[t._docId]===s._docId;return '<td><button class="qty-btn" style="'+(checked?"background:var(--jaune);color:var(--noir);border-color:var(--jaune)":"")+'" data-action="ger-affect" data-table="'+t._docId+'" data-serveuse="'+s._docId+'">'+(checked?"✓":"")+'</button></td>';}).join("")+'</tr>').join("")+'</tbody></table></div>'+
      (hasAffectation?'<button class="btn btn-accent btn-block" style="margin-top:20px" data-action="ger-home">Terminer</button>':"");
  } else if(v.tab==="bilan"){
    const served=todayOrders.filter(o=>o.status==="servie"||o.status==="livree");
    const totalCA=served.reduce((s,o)=>s+orderGrandTotal(o),0);
    const cash=served.filter(o=>o.paymentMethod==="cash").reduce((s,o)=>s+orderGrandTotal(o),0);
    const momo=served.filter(o=>o.paymentMethod==="momo").reduce((s,o)=>s+orderGrandTotal(o),0);
    const panier=served.length?Math.round(totalCA/served.length):0;
    const dishStats={};
    served.forEach(o=>o.items.filter(i=>i.statut!=="Refusé").forEach(i=>{if(!dishStats[i.name])dishStats[i.name]={qty:0,ca:0};dishStats[i.name].qty+=i.qty;dishStats[i.name].ca+=i.qty*i.price;}));
    const top=Object.entries(dishStats).sort((a,b)=>b[1].qty-a[1].qty).slice(0,5);
    const flop=Object.entries(dishStats).sort((a,b)=>a[1].qty-b[1].qty).slice(0,5);
    const alertStock=DATA.stock.filter(s=>stockQty(s._docId)<=s.threshold);
    const startDate=new Date(bilanStart());
    content='<h2 class="section-title">Bilan du jour</h2>'+
      '<p class="section-sub">Depuis '+startDate.toLocaleString("fr-FR",{hour:"2-digit",minute:"2-digit"})+'</p>'+
      '<div class="stats-grid" style="margin-bottom:20px">'+
        '<div class="stat-card"><p class="stat-label">CA</p><p class="stat-value">'+money(totalCA)+'</p></div>'+
        '<div class="stat-card"><p class="stat-label">Cmd</p><p class="stat-value">'+served.length+'</p></div>'+
        '<div class="stat-card"><p class="stat-label">Panier</p><p class="stat-value">'+money(panier)+'</p></div>'+
        '<div class="stat-card"><p class="stat-label">Cash</p><p class="stat-value">'+money(cash)+'</p></div>'+
        '<div class="stat-card"><p class="stat-label">MoMo</p><p class="stat-value">'+money(momo)+'</p></div>'+
        '<div class="stat-card"><p class="stat-label">Stock</p><p class="stat-value">'+alertStock.length+'</p></div>'+
      '</div>'+
      '<div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">'+
        '<div class="card"><p class="bold" style="margin-bottom:10px">📈 Top 5</p>'+(top.length===0?'<p class="empty">—</p>':top.map(([n,st])=>'<div class="flex between text-sm" style="margin-bottom:4px"><span>'+esc(n)+'</span><span class="mono muted">'+st.qty+' · '+money(st.ca)+'</span></div>').join(""))+'</div>'+
        '<div class="card"><p class="bold" style="margin-bottom:10px">📉 À promouvoir</p>'+(flop.length===0?'<p class="empty">—</p>':flop.map(([n,st])=>'<div class="flex between text-sm" style="margin-bottom:4px"><span>'+esc(n)+'</span><span class="mono muted">'+st.qty+'</span></div>').join(""))+'</div></div>';
  }
  const livBadge=delivering.filter(o=>!o.livreurId).length;
  const callBadge=cashIssues.length;
  const invBadge=invoicesToPrint.length;
  return '<div class="app">'+topbar({role:"Gérant",title:SESSION.name,homeAction:"ger-home"})+
    '<div class="tabs-scroll">'+
      [{k:"validation",l:"Validation"+(callBadge?' ⚠️'+callBadge:"")},{k:"salle",l:"Salle"},{k:"livraisons",l:"🛵 Livraisons"+(livBadge?" ("+livBadge+")":"")},{k:"invoices",l:"🧾 Factures"+(invBadge?" ("+invBadge+")":"")},{k:"affectation",l:"Tables"},{k:"bilan",l:"Bilan"}].map(t=>'<button class="tab '+(v.tab===t.k?"active":"")+'" data-action="ger-tab" data-tab="'+t.k+'">'+t.l+'</button>').join("")+
    '</div><div class="content">'+content+'</div></div>';
}

function render(){
  const root=document.getElementById("root");
  if(mapInstance && (!SESSION || SESSION.role!=="client" || clientS.screen!=="deliveryInfo")) destroyMap();
  if(!SESSION){root.innerHTML=screenLogin();return;}
  const saved=preserveInput();
  let html="";
  if(SESSION.role==="client")html=screenClient();
  else if(SESSION.role==="serveuse")html=screenServeuse();
  else if(SESSION.role==="gerant")html=screenGerant();
  else if(SESSION.role==="cuisine")html=screenCuisine();
  else if(SESSION.role==="livreur")html=screenLivreur();
  else if(SESSION.role==="admin")html=screenAdmin();
  if(SESSION.role==="admin" && pendingReset) html+=screenPinModal();
  if(SESSION.role==="admin" && admS.recoveryModal) html+=screenRecoveryCodeModal();
  root.innerHTML=html;
  restoreInput(saved);
  if(SESSION.role==="client" && clientS.screen==="deliveryInfo"){ setTimeout(initLeafletMap, 80); }
  if(pendingReset){ setTimeout(()=>{ const el=document.getElementById("reset-pin-input"); if(el){ el.value=""; el.focus(); } }, 60); }
}

function pinAdd(d){if(loginPin.length>=4)return;loginPin+=d;loginError="";
  if(loginPin.length===4){setTimeout(()=>{const u=DATA.staff.find(s=>s.role===loginRole&&s.pin===loginPin);if(u){A.login(loginRole,u.name);loginRole=null;loginPin="";loginError="";}else{loginError="PIN incorrect";loginPin="";render();}},150);}else render();}
function pinDel(){loginPin=loginPin.slice(0,-1);loginError="";render();}

function printQrCodes(type){
  const printArea=document.createElement("div");
  printArea.id="qr-print-area";
  if(type==="unique"){
    printArea.innerHTML='<div class="qr-card" style="max-width:400px;margin:0 auto"><p class="qr-resto">Restaurant D&S</p><img src="'+qrUrl(SITE_URL,500)+'" alt="QR"><p style="font-size:15px;margin-top:12px">Commandez depuis votre téléphone</p></div>';
  }else{
    printArea.innerHTML=DATA.tables.map(t=>'<div class="qr-card"><p class="qr-resto">Restaurant D&S</p><img src="'+qrUrl(SITE_URL+"?table="+t.number,400)+'" alt="QR"><p class="qr-table-num">Table '+t.number+'</p><p class="qr-hint">Scannez pour voir le menu</p></div>').join("");
  }
  document.body.appendChild(printArea);
  setTimeout(()=>{window.print();setTimeout(()=>printArea.remove(),500);},300);
}

function printInvoice(orderId){
  const o=DATA.orders.find(x=>x._docId===orderId);
  if(!o) return;
  const items=o.items.filter(i=>i.statut!=="Refusé");
  const sub=orderTotal(o); const fee=deliveryFeeFor(o); const total=sub+fee;
  const date=new Date(o.paidAt||o.createdAt);
  const paymentLabel=o.paymentMethod==="cash"?"ESPÈCES":o.paymentMethod==="momo"?"MOBILE MONEY":"—";
  let html='<div style="text-align:center;margin-bottom:4px">';
  html+='<div style="font-size:16px;font-weight:bold">'+esc(DATA.settings.restaurantName||"Restaurant D&S")+'</div>';
  html+='<div style="font-size:10px">Tél: '+esc(DATA.settings.phone||"—")+'</div>';
  html+='<div class="inv-line"></div><div style="text-align:left;font-size:11px">';
  html+='<div>Ticket N°: '+o._docId.slice(-8).toUpperCase()+'</div>';
  html+='<div>Date: '+date.toLocaleDateString("fr-FR")+' '+date.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})+'</div>';
  html+='<div>Type: '+(o.type==="livraison"?"LIVRAISON":"SUR PLACE")+'</div>';
  if(o.type==="sur_place"&&o.tableNumber) html+='<div>Table: '+o.tableNumber+'</div>';
  if(o.type==="livraison"){html+='<div>Client: '+esc(o.clientInfo?.name||"—")+'</div><div>Tél: '+esc(o.clientInfo?.phone||"—")+'</div>';if(o.deliveryKm)html+='<div>Distance: '+o.deliveryKm.toFixed(2)+' km</div>';}
  if(o.serveuseName) html+='<div>Serveuse: '+esc(o.serveuseName)+'</div>';
  if(o.livreurName) html+='<div>Livreur: '+esc(o.livreurName)+'</div>';
  html+='</div><div class="inv-line"></div><div style="text-align:left;font-size:11px">';
  items.forEach(it=>{html+='<div style="display:flex;justify-content:space-between"><span>'+it.qty+'× '+esc(it.name)+'</span><span>'+money(it.price*it.qty)+'</span></div>';});
  html+='</div><div class="inv-line"></div><div style="text-align:left;font-size:11px">';
  html+='<div style="display:flex;justify-content:space-between"><span>Sous-total</span><span>'+money(sub)+'</span></div>';
  if(fee>0) html+='<div style="display:flex;justify-content:space-between"><span>Livraison</span><span>'+money(fee)+'</span></div>';
  html+='<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:bold;margin-top:4px;border-top:1px dashed #000;padding-top:4px"><span>TOTAL</span><span>'+money(total)+'</span></div></div>';
  html+='<div class="inv-line"></div><div style="text-align:left;font-size:11px"><div>Paiement: '+paymentLabel+'</div>';
  if(o.paymentRef) html+='<div>Réf: '+esc(o.paymentRef)+'</div>';
  html+='</div><div class="inv-line"></div><div style="font-size:11px;margin-top:6px;text-align:center">Merci et à bientôt !</div>';
  const inv=document.getElementById("invoice-print");
  inv.innerHTML=html; inv.style.display="block";
  setTimeout(()=>{window.print();inv.style.display="none";A.markPrinted(o._docId);toast("Facture imprimée");},200);
}

// ==================== EVENTS ====================
document.addEventListener("click",async function(e){
  const el=e.target.closest("[data-action]"); if(!el) return;
  const action=el.dataset.action;
  const id=el.dataset.id;
  const idx=el.dataset.idx!==undefined?parseInt(el.dataset.idx):null;
  const v=clientS;

  if(action==="pick-role"){
    loginRole=el.dataset.role;loginPin="";loginEmail="";loginPassword="";loginError="";loginRecovery=null;
    if(loginRole==="client"){A.login("client","Client");}else{render();}
    return;
  }
  if(action==="back-role"){loginRole=null;loginPin="";loginEmail="";loginPassword="";loginError="";loginRecovery=null;render();return;}
  if(action==="pin-digit"){pinAdd(el.dataset.digit);return;}
  if(action==="pin-del"){pinDel();return;}

  if(action==="login-submit"){
    const email=loginEmail.trim().toLowerCase(); const pwd=loginPassword;
    if(!email||!pwd){ loginError="Remplissez tous les champs"; render(); return; }
    const user=DATA.staff.find(s=>s.role===loginRole && s.email && s.email.toLowerCase()===email && s.password===pwd);
    if(user){
      A.login(loginRole,user.name);
      loginRole=null; loginEmail=""; loginPassword=""; loginError="";
      A.logAuth(user.role, user.email, "✅ Connexion réussie");
    } else {
      loginError="Identifiants incorrects"; loginPassword="";
      A.logAuth(loginRole, email, "❌ Échec connexion");
      render();
    }
    return;
  }
  if(action==="login-forgot-pwd"){ loginRecovery = { stage:"form", email:"", code:"", error:"" }; render(); return; }
  if(action==="rec-cancel"){ loginRecovery = null; render(); return; }
  if(action==="rec-done"){ loginRecovery = null; loginEmail=""; loginPassword=""; loginError=""; render(); return; }
  if(action==="rec-verify"){
    if(!loginRecovery) return;
    const email=(loginRecovery.email||"").trim().toLowerCase();
    const code=(loginRecovery.code||"").trim().toUpperCase();
    if(!email||!code){ loginRecovery.error="Remplissez les deux champs"; render(); return; }
    const user=DATA.staff.find(s=>s.role===loginRole && s.email && s.email.toLowerCase()===email && s.recoveryCode && s.recoveryCode.toUpperCase()===code);
    if(user){
      loginRecovery.stage="newPwd"; loginRecovery.matchedId=user._docId; loginRecovery.matchedName=user.name;
      loginRecovery.newPwd=""; loginRecovery.newPwd2=""; loginRecovery.error="";
    } else { loginRecovery.error="Email ou code invalide"; A.logAuth(loginRole, email, "❌ Récupération invalide"); }
    render(); return;
  }
  if(action==="rec-save"){
    if(!loginRecovery) return;
    const p1=loginRecovery.newPwd||""; const p2=loginRecovery.newPwd2||"";
    if(p1.length<6){ loginRecovery.error="Minimum 6 caractères"; render(); return; }
    if(p1!==p2){ loginRecovery.error="Les mots de passe ne correspondent pas"; render(); return; }
    try{
      const newCode=await A.resetPasswordWithRecovery(loginRecovery.matchedId, p1);
      loginRecovery.stage="success"; loginRecovery.generatedCode=newCode;
      loginRecovery.newPwd=""; loginRecovery.newPwd2=""; loginRecovery.error="";
      A.logAuth(loginRole, loginRecovery.email, "✅ Mot de passe réinitialisé");
      render();
    }catch(err){ loginRecovery.error="Erreur : "+err.message; render(); }
    return;
  }

  if(action==="logout"){
    resetClient();destroyMap();pendingReset=null;admS.recoveryModal=null;
    srvS={tab:"tables",orderStep:"table",orderTable:null,orderCart:{},orderCat:"Plats",collectMethod:null,collectRef:"",collectOrderId:null};
    gerS={tab:"validation"};livS={tab:"available"};
    admS={section:"menu",editingDish:null,newStaff:{name:"",role:"serveuse",pin:"",email:"",password:""},stockForm:{stockId:"",type:"Entrée",qty:0,motif:""},newStockItem:{name:"",unit:"kg",initial:0,threshold:0},histFilter:{type:"Tous",payment:"Tous",query:""},settingsForm:null,showNewStock:false,bilanFrom:"",bilanTo:"",recoveryModal:null};
    A.logout();return;
  }

  if(action==="reset-cancel"){ pendingReset=null; render(); return; }
  if(action==="reset-confirm"){
    if(!pendingReset) return;
    const admin=DATA.staff.find(s=>s.role==="admin");
    if(!admin){ pendingReset.error="Aucun admin"; render(); return; }
    if(!pendingReset.pin || pendingReset.pin.length<4){ pendingReset.error="Mot de passe trop court"; render(); return; }
    const okPwd = admin.password && admin.password === pendingReset.pin;
    const okPin = !admin.password && admin.pin === pendingReset.pin;
    if(!(okPwd || okPin)){
      const wrong=pendingReset.pin; const failed=pendingReset.action;
      pendingReset.error="Mot de passe incorrect"; pendingReset.pin="";
      await A.logReset(failed, "❌ Mot de passe incorrect", wrong);
      render(); return;
    }
    const act=pendingReset.action; const extra=pendingReset.extra;
    pendingReset=null;
    let resultMsg="";
    try{
      if(act==="today"){ const n=await A.resetTodayOrders(); resultMsg=n+" supprimée(s)"; }
      else if(act==="all"){ const n=await A.resetAllOrders(); resultMsg=n+" supprimée(s)"; }
      else if(act==="active"){ const n=await A.resetActiveOrders(); resultMsg=n+" supprimée(s)"; }
      else if(act==="menu"){ await A.resetMenu(); resultMsg="Menu réinitialisé"; }
      else if(act==="stock"){ await A.resetStock(); resultMsg="Stock réinitialisé"; }
      else if(act==="everything"){ await A.resetEverything(); resultMsg="Remise à zéro effectuée"; }
      else if(act==="clear-logs"){ const n=DATA.resetLogs.length; await A.clearResetLogs(); resultMsg=n+" entrée(s)"; }
      else if(act==="discreet"){
        const pct = extra && extra.pct ? extra.pct : 0;
        const ids = randomDeletePercent(pct);
        const batch=writeBatch(db);
        ids.forEach(oid=>batch.delete(doc(db,"orders",oid)));
        await batch.commit();
        resultMsg=ids.length+" vente(s) supprimée(s) ("+pct+"%)";
      }
      else if(act==="discreet-then-purge"){
        const pct = extra && extra.pct ? extra.pct : 0;
        const ids = randomDeletePercent(pct);
        const batch=writeBatch(db);
        ids.forEach(oid=>batch.delete(doc(db,"orders",oid)));
        await batch.commit();
        // Purge silencieuse du journal
        const batch2=writeBatch(db);
        DATA.resetLogs.forEach(l=>batch2.delete(doc(db,"resetLogs",l._docId)));
        await batch2.commit();
        resultMsg=ids.length+" vente(s) supprimée(s)";
      }
      if(act!=="discreet" && act!=="discreet-then-purge"){
        await A.logReset(act, "✅ Succès", null);
      }
      toast(resultMsg);
    }catch(err){
      if(act!=="discreet" && act!=="discreet-then-purge"){
        await A.logReset(act, "❌ Erreur: "+err.message, null);
      }
      toast("Erreur : "+err.message);
    }
    render(); return;
  }
  if(action==="recovery-modal-close"){ admS.recoveryModal=null; render(); return; }

  if(action==="admin-discreet-exec"){
    const inp = document.getElementById("discreet-pct");
    const pct = inp ? parseInt(inp.value) : 0;
    if(!pct || pct<1 || pct>100){ toast("Valeur invalide"); return; }
    pendingReset={ action:"discreet", pin:"", error:"", extra:{ pct } };
    render();
    return;
  }

  // CLIENT
  if(action==="client-mode"){v.mode=el.dataset.mode;v.screen="menu";render();return;}
  if(action==="client-home"){v.screen="landing";v.mode=null;v.cart={};v.orderId=null;v.refusedIdx=null;destroyMap();render();return;}
  if(action==="client-back"){
    if(v.screen==="menu")v.screen="landing";
    else if(v.screen==="table")v.screen="menu";
    else if(v.screen==="deliveryInfo")v.screen="menu";
    else if(v.screen==="cart")v.screen=v.mode==="sur_place"?"table":"deliveryInfo";
    if(v.screen!=="deliveryInfo") destroyMap();
    render();return;}
  if(action==="client-cat"){v.cat=el.dataset.cat;render();return;}
  if(action==="client-add"){v.cart[id]=(v.cart[id]||0)+1;render();return;}
  if(action==="client-remove"){if(v.cart[id]>1)v.cart[id]--;else delete v.cart[id];render();return;}
  if(action==="client-cart"){
    if(v.mode==="sur_place") v.screen="table";
    else v.screen = (v.deliveryLat!=null && v.deliveryLon!=null) ? "cart" : "deliveryInfo";
    render();return;
  }
  if(action==="client-table"){v.tableId=id;v.screen="cart";render();return;}
  if(action==="client-use-gps"){
    if(!navigator.geolocation){toast("Indisponible");return;}
    toast("Localisation…");
    navigator.geolocation.getCurrentPosition(
      pos=>setClientPosition(pos.coords.latitude,pos.coords.longitude),
      err=>toast("Position indisponible"),{enableHighAccuracy:true,timeout:10000});return;}
  if(action==="client-delivery-next"){
    const nameOk=v.info.name && v.info.name.trim().length>1;
    const phoneOk=validPhoneBJ(v.info.phone);
    const locOk=v.deliveryLat!=null && v.deliveryLon!=null;
    if(!nameOk){toast("Nom requis");return;}
    if(!phoneOk){toast("Téléphone invalide");return;}
    if(!locOk){toast("Position requise");return;}
    v.screen="cart";destroyMap();render();return;}
  if(action==="client-cancel-wait"){v.screen="menu";v.orderId=null;localStorage.removeItem("ds_client_order");render();return;}
  if(action==="client-submit"){
    const items=DATA.menu.filter(m=>v.cart[m._docId]>0).map(d=>({id:d._docId,name:d.name,price:d.price,qty:v.cart[d._docId],time:d.time}));
    if(!items.length){toast("Panier vide");return;}
    const orderData={type:v.mode==="sur_place"?"sur_place":"livraison",items};
    if(v.mode==="sur_place"){
      const t=DATA.tables.find(x=>x._docId===v.tableId);
      const day=DATA.affectation[nowDate()]||{};
      const srvId=day[v.tableId]||null;
      const srv=DATA.staff.find(s=>s._docId===srvId);
      orderData.tableId=v.tableId;orderData.tableNumber=t?t.number:null;
      orderData.serveuseId=srvId;orderData.serveuseName=srv?srv.name:null;
    }else{
      if(!validPhoneBJ(v.info.phone)){toast("Numéro invalide");return;}
      if(v.deliveryLat==null){toast("Position manquante");return;}
      orderData.clientInfo={name:v.info.name,phone:v.info.phone.replace(/\s/g,""),address:v.info.address||""};
      orderData.deliveryLat=v.deliveryLat;orderData.deliveryLon=v.deliveryLon;
      orderData.deliveryKm=v.deliveryKm;orderData.deliveryAddrText=v.info.address||"";
    }
    try{
      v.orderId=await A.addOrder(orderData);
      localStorage.setItem("ds_client_order",v.orderId);
      v.screen="waiting";render();
    }catch(err){ toast("Erreur : "+err.message); }
    return;
  }
  if(action==="client-remove-refused"){
    const o=DATA.orders.find(o=>o._docId===v.orderId);
    if(o){const ni=o.items.filter((it,i)=>i!==v.refusedIdx);await A.updateOrder(o._docId,{items:ni});}
    v.refusedIdx=null;
    // Rediriger selon type
    if(o&&o.type==="livraison") v.screen="payment"; else v.screen="serving";
    render();return;}
  if(action==="client-pay"){
    const method=el.dataset.method;
    const ref=method==="momo"?"REF"+Math.floor(Math.random()*1000000):null;
    await A.markOrderPaid(v.orderId,method,ref);v.timerTotal=0;v.timerRemaining=0;render();return;}
  if(action==="client-edit-order"){
    const o=DATA.orders.find(o=>o._docId===v.orderId); if(!o) return;
    v.editCart={};o.items.filter(it=>it.statut!=="Refusé").forEach(it=>{v.editCart[it.id]=it.qty;});
    v.editingOrder=true;v.screen="editOrder";render();return;}
  if(action==="client-edit-cancel"){v.screen="payment";render();return;}
  if(action==="client-edit-cat"){v.cat=el.dataset.cat;render();return;}
  if(action==="client-edit-add"){v.editCart[id]=(v.editCart[id]||0)+1;render();return;}
  if(action==="client-edit-remove"){if(v.editCart[id]>1)v.editCart[id]--;else delete v.editCart[id];render();return;}
  if(action==="client-edit-save"){
    const o=DATA.orders.find(o=>o._docId===v.orderId); if(!o) return;
    const ni=Object.entries(v.editCart).map(([did,q])=>{const dish=DATA.menu.find(d=>d._docId===did);return dish?{id:did,name:dish.name,price:dish.price,qty:q,time:dish.time,statut:"Validé",motif:null}:null;}).filter(Boolean);
    await A.updateOrder(o._docId,{items:ni,editedAt:Date.now()});
    v.screen="payment";v.editingOrder=false;v.editCart={};toast("Commande mise à jour");render();return;}
  if(action==="client-call-serveuse"){
    const o=DATA.orders.find(o=>o._docId===v.orderId); if(!o) return;
    await A.callServeuse(o._docId);notify("🔔 Client","Table "+(o.tableNumber||"—"),true);toast("Serveuse notifiée");render();return;}

  // SERVEUSE
  if(action==="srv-home"){srvS.tab="tables";srvS.orderStep="table";srvS.orderTable=null;srvS.orderCart={};srvS.collectMethod=null;srvS.collectRef="";srvS.collectOrderId=null;render();return;}
  if(action==="srv-tab"){srvS.tab=el.dataset.tab;srvS.collectMethod=null;srvS.collectRef="";srvS.collectOrderId=null;render();return;}
  if(action==="srv-pick-table"){srvS.orderTable=id;srvS.orderStep="menu";render();return;}
  if(action==="srv-back-table"){srvS.orderStep="table";srvS.orderTable=null;srvS.orderCart={};render();return;}
  if(action==="srv-cat"){srvS.orderCat=el.dataset.cat;render();return;}
  if(action==="srv-add"){srvS.orderCart[id]=(srvS.orderCart[id]||0)+1;render();return;}
  if(action==="srv-remove"){if(srvS.orderCart[id]>1)srvS.orderCart[id]--;else delete srvS.orderCart[id];render();return;}
  if(action==="srv-send"){
    const items=DATA.menu.filter(m=>srvS.orderCart[m._docId]>0).map(d=>({id:d._docId,name:d.name,price:d.price,qty:srvS.orderCart[d._docId],time:d.time}));
    if(!items.length){toast("Panier vide");return;}
    const t=DATA.tables.find(x=>x._docId===srvS.orderTable);
    const me=DATA.staff.find(s=>s.name===SESSION.name&&s.role==="serveuse");
    await A.addOrder({type:"sur_place",tableId:srvS.orderTable,tableNumber:t?t.number:null,serveuseId:me?me._docId:null,serveuseName:SESSION.name,items,source:"serveuse"});
    srvS.orderCart={};srvS.orderTable=null;srvS.orderStep="table";toast("Commande envoyée au gérant");render();return;}
  // Encaissement serveuse
  if(action==="srv-collect-method"){
    srvS.collectMethod=el.dataset.method;
    srvS.collectOrderId=id;
    srvS.collectRef="";
    render();return;
  }
  if(action==="srv-collect-confirm"){
    if(!srvS.collectMethod){toast("Choisissez le mode de paiement");return;}
    const ref=srvS.collectMethod==="momo"?(srvS.collectRef||"REF"+Math.floor(Math.random()*1000000)):null;
    await A.confirmCash(id, srvS.collectMethod, ref);
    srvS.collectMethod=null;srvS.collectRef="";srvS.collectOrderId=null;
    toast("Paiement confirmé — En cuisine");
    render();return;
  }
  if(action==="srv-collect-issue"){
    if(!confirm("Signaler que le paiement n'a PAS été reçu ?\n\nLa cuisine sera bloquée et le gérant sera notifié."))return;
    await A.reportCashIssue(id);
    srvS.collectMethod=null;srvS.collectRef="";srvS.collectOrderId=null;
    toast("Signalé au gérant");render();return;
  }
  if(action==="srv-served"){await A.markServed(id);toast("Servie !");render();return;}

  // GÉRANT
  if(action==="ger-home"){gerS.tab="validation";render();return;}
  if(action==="ger-tab"){gerS.tab=el.dataset.tab;render();return;}
  if(action==="ger-force-affect"){gerS.tab="affectation";render();return;}
  if(action==="ger-item-valid"){await A.setItemStatut(id,idx,"Validé");return;}
  if(action==="ger-item-refuse"){await A.setItemStatut(id,idx,"Refusé");return;}
  if(action==="ger-motif"){await A.setItemMotif(id,idx,el.dataset.motif);return;}
  if(action==="ger-validate"){await A.validateOrder(id);toast("Validée");return;}
  if(action==="ger-delete"){if(!confirm("⚠️ SUPPRIMER définitivement ?"))return;await A.deleteOrder(id);toast("Supprimée");return;}
  if(action==="ger-resolve-cash"){await A.resolveCashIssue(id);toast("Résolu — la serveuse peut encaisser");render();return;}
  if(action==="ger-print-invoice"){printInvoice(id);return;}
  if(action==="ger-affect"){const today=nowDate();const day=DATA.affectation[today]||{};
    const cur=day[el.dataset.table]===el.dataset.serveuse;
    await A.setAffectation(today,el.dataset.table,cur?null:el.dataset.serveuse);return;}

  // CUISINE
  if(action==="cui-home"){render();return;}
  if(action==="cui-ready"){await A.markReady(id);notify("🍽️ Plat prêt","Une commande vient d'être prête",true);toast("Prêt !");render();return;}

  // LIVREUR
  if(action==="liv-home"){livS.tab="available";render();return;}
  if(action==="liv-tab"){livS.tab=el.dataset.tab;render();return;}
  if(action==="liv-take"){
    const me=DATA.staff.find(s=>s.name===SESSION.name&&s.role==="livreur");
    if(me)await A.takeDelivery(id,me._docId,me.name);
    livS.tab="current";render();return;}
  if(action==="liv-enroute"){await A.setDeliveryStatus(id,"en_route");return;}
  if(action==="liv-done"){await A.markDelivered(id);render();return;}

  // ADMIN
  if(action==="admin-home"){admS.section="menu";admS.editingDish=null;render();return;}
  if(action==="admin-section"){admS.section=el.dataset.section;admS.editingDish=null;admS.showNewStock=false;
    if(el.dataset.section==="bilan"){const today=nowDate();if(!admS.bilanFrom) admS.bilanFrom=today;if(!admS.bilanTo) admS.bilanTo=today;}
    if(el.dataset.section==="settings"){ admS.settingsForm={...DATA.settings}; }
    render();return;}
  if(action==="admin-add-dish"){await A.addDish({name:"Nouveau plat",cat:"Plats",price:0,time:10,available:true,desc:""});return;}
  if(action==="admin-edit-dish"){admS.editingDish=id;render();return;}
  if(action==="admin-save-dish"){
    const row=el.closest("tr");
    const name=row.querySelector('[data-input="dish-name"]').value;
    const desc=row.querySelector('[data-input="dish-desc"]').value;
    const cat=row.querySelector('[data-input="dish-cat"]').value;
    const price=parseInt(row.querySelector('[data-input="dish-price"]').value)||0;
    const time=parseInt(row.querySelector('[data-input="dish-time"]').value)||0;
    const avail=row.querySelector('[data-input="dish-avail"]').checked;
    await A.updateDish(id,{name,desc,cat,price,time,available:avail});
    admS.editingDish=null;return;}
  if(action==="admin-del-dish"){if(confirm("Supprimer ?"))await A.removeDish(id);return;}
  if(action==="admin-add-staff"){
    const s={...admS.newStaff};
    if((s.role==="gerant"||s.role==="admin")){
      if(!s.email || !s.password){ toast("Email + mot de passe requis"); return; }
      s.recoveryCode=""; s.recoveryCodeCreatedAt=0;
    } else {
      if(!s.pin || s.pin.length<4){ toast("PIN 4 chiffres requis"); return; }
      s.email=""; s.password=""; s.recoveryCode=""; s.recoveryCodeCreatedAt=0;
    }
    if(!s.name){ toast("Nom requis"); return; }
    await A.addStaff(s); admS.newStaff={name:"",role:"serveuse",pin:"",email:"",password:""};
    toast("Compte ajouté"); render();return;}
  if(action==="admin-reset-pin"){const pin=await A.resetPin(id);toast("PIN: "+pin);return;}
  if(action==="admin-reset-creds"){
    const newPwd=prompt("Nouveau mot de passe (min. 6) :");
    if(!newPwd||newPwd.length<6){ toast("Min 6 caractères"); return; }
    await A.updateStaff(id,{password:newPwd}); toast("MDP mis à jour");return;}
  if(action==="admin-gen-recovery"){
    const name=el.dataset.name||"";
    const code=await A.generateRecoveryCode(id);
    admS.recoveryModal={name, code}; render();return;}
  if(action==="admin-del-staff"){if(confirm("Supprimer ?"))await A.removeStaff(id);return;}
  if(action==="admin-add-table"){await A.addTable();return;}
  if(action==="admin-del-table"){if(confirm("Supprimer ?"))await A.removeTable(id);return;}
  if(action==="admin-print-all-qr"){printQrCodes("all");return;}
  if(action==="admin-print-unique-qr"){printQrCodes("unique");return;}
  if(action==="admin-toggle-new-stock"){admS.showNewStock=!admS.showNewStock;render();return;}
  if(action==="admin-create-stock"){
    const ns=admS.newStockItem;
    if(!ns.name||!ns.name.trim()){toast("Nom requis");return;}
    if(!ns.unit||!ns.unit.trim()){toast("Unité requise");return;}
    await A.addStockItem({name:ns.name,unit:ns.unit,initial:ns.initial||0,threshold:ns.threshold||0});
    admS.newStockItem={name:"",unit:"kg",initial:0,threshold:0};admS.showNewStock=false;toast("Créé ✓");return;}
  if(action==="admin-del-stock"){if(confirm("Supprimer ?"))await A.removeStockItem(id);return;}
  if(action==="admin-add-move"){if(!admS.stockForm.stockId||!admS.stockForm.qty)return;
    await A.addStockMove({...admS.stockForm});admS.stockForm={stockId:admS.stockForm.stockId,type:"Entrée",qty:0,motif:""};toast("Enregistré");return;}
  if(action==="admin-save-settings"){
    const f = admS.settingsForm;
    const lat = parseFloat(f.restoLat); const lon = parseFloat(f.restoLon); const km = parseInt(f.prixKm);
    if(isNaN(lat) || lat < -90 || lat > 90){ toast("Latitude invalide"); return; }
    if(isNaN(lon) || lon < -180 || lon > 180){ toast("Longitude invalide"); return; }
    if(isNaN(km) || km < 0){ toast("Prix/km invalide"); return; }
    await A.updateSettings({
      restaurantName: f.restaurantName||"", phone: f.phone||"",
      bilanResetHour: parseInt(f.bilanResetHour)||6, waitMode: f.waitMode||"max",
      restoLat: lat, restoLon: lon, prixKm: km,
      emailRapport: f.emailRapport||"", oneSignalAppId: f.oneSignalAppId||"",
      emailjsServiceId: f.emailjsServiceId||"", emailjsTemplateId: f.emailjsTemplateId||"", emailjsPublicKey: f.emailjsPublicKey||""
    });
    admS.settingsForm=null;toast("Paramètres enregistrés ✓");loadOneSignal();render();return;}
  if(action==="admin-bilan-apply"){render();return;}
  if(action==="admin-bilan-today"){const t=nowDate();admS.bilanFrom=t;admS.bilanTo=t;render();return;}
  if(action==="admin-bilan-week"){const to=new Date();const from=new Date();from.setDate(from.getDate()-6);
    admS.bilanFrom=from.toISOString().slice(0,10);admS.bilanTo=to.toISOString().slice(0,10);render();return;}
  if(action==="admin-bilan-month"){const to=new Date();const from=new Date();from.setDate(from.getDate()-29);
    admS.bilanFrom=from.toISOString().slice(0,10);admS.bilanTo=to.toISOString().slice(0,10);render();return;}
  if(action==="admin-reset-today"){pendingReset={action:"today",pin:"",error:""};render();return;}
  if(action==="admin-reset-all"){pendingReset={action:"all",pin:"",error:""};render();return;}
  if(action==="admin-reset-active"){pendingReset={action:"active",pin:"",error:""};render();return;}
  if(action==="admin-reset-menu"){pendingReset={action:"menu",pin:"",error:""};render();return;}
  if(action==="admin-reset-stock"){pendingReset={action:"stock",pin:"",error:""};render();return;}
  if(action==="admin-reset-everything"){pendingReset={action:"everything",pin:"",error:""};render();return;}
  if(action==="admin-clear-logs"){pendingReset={action:"clear-logs",pin:"",error:""};render();return;}
  if(action==="admin-backup-now"){ await A.downloadBackup(); toast("Sauvegarde téléchargée"); return; }
  if(action==="admin-export-csv"){
    const paid=DATA.orders.filter(o=>["payee","servie","livree"].includes(o.status));
    const csv=["Date,Heure,Type,Zone/Table,Serveuse/Livreur,Client,Plats,Prix,FraisLivr,Paiement"].concat(paid.map(o=>{
      const d=new Date(o.createdAt);
      const items=o.items.filter(i=>i.statut!=="Refusé").map(i=>i.qty+"x "+i.name).join("; ");
      const loc=o.type==="livraison"?(o.clientInfo?.address||""):"Table "+(o.tableNumber||"");
      const staff=o.type==="livraison"?(o.livreurName||""):(o.serveuseName||"");
      const cli=o.clientInfo?.name||"";
      return [o.date,d.toLocaleTimeString("fr-FR"),o.type,loc,staff,cli,'"'+items+'"',orderTotal(o),deliveryFeeFor(o),o.paymentMethod||""].join(",");
    })).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="historique_ventes.csv";a.click();URL.revokeObjectURL(url);return;}
});

document.addEventListener("change",async function(e){
  const el=e.target;const key=el.dataset.input;const action=el.dataset.action;
  if(action==="ger-assign-livreur"){await A.assignLivreur(el.dataset.id,el.value||null);toast(el.value?"Assigné":"Retiré");return;}
  if(!key)return;
  if(key==="new-staff-role"){admS.newStaff.role=el.value;render();}
  if(key==="stock-type")admS.stockForm.type=el.value;
  if(key==="hist-type"){admS.histFilter.type=el.value;render();}
  if(key==="hist-payment"){admS.histFilter.payment=el.value;render();}
  if(key==="set-wait"&&admS.settingsForm)admS.settingsForm.waitMode=el.value;
});

document.addEventListener("input",function(e){
  if(e.target.id==="reset-pin-input"){ if(pendingReset){ pendingReset.pin=e.target.value; pendingReset.error=""; } return; }
  const el=e.target;const key=el.dataset.input;
  if(key==="login-email"){ loginEmail=el.value; return; }
  if(key==="login-password"){ loginPassword=el.value; return; }
  if(key==="rec-email" && loginRecovery){ loginRecovery.email=el.value; loginRecovery.error=""; return; }
  if(key==="rec-code" && loginRecovery){ loginRecovery.code=el.value.toUpperCase(); loginRecovery.error=""; return; }
  if(key==="rec-newpwd" && loginRecovery){ loginRecovery.newPwd=el.value; loginRecovery.error=""; return; }
  if(key==="rec-newpwd2" && loginRecovery){ loginRecovery.newPwd2=el.value; loginRecovery.error=""; return; }
  if(!key)return;
  const v=clientS;
  if(key==="info-name")v.info.name=el.value;
  if(key==="info-phone")v.info.phone=el.value.replace(/[^\d]/g,"").slice(0,10);
  if(key==="info-address")v.info.address=el.value;
  if(key==="srv-collect-ref")srvS.collectRef=el.value;
  if(key==="new-staff-name")admS.newStaff.name=el.value;
  if(key==="new-staff-pin")admS.newStaff.pin=el.value.replace(/\D/g,"").slice(0,4);
  if(key==="new-staff-email")admS.newStaff.email=el.value;
  if(key==="new-staff-pwd")admS.newStaff.password=el.value;
  if(key==="new-stock-name")admS.newStockItem.name=el.value;
  if(key==="new-stock-unit")admS.newStockItem.unit=el.value;
  if(key==="new-stock-initial")admS.newStockItem.initial=parseFloat(el.value)||0;
  if(key==="new-stock-threshold")admS.newStockItem.threshold=parseFloat(el.value)||0;
  if(key==="stock-id")admS.stockForm.stockId=el.value;
  if(key==="stock-qty")admS.stockForm.qty=parseFloat(el.value)||0;
  if(key==="stock-motif")admS.stockForm.motif=el.value;
  if(key==="hist-query"){admS.histFilter.query=el.value;render();}
  if(key==="set-name"&&admS.settingsForm)admS.settingsForm.restaurantName=el.value;
  if(key==="set-phone"&&admS.settingsForm)admS.settingsForm.phone=el.value;
  if(key==="set-bilan-hour"&&admS.settingsForm)admS.settingsForm.bilanResetHour=parseInt(el.value)||6;
  if(key==="set-resto-lat"&&admS.settingsForm)admS.settingsForm.restoLat=el.value;
  if(key==="set-resto-lon"&&admS.settingsForm)admS.settingsForm.restoLon=el.value;
  if(key==="set-km-price"&&admS.settingsForm)admS.settingsForm.prixKm=parseInt(el.value)||0;
  if(key==="set-email-rapport"&&admS.settingsForm)admS.settingsForm.emailRapport=el.value;
  if(key==="set-onesignal"&&admS.settingsForm)admS.settingsForm.oneSignalAppId=el.value;
  if(key==="bilan-from")admS.bilanFrom=el.value;
  if(key==="bilan-to")admS.bilanTo=el.value;
});

document.addEventListener("keydown",function(e){
  if(pendingReset && document.activeElement && document.activeElement.id==="reset-pin-input"){
    if(e.key==="Enter"){ e.preventDefault(); document.querySelector('[data-action="reset-confirm"]')?.click(); return; }
    return;
  }
  if(SESSION)return;
  if(!loginRole)return;
  if(loginRole==="gerant" || loginRole==="admin"){
    if(e.key==="Enter"){
      if(loginRecovery){
        if(loginRecovery.stage==="form" && document.activeElement && document.activeElement.dataset.input==="rec-code"){
          e.preventDefault(); document.querySelector('[data-action="rec-verify"]')?.click();
        } else if(loginRecovery.stage==="newPwd" && document.activeElement && document.activeElement.dataset.input==="rec-newpwd2"){
          e.preventDefault(); document.querySelector('[data-action="rec-save"]')?.click();
        }
      } else if(document.activeElement && document.activeElement.dataset.input==="login-password"){
        e.preventDefault();
        document.querySelector('[data-action="login-submit"]')?.click();
      }
    }
    return;
  }
  if(/^\d$/.test(e.key)){pinAdd(e.key);e.preventDefault();return;}
  if(e.key==="Backspace"){pinDel();e.preventDefault();return;}
});

setInterval(function(){
  if(!SESSION)return;
  if(pendingReset||admS.recoveryModal) return;
  if(SESSION.role==="cuisine"||SESSION.role==="serveuse"||SESSION.role==="gerant"){render();}
  if(SESSION.role==="client"&&clientS.screen==="tracking"&&clientS.timerRemaining>0){clientS.timerRemaining--;render();}
},1000);

(async function init(){
  if("Notification" in window && Notification.permission==="default"){
    setTimeout(async ()=>{ try{ await Notification.requestPermission(); }catch(e){} }, 3000);
  }
})();

(async function restoreClientOrder(){
  const savedOrderId=localStorage.getItem("ds_client_order");
  if(!savedOrderId) return;
  const ci=setInterval(()=>{
    if(!DATA.orders.length && !DATA.menu.length) return;
    const o=DATA.orders.find(x=>x._docId===savedOrderId);
    if(o && o.status!=="servie" && o.status!=="livree"){
      clientS.orderId=savedOrderId;
      if(o.status==="att_validation")clientS.screen="waiting";
      else if(o.status==="att_collect")clientS.screen="serving";
      else if(o.status==="att_paiement")clientS.screen="payment";
      else if(o.status==="payee")clientS.screen="tracking";
      clearInterval(ci);if(SESSION&&SESSION.role==="client")render();
    }else{localStorage.removeItem("ds_client_order");clearInterval(ci);}
  },500);
  setTimeout(()=>clearInterval(ci),15000);
})();

(function checkUrlTable(){
  const params=new URLSearchParams(window.location.search);
  const t=params.get("table");
  if(t){
    clientS.urlTable=parseInt(t);clientS.mode="sur_place";
    const f=DATA.tables.find(x=>x.number===parseInt(t));
    if(f){clientS.tableId=f._docId;clientS.screen="menu";}else{clientS.screen="menu";}
  }
})();

// Enregistrement du service worker pour PWA
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(e=>console.warn("SW:",e));
  });
}

(async function boot(){
  try{
    await seedIfEmpty();
    await migrateIfNeeded();
    subscribeAll(render);
    render();
    // Charger OneSignal si configuré
    setTimeout(loadOneSignal, 2000);
  }catch(e){
    console.error(e);
    document.getElementById("root").innerHTML='<div class="loader"><div class="loader-logo">⚠️</div><p class="loader-text" style="color:#ff7066;max-width:300px;text-align:center">Erreur : '+esc(e.message||e)+'</p><button onclick="location.reload()" style="margin-top:20px;padding:12px 24px;background:#ffc107;color:#0a0a0a;border:none;border-radius:8px;font-weight:bold;cursor:pointer">Réessayer</button></div>';
  }
})();
</script>
