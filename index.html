<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant D&S</title>
<style>
:root{--noir:#0a0a0a;--jaune:#ffc107;--jaune-fonce:#e0a800;--creme:#f7f5ef;--sable:#e8e2d0;--vert:#2d7a3e;--rouge:#c0392b;--gris:#6b6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--creme);color:#1a1a1a}
.serif{font-family:Georgia,'Times New Roman',serif}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px}
.app{min-height:100vh;display:flex;flex-direction:column}
.loader{position:fixed;inset:0;background:var(--noir);color:var(--jaune);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:Georgia,serif}
.loader-logo{width:80px;height:80px;border-radius:50%;background:var(--jaune);color:var(--noir);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;margin-bottom:16px}
.loader-text{margin-top:20px;font-size:14px;color:#888;text-align:center;padding:0 20px}
.spin{width:40px;height:40px;border:4px solid #222;border-top-color:var(--jaune);border-radius:50%;animation:spin 1s linear infinite;margin-top:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.login{min-height:100vh;background:var(--noir);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.login-logo{width:80px;height:80px;border-radius:50%;background:var(--jaune);color:var(--noir);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;margin-bottom:16px;font-family:Georgia,serif}
.login h1{font-size:26px;margin:0 0 20px;text-align:center;font-family:Georgia,serif}
.login h1 span{color:var(--jaune)}
.login-sub{font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:var(--jaune);margin-bottom:6px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px}
.role-btn{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:14px;text-align:left;color:white;transition:background .15s}
.role-btn:active{background:#252525}
.role-btn .em{font-size:22px;margin-bottom:6px}
.role-btn .lab{font-weight:600;margin:0;font-size:14px}
.role-btn .desc{font-size:11px;color:#888;margin:2px 0 0}
.pin-wrap{width:100%;max-width:300px}
.pin-display{display:flex;justify-content:center;gap:12px;margin:20px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #444}
.pin-dot.filled{background:var(--jaune);border-color:var(--jaune)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-key{aspect-ratio:1.6;background:#1a1a1a;border:1px solid #333;border-radius:12px;color:white;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:background .1s}
.pin-key:active{background:var(--jaune);color:var(--noir)}
.pin-key.blank{background:transparent;border:none}
.pin-key.del{background:#333;font-size:20px}
.pin-error{color:#ff7066;font-size:13px;text-align:center;margin-top:12px}
.pin-back{display:block;margin:16px auto 0;color:#888;background:transparent;font-size:13px;text-decoration:underline;padding:8px}
.pin-hint{font-size:11px;color:#666;margin-top:14px;text-align:center;line-height:1.7}
.topbar{background:var(--noir);color:white;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--jaune)}
.topbar-btn{background:transparent;color:white;padding:8px 10px;border-radius:8px;font-size:20px;display:flex;align-items:center;justify-content:center;min-width:40px;min-height:40px}
.topbar-btn:active{background:#252525}
.topbar-title{flex:1;font-family:Georgia,serif;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-sub{font-size:11px;color:#aaa;margin:0}
.topbar-logout{background:transparent;color:var(--jaune);font-size:11px;text-decoration:underline;padding:8px;font-weight:600}
.tabs-scroll{background:var(--noir);border-top:1px solid #333;padding:0 6px 8px;overflow-x:auto;display:flex;gap:4px;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs-scroll .tab{background:transparent;color:#aaa;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}
.tabs-scroll .tab.active{background:var(--jaune);color:var(--noir)}
.bottom-nav{display:grid;background:white;border-top:2px solid var(--jaune);position:sticky;bottom:0;z-index:20}
.bottom-nav.cols-4{grid-template-columns:repeat(4,1fr)}
.bottom-nav.cols-3{grid-template-columns:repeat(3,1fr)}
.bn-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 12px;font-size:11px;font-weight:500;background:transparent;color:var(--gris);position:relative;min-height:56px}
.bn-btn.active{color:var(--jaune-fonce)}
.bn-btn .em{font-size:22px;line-height:1}
.bn-badge{position:absolute;top:6px;right:calc(50% - 24px);background:var(--rouge);color:white;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:bold}
.content{flex:1;padding:16px;width:100%}
.content-narrow{max-width:520px;margin:0 auto}
.section-title{font-family:Georgia,serif;font-size:22px;margin:0 0 4px}
.section-sub{font-size:13px;color:var(--gris);margin:0 0 16px}
.card{background:white;border:1px solid var(--sable);border-radius:12px;padding:14px}
.card+.card{margin-top:10px}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title{font-weight:600;margin:0;font-size:15px}
.card-sub{font-size:12px;color:var(--gris);margin:2px 0 0}
.btn{padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--noir);color:white}
.btn-accent{background:var(--jaune);color:var(--noir);font-weight:700}
.btn-success{background:var(--vert);color:white}
.btn-danger{background:var(--rouge);color:white}
.btn-outline{background:transparent;border:2px solid var(--noir);color:var(--noir)}
.btn-ghost{background:transparent;border:1px solid var(--sable);color:var(--gris)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-block{display:flex;width:100%}
.btn-sm{padding:6px 12px;font-size:12px;min-height:36px}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;display:inline-block}
.badge-neutre{background:rgba(107,107,107,0.12);color:var(--gris)}
.badge-vert{background:rgba(45,122,62,0.12);color:var(--vert)}
.badge-orange{background:rgba(224,168,0,0.18);color:var(--jaune-fonce)}
.badge-rouge{background:rgba(192,57,43,0.12);color:var(--rouge)}
.input{width:100%;padding:12px;border:1px solid var(--sable);border-radius:8px;font-size:16px;background:white}
.input:focus{outline:none;border-color:var(--jaune);box-shadow:0 0 0 2px rgba(255,193,7,0.2)}
.cart-fab{position:fixed;bottom:16px;left:16px;right:16px;padding:16px;background:var(--noir);color:white;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 32px rgba(0,0,0,0.3);z-index:50;max-width:480px;margin:0 auto;border:2px solid var(--jaune)}
.cart-fab .total{color:var(--jaune);font-family:monospace;font-weight:bold}
.cart-fab .label{font-weight:600;font-size:14px}
.dish-row{background:white;border:1px solid var(--sable);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.dish-info{flex:1;min-width:0}
.dish-name{font-weight:600;font-size:15px;margin:0}
.dish-desc{font-size:12px;color:var(--gris);margin:2px 0 0}
.dish-meta{display:flex;align-items:center;gap:10px;margin-top:6px}
.dish-price{font-family:monospace;font-weight:bold}
.dish-time{font-size:12px;color:var(--rouge);font-weight:500}
.qty-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--noir);background:white;font-size:18px;display:flex;align-items:center;justify-content:center}
.qty-btn.add{background:var(--noir);color:white;border-color:var(--noir)}
.qty-val{font-family:monospace;font-weight:bold;min-width:22px;text-align:center;font-size:15px}
.menu-header{background:var(--noir);color:white;padding:16px;position:sticky;top:0;z-index:10;border-bottom:2px solid var(--jaune)}
.menu-header h2{font-family:Georgia,serif;font-size:20px;margin:0 0 4px}
.menu-header .sub{font-size:13px;color:#aaa}
.cat-tabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-btn{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid var(--sable);background:white;color:var(--gris)}
.cat-btn.active{background:var(--jaune);color:var(--noir);border-color:var(--jaune);font-weight:700}
.cat-btn.on-dark{background:transparent;border-color:#444;color:#aaa}
.cat-btn.on-dark.active{background:var(--jaune);color:var(--noir);border-color:var(--jaune)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-card{background:white;border:1px solid var(--sable);border-radius:12px;padding:14px;border-left:4px solid var(--jaune)}
.stat-label{font-size:12px;color:var(--gris);margin:0 0 4px}
.stat-value{font-family:Georgia,serif;font-size:22px;font-weight:bold;margin:0}
.table-wrap{background:white;border:1px solid var(--sable);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:#faf8f2;color:var(--gris)}
th{text-align:left;padding:10px 12px;font-weight:500;font-size:12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid #f0ede4;vertical-align:middle}
.progress-circle{position:relative;width:180px;height:180px;margin:0 auto 20px}
.progress-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.progress-circle .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.table-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.table-cell{aspect-ratio:1;background:white;border:1px solid var(--sable);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;min-height:56px}
.table-cell.active{background:var(--jaune);border-color:var(--jaune);color:var(--noir)}
.timer{font-family:monospace;font-size:22px;font-weight:bold}
.timer.urgent{color:var(--rouge)}
.ticket{background:white;border:2px solid var(--sable);border-radius:16px;padding:14px}
.ticket.urgent{border-color:var(--rouge)}
.empty{text-align:center;color:var(--gris);padding:24px 12px;font-size:14px}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.gap-2{gap:8px}.gap-3{gap:12px}
.mt-2{margin-top:8px}.mt-4{margin-top:16px}.mb-2{margin-bottom:8px}.mb-4{margin-bottom:16px}
.text-sm{font-size:13px}.text-xs{font-size:11px}
.muted{color:var(--gris)}.mono{font-family:monospace}.bold{font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--noir);color:white;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;border:2px solid var(--jaune);box-shadow:0 8px 24px rgba(0,0,0,0.3);max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="root"><div class="loader"><div class="loader-logo">D&S</div><h1 style="font-family:Georgia,serif;margin:0 0 20px;color:var(--jaune)">Restaurant D&S</h1><div class="spin"></div><p class="loader-text">Connexion à Firebase…</p></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBeTQ0zrxdusKXdaoCMiI0zfxRqCZp7nN0",
  authDomain: "restaurant-ds-494a6.firebaseapp.com",
  projectId: "restaurant-ds-494a6",
  storageBucket: "restaurant-ds-494a6.firebasestorage.app",
  messagingSenderId: "1026668587499",
  appId: "1:1026668587499:web:7ed7b77fd623070007d1ae"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

let DEVICE_ID = localStorage.getItem("ds_device_id");
if (!DEVICE_ID) {
  DEVICE_ID = "dev_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem("ds_device_id", DEVICE_ID);
}

let SESSION = null;
let DATA = { menu:[], staff:[], tables:[], affectation:{}, orders:[], stock:[], stockMoves:[], settings:{} };
let listeners = [];

const SEED = {
  menu: [
    { id:"m1", name:"Salade César", cat:"Entrées", price:2500, time:5, available:true, desc:"Romaine, parmesan" },
    { id:"m2", name:"Beignets de crevettes", cat:"Entrées", price:3000, time:10, available:true, desc:"Sauce pimentée" },
    { id:"m3", name:"Poulet DG", cat:"Plats", price:5000, time:18, available:true, desc:"Poulet mijoté, plantain" },
    { id:"m4", name:"Poisson braisé", cat:"Plats", price:5500, time:20, available:true, desc:"Grillé au feu de bois" },
    { id:"m5", name:"Riz sauté aux légumes", cat:"Plats", price:3500, time:12, available:true, desc:"Riz wok, légumes" },
    { id:"m6", name:"Attiéké poisson", cat:"Plats", price:4000, time:15, available:true, desc:"Semoule de manioc" },
    { id:"m7", name:"Salade de fruits", cat:"Desserts", price:1500, time:4, available:true, desc:"" },
    { id:"m8", name:"Tarte au citron", cat:"Desserts", price:2000, time:3, available:true, desc:"" },
    { id:"m9", name:"Jus de bissap", cat:"Boissons", price:1000, time:2, available:true, desc:"Hibiscus glacé" },
    { id:"m10", name:"Eau minérale", cat:"Boissons", price:500, time:1, available:true, desc:"" }
  ],
  staff: [
    { id:"s1", name:"Aïcha", role:"serveuse", pin:"4821" },
    { id:"s2", name:"Fatou", role:"serveuse", pin:"3390" },
    { id:"s3", name:"Moussa", role:"cuisine", pin:"1234" },
    { id:"s4", name:"Ibrahim", role:"gerant", pin:"0000" },
    { id:"s5", name:"Salif", role:"livreur", pin:"5678" },
    { id:"s6", name:"Admin D&S", role:"admin", pin:"9999" }
  ],
  tables: Array.from({length:25},(_,i)=>({ id:"t"+(i+1), number:i+1, token:Math.random().toString(36).slice(2,8) })),
  stock: [
    { id:"st1", name:"Poulet", unit:"kg", initial:30, threshold:5 },
    { id:"st2", name:"Poisson", unit:"kg", initial:25, threshold:5 },
    { id:"st3", name:"Riz", unit:"kg", initial:80, threshold:15 },
    { id:"st4", name:"Huile", unit:"L", initial:40, threshold:8 },
    { id:"st5", name:"Légumes", unit:"kg", initial:20, threshold:5 }
  ],
  settings: { restaurantName:"Restaurant D&S", phone:"27 20 00 00 00", fraisLivraison:1000, timerMode:"auto", waitMode:"max" }
};

async function seedIfEmpty() {
  const check = await getDocs(query(collection(db, "menu"), limit(1)));
  if (!check.empty) return;
  const batch = writeBatch(db);
  SEED.menu.forEach(m => batch.set(doc(db, "menu", m.id), m));
  SEED.staff.forEach(s => batch.set(doc(db, "staff", s.id), s));
  SEED.tables.forEach(t => batch.set(doc(db, "tables", t.id), t));
  SEED.stock.forEach(s => batch.set(doc(db, "stock", s.id), s));
  batch.set(doc(db, "settings", "main"), SEED.settings);
  await batch.commit();
}

function money(n){return (n||0).toLocaleString("fr-FR")+" F";}
function uid(p){return (p||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function nowDate(){return new Date().toISOString().slice(0,10);}
function fmtDate(iso){return new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"short"});}
function timeAgo(ts){if(!ts)return "à l'instant";const m=Math.floor((Date.now()-ts)/60000);if(m<=0)return "à l'instant";if(m<60)return "il y a "+m+" min";return "il y a "+Math.floor(m/60)+"h";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function subscribeAll(onUpdate) {
  const subscribe = (col, key, transform) => {
    const unsub = onSnapshot(collection(db, col), snap => {
      const arr = [];
      snap.forEach(d => arr.push({ ...d.data(), _docId: d.id }));
      DATA[key] = transform ? transform(arr) : arr;
      onUpdate();
    });
    listeners.push(unsub);
  };
  subscribe("menu", "menu");
  subscribe("staff", "staff");
  subscribe("tables", "tables", arr => arr.sort((a,b)=>a.number-b.number));
  subscribe("stock", "stock");
  subscribe("stockMoves", "stockMoves", arr => arr.sort((a,b)=>(b._ts||0)-(a._ts||0)));
  subscribe("orders", "orders", arr => arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)));
  const unsubAff = onSnapshot(collection(db, "affectation"), snap => {
    const obj = {};
    snap.forEach(d => { obj[d.id] = d.data(); });
    DATA.affectation = obj;
    onUpdate();
  });
  listeners.push(unsubAff);
  const unsubSet = onSnapshot(doc(db, "settings", "main"), snap => {
    if (snap.exists()) DATA.settings = snap.data();
    onUpdate();
  });
  listeners.push(unsubSet);
}

const A = {
  login(role, name) {
    SESSION = { role, name, userId: DEVICE_ID, since: Date.now() };
    render();
  },
  logout() {
    SESSION = null;
    loginRole = null; loginPin = ""; loginError = "";
    render();
  },
  async addOrder(order) {
    const newOrder = {
      createdAt: Date.now(), date: nowDate(), status: "att_validation",
      type: order.type||"sur_place", tableId: order.tableId||null, tableNumber: order.tableNumber||null,
      serveuseId: order.serveuseId||null, serveuseName: order.serveuseName||null,
      livreurId: null, deliveryStatus: null, clientInfo: order.clientInfo||null,
      items: order.items.map(i => ({ ...i, statut:null, motif:null })),
      paymentMethod: null, paymentRef: null, readyAt: null, servedAt: null
    };
    const ref = await addDoc(collection(db, "orders"), newOrder);
    return ref.id;
  },
  async updateOrder(id, patch) { await updateDoc(doc(db, "orders", id), patch); },
  async setItemStatut(orderId, idx, statut, motif) {
    const order = DATA.orders.find(o => o._docId===orderId);
    if (!order) return;
    const items = order.items.map((it,i) => i===idx ? { ...it, statut, motif: statut==="Refusé"?(motif||it.motif):null } : it);
    await updateDoc(doc(db, "orders", orderId), { items });
  },
  async setItemMotif(orderId, idx, motif) {
    const order = DATA.orders.find(o => o._docId===orderId);
    if (!order) return;
    const items = order.items.map((it,i) => i===idx ? { ...it, motif } : it);
    await updateDoc(doc(db, "orders", orderId), { items });
  },
  async validateOrder(id) { await updateDoc(doc(db, "orders", id), { status:"att_paiement" }); },
  async payOrder(id, method, ref) {
    const order = DATA.orders.find(o => o._docId === id);
    if (!order) return;
    const batch = writeBatch(db);
    for (const item of order.items) {
      if (item.statut === "Refusé") continue;
      const dish = DATA.menu.find(d => d._docId === item.id);
      if (!dish || !dish.recipe || !Array.isArray(dish.recipe)) continue;
      for (const ing of dish.recipe) {
        batch.set(doc(collection(db, "stockMoves")), {
          stockId: ing.stockId,
          type: "Sortie",
          qty: ing.qty * item.qty,
          motif: "Cmd #" + id.slice(-6) + " — " + dish.name,
          date: nowDate(),
          _ts: Date.now()
        });
      }
    }
    batch.update(doc(db, "orders", id), {
      status: "payee",
      paymentMethod: method,
      paymentRef: ref || null,
      paidAt: Date.now()
    });
    await batch.commit();
  },
  async markReady(id) { await updateDoc(doc(db, "orders", id), { readyAt:Date.now() }); },
  async markServed(id) { await updateDoc(doc(db, "orders", id), { status:"servie", servedAt:Date.now() }); },
  async markDelivered(id) { await updateDoc(doc(db, "orders", id), { status:"livree", servedAt:Date.now() }); },
  async confirmCash(id) { await updateDoc(doc(db, "orders", id), { cashConfirmed:true, cashConfirmedAt:Date.now() }); },
  async takeDelivery(id, livreurId) { await updateDoc(doc(db, "orders", id), { livreurId, deliveryStatus:"prise" }); },
  async setDeliveryStatus(id, st) { await updateDoc(doc(db, "orders", id), { deliveryStatus:st }); },
  async addDish(d) { await addDoc(collection(db, "menu"), d); },
  async updateDish(id, patch) { await updateDoc(doc(db, "menu", id), patch); },
  async removeDish(id) { await deleteDoc(doc(db, "menu", id)); },
  async addStaff(s) { await addDoc(collection(db, "staff"), s); },
  async removeStaff(id) { await deleteDoc(doc(db, "staff", id)); },
  async resetPin(id) {
    const pin = String(Math.floor(1000+Math.random()*9000));
    await updateDoc(doc(db, "staff", id), { pin });
    return pin;
  },
  async addTable() {
    const next = DATA.tables.reduce((m,t)=>Math.max(m,t.number),0)+1;
    await addDoc(collection(db, "tables"), { number: next, token: Math.random().toString(36).slice(2,8) });
  },
  async removeTable(id) { await deleteDoc(doc(db, "tables", id)); },
  async setAffectation(date, tableId, serveuseId) {
    const day = { ...(DATA.affectation[date]||{}) };
    if (serveuseId === null) delete day[tableId]; else day[tableId] = serveuseId;
    await setDoc(doc(db, "affectation", date), day);
  },
  async addStockMove(m) {
    await addDoc(collection(db, "stockMoves"), { ...m, date: nowDate(), _ts: Date.now() });
  },
  async updateSettings(patch) { await setDoc(doc(db, "settings", "main"), { ...DATA.settings, ...patch }, { merge:true }); }
};

function stockQty(id) {
  const item = DATA.stock.find(x => x._docId===id||x.id===id);
  if (!item) return 0;
  return DATA.stockMoves.filter(m => m.stockId===(item._docId||item.id)).reduce((a,m)=>a+(m.type==="Entrée"?m.qty:-m.qty), item.initial);
}
function orderTotal(o){return o.items.filter(i=>i.statut!=="Refusé").reduce((s,i)=>s+i.price*i.qty,0);}
function statusBadge(o){
  if (o.status==="servie") return '<span class="badge badge-vert">Servie</span>';
  if (o.status==="livree") return '<span class="badge badge-vert">Livrée</span>';
  if (o.status==="payee"){const ready=o.items.every(i=>i.statut==="Refusé"||o.readyAt);return '<span class="badge '+(ready?"badge-vert":"badge-orange")+'">'+(ready?"Prête":"En préparation")+'</span>';}
  if (o.status==="att_paiement") return '<span class="badge badge-orange">À payer</span>';
  return '<span class="badge badge-rouge">À valider</span>';
}

function screenCuisine(){
  const active=DATA.orders.filter(o=>o.status==="payee"&&!o.readyAt);
  const ready=DATA.orders.filter(o=>o.readyAt&&o.status==="payee");
  const ticket=(o)=>{
    const allItems=o.items.filter(i=>i.statut!=="Refusé");
    const maxTime=Math.max(...allItems.map(i=>i.time),0);
    const paidAt=o.paidAt||o.createdAt||Date.now();
    const deadline=paidAt+maxTime*60*1000;
    const now=Date.now();
    const remainingMs=deadline-now;
    const remainingSec=Math.floor(remainingMs/1000);
    const mm=String(Math.floor(Math.abs(remainingSec)/60)).padStart(2,"0");
    const ss=String(Math.abs(remainingSec)%60).padStart(2,"0");
    const urgent=remainingMs>0&&remainingMs<maxTime*60*1000*0.25;
    const overdue=remainingMs<=0;
    return '<div class="ticket '+(urgent||overdue?"urgent":"")+'">'+
      '<div class="flex between" style="margin-bottom:12px">'+
        '<div><p class="serif" style="font-size:19px;font-weight:bold;margin:0">Table '+(o.tableNumber||"—")+'</p><p class="text-xs muted">'+timeAgo(o.createdAt)+'</p></div>'+
        '<div class="timer '+(urgent||overdue?"urgent":"")+'">'+(overdue?"+"+mm+":"+ss:mm+":"+ss)+'</div>'+
      '</div>'+
      '<ul style="margin:0 0 14px 0;padding-left:20px;font-size:14px">'+allItems.map(i=>'<li>'+i.qty+'× '+esc(i.name)+'</li>').join("")+'</ul>'+
      '<button class="btn btn-outline btn-block" data-action="cui-ready" data-id="'+o._docId+'">Marquer prêt</button>'+
    '</div>';
  };
  return '<div class="app">'+
    topbar({role:"Cuisine",title:SESSION.name,homeAction:"cui-home"})+
    '<div class="content">'+
      '<h2 class="section-title" style="font-size:17px">👨‍🍳 File de préparation ('+active.length+')</h2>'+
      (active.length===0?'<p class="empty">Aucune commande en attente</p>':'<div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">'+active.map(ticket).join("")+'</div>')+
      (ready.length>0?'<h2 class="section-title" style="font-size:17px;margin-top:24px">✅ Prêtes ('+ready.length+')</h2>'+
        '<div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">'+ready.map(o=>'<div class="card" style="border:2px solid var(--vert)"><p class="bold">Table '+(o.tableNumber||"—")+'</p><ul style="margin:8px 0;padding-left:20px;font-size:14px">'+o.items.filter(i=>i.statut!=="Refusé").map(i=>'<li>'+i.qty+'× '+esc(i.name)+'</li>').join("")+'</ul><p style="color:var(--vert);font-weight:bold;text-align:center">✓ Notifiée</p></div>').join("")+'</div>':"")+
    '</div>'+
  '</div>';
}

function render(){
  const root=document.getElementById("root");
  if(!SESSION){root.innerHTML=screenLogin();return;}
  let html="";
  if(SESSION.role==="client")html=screenClient();
  else if(SESSION.role==="serveuse")html=screenServeuse();
  else if(SESSION.role==="gerant")html=screenGerant();
  else if(SESSION.role==="cuisine")html=screenCuisine();
  else if(SESSION.role==="livreur")html=screenLivreur();
  else if(SESSION.role==="admin")html=screenAdmin();
  root.innerHTML=html;
}

function pinAdd(d){
  if(loginPin.length>=4)return;
  loginPin+=d;loginError="";
  if(loginPin.length===4){
    setTimeout(function(){
      const user=DATA.staff.find(s=>s.role===loginRole&&s.pin===loginPin);
      if(user){A.login(loginRole,user.name);loginRole=null;loginPin="";loginError="";}
      else{loginError="PIN incorrect";loginPin="";render();}
    },150);
  }else{render();}
}
function pinDel(){loginPin=loginPin.slice(0,-1);loginError="";render();}

document.addEventListener("click",async function(e){
  const el=e.target.closest("[data-action]");
  if(!el)return;
  const action=el.dataset.action;
  const id=el.dataset.id;
  const idx=el.dataset.idx!==undefined?parseInt(el.dataset.idx):null;
  const v=clientS;

  if(action==="pick-role"){loginRole=el.dataset.role;loginPin="";loginError="";render();return;}
  if(action==="back-role"){loginRole=null;loginPin="";loginError="";render();return;}
  if(action==="pin-digit"){pinAdd(el.dataset.digit);return;}
  if(action==="pin-del"){pinDel();return;}

  if(action==="logout"){
    resetClient();
    kitchenTimers={};
    srvS={tab:"tables",orderStep:"table",orderTable:null,orderCart:{},orderCat:"Plats"};
    gerS={tab:"validation"};
    admS={section:"menu",editingDish:null,newStaff:{name:"",role:"serveuse",pin:""},stockForm:{stockId:"",type:"Entrée",qty:0,motif:""},histFilter:{type:"Tous",payment:"Tous",query:""},settingsForm:null};
    livS={tab:"available"};
    A.logout();
    return;
  }

  if(action==="client-mode"){v.mode=el.dataset.mode;v.screen="menu";render();return;}
  if(action==="client-home"){v.screen="landing";v.mode=null;v.cart={};v.orderId=null;v.refusedIdx=null;render();return;}
  if(action==="client-back"){
    if(v.screen==="menu")v.screen="landing";
    else if(v.screen==="table")v.screen="menu";
    else if(v.screen==="address")v.screen="menu";
    else if(v.screen==="cart")v.screen=v.mode==="sur_place"?"table":"address";
    render();return;
  }
  if(action==="client-cat"){v.cat=el.dataset.cat;render();return;}
  if(action==="client-add"){v.cart[id]=(v.cart[id]||0)+1;render();return;}
  if(action==="client-remove"){if(v.cart[id]>1)v.cart[id]--;else delete v.cart[id];render();return;}
  if(action==="client-cart"){v.screen=v.mode==="sur_place"?"table":"address";render();return;}
  if(action==="client-table"){v.tableId=id;v.screen="cart";render();return;}
  if(action==="client-to-cart"){v.screen="cart";render();return;}
  if(action==="client-cancel-wait"){v.screen="menu";v.orderId=null;render();return;}
  if(action==="client-submit"){
    const items=DATA.menu.filter(m=>v.cart[m._docId]>0).map(d=>({id:d._docId,name:d.name,price:d.price,qty:v.cart[d._docId],time:d.time}));
    const orderData={type:v.mode==="sur_place"?"sur_place":"livraison",items};
    if(v.mode==="sur_place"){
      const t=DATA.tables.find(x=>x._docId===v.tableId);
      const day=DATA.affectation[nowDate()]||{};
      orderData.tableId=v.tableId;orderData.tableNumber=t?t.number:null;orderData.serveuseId=day[v.tableId]||null;
    }else{
      orderData.clientInfo={name:v.info.name,phone:v.info.phone,address:v.info.address};
    }
    v.orderId=await A.addOrder(orderData);
    v.screen="waiting";render();return;
  }
  if(action==="client-remove-refused"){
    const order=DATA.orders.find(o=>o._docId===v.orderId);
    if(order){
      const newItems=order.items.filter((it,i)=>i!==v.refusedIdx);
      await A.updateOrder(order._docId,{items:newItems});
    }
    v.refusedIdx=null;v.screen="payment";render();return;
  }
  if(action==="client-pay"){
    const method=el.dataset.method;
    const ref=method==="momo"?"REF"+Math.floor(Math.random()*1000000):null;
    await A.payOrder(v.orderId,method,ref);
    v.timerTotal=0;v.timerRemaining=0;render();return;
  }

  if(action==="srv-home"){srvS.tab="tables";srvS.orderStep="table";srvS.orderTable=null;srvS.orderCart={};render();return;}
  if(action==="srv-tab"){srvS.tab=el.dataset.tab;render();return;}
  if(action==="srv-pick-table"){srvS.orderTable=id;srvS.orderStep="menu";render();return;}
  if(action==="srv-back-table"){srvS.orderStep="table";srvS.orderTable=null;srvS.orderCart={};render();return;}
  if(action==="srv-cat"){srvS.orderCat=el.dataset.cat;render();return;}
  if(action==="srv-add"){srvS.orderCart[id]=(srvS.orderCart[id]||0)+1;render();return;}
  if(action==="srv-remove"){if(srvS.orderCart[id]>1)srvS.orderCart[id]--;else delete srvS.orderCart[id];render();return;}
  if(action==="srv-send"){
    const items=DATA.menu.filter(m=>srvS.orderCart[m._docId]>0).map(d=>({id:d._docId,name:d.name,price:d.price,qty:srvS.orderCart[d._docId],time:d.time}));
    const t=DATA.tables.find(x=>x._docId===srvS.orderTable);
    const me=DATA.staff.find(s=>s.name===SESSION.name&&s.role==="serveuse");
    await A.addOrder({type:"sur_place",tableId:srvS.orderTable,tableNumber:t?t.number:null,serveuseId:me?me._docId:null,serveuseName:SESSION.name,items});
    srvS.orderCart={};srvS.orderTable=null;srvS.orderStep="table";
    toast("Commande envoyée au gérant");
    render();return;
  }
  if(action==="srv-confirm-cash"){await A.confirmCash(id);toast("Paiement cash confirmé");return;}
  if(action==="srv-served"){await A.markServed(id);render();return;}

  if(action==="ger-home"){gerS.tab="validation";render();return;}
  if(action==="ger-tab"){gerS.tab=el.dataset.tab;render();return;}
  if(action==="ger-item-valid"){await A.setItemStatut(id,idx,"Validé");return;}
  if(action==="ger-item-refuse"){await A.setItemStatut(id,idx,"Refusé");return;}
  if(action==="ger-motif"){await A.setItemMotif(id,idx,el.dataset.motif);return;}
  if(action==="ger-validate"){await A.validateOrder(id);toast("Commande validée");return;}
  if(action==="ger-affect"){
    const today=nowDate();
    const day=DATA.affectation[today]||{};
    const currentlyMine=day[el.dataset.table]===el.dataset.serveuse;
    await A.setAffectation(today,el.dataset.table,currentlyMine?null:el.dataset.serveuse);
    return;
  }

  if(action==="cui-home"){render();return;}
  if(action==="cui-ready"){await A.markReady(id);toast("Cuisine : plat prêt");return;}

  if(action==="liv-home"){livS.tab="available";render();return;}
  if(action==="liv-tab"){livS.tab=el.dataset.tab;render();return;}
  if(action==="liv-take"){
    const me=DATA.staff.find(s=>s.name===SESSION.name&&s.role==="livreur");
    if(me)await A.takeDelivery(id,me._docId);
    livS.tab="current";render();return;
  }
  if(action==="liv-enroute"){await A.setDeliveryStatus(id,"en_route");return;}
  if(action==="liv-done"){await A.markDelivered(id);return;}

  if(action==="admin-home"){admS.section="menu";admS.editingDish=null;render();return;}
  if(action==="admin-section"){admS.section=el.dataset.section;admS.editingDish=null;render();return;}
  if(action==="admin-add-dish"){await A.addDish({name:"Nouveau plat",cat:"Plats",price:0,time:10,available:true,desc:""});return;}
  if(action==="admin-edit-dish"){admS.editingDish=id;render();return;}
  if(action==="admin-save-dish"){
    const row=el.closest("tr");
    const name=row.querySelector('[data-input="dish-name"]').value;
    const cat=row.querySelector('[data-input="dish-cat"]').value;
    const price=parseInt(row.querySelector('[data-input="dish-price"]').value)||0;
    const time=parseInt(row.querySelector('[data-input="dish-time"]').value)||0;
    const avail=row.querySelector('[data-input="dish-avail"]').checked;
    await A.updateDish(id,{name,cat,price,time,available:avail});
    admS.editingDish=null;return;
  }
  if(action==="admin-del-dish"){if(confirm("Supprimer ce plat ?"))await A.removeDish(id);return;}
  if(action==="admin-add-staff"){await A.addStaff({...admS.newStaff});admS.newStaff={name:"",role:"serveuse",pin:""};render();return;}
  if(action==="admin-reset-pin"){const pin=await A.resetPin(id);toast("Nouveau PIN : "+pin);return;}
  if(action==="admin-del-staff"){if(confirm("Supprimer ce compte ?"))await A.removeStaff(id);return;}
  if(action==="admin-add-table"){await A.addTable();return;}
  if(action==="admin-del-table"){if(confirm("Supprimer cette table ?"))await A.removeTable(id);return;}
  if(action==="admin-add-move"){
    if(!admS.stockForm.stockId||!admS.stockForm.qty)return;
    await A.addStockMove({...admS.stockForm});
    admS.stockForm={stockId:admS.stockForm.stockId,type:"Entrée",qty:0,motif:""};
    toast("Mouvement enregistré");return;
  }
  if(action==="admin-save-settings"){await A.updateSettings(admS.settingsForm);admS.settingsForm=null;toast("Paramètres enregistrés");return;}
  if(action==="admin-export-csv"){
    const paid=DATA.orders.filter(o=>["payee","servie","livree"].includes(o.status));
    const csv=["Date,Heure,Type,Table/Adresse,Plats,Prix,Paiement"].concat(paid.map(o=>{
      const d=new Date(o.createdAt);
      const items=o.items.filter(i=>i.statut!=="Refusé").map(i=>i.qty+"x "+i.name).join("; ");
      const loc=o.type==="livraison"?(o.clientInfo?.address||""):"Table "+(o.tableNumber||"");
      return [o.date,d.toLocaleTimeString("fr-FR"),o.type,loc,'"'+items+'"',orderTotal(o),o.paymentMethod||""].join(",");
    })).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="historique_ventes.csv";a.click();
    URL.revokeObjectURL(url);return;
  }
});

document.addEventListener("input",function(e){
  const el=e.target;const key=el.dataset.input;if(!key)return;
  const v=clientS;
  if(key==="info-name")v.info.name=el.value;
  if(key==="info-phone")v.info.phone=el.value;
  if(key==="info-address")v.info.address=el.value;
  if(key==="new-staff-name")admS.newStaff.name=el.value;
  if(key==="new-staff-pin"){admS.newStaff.pin=el.value.replace(/\D/g,"").slice(0,4);render();}
  if(key==="stock-id")admS.stockForm.stockId=el.value;
  if(key==="stock-qty")admS.stockForm.qty=parseFloat(el.value)||0;
  if(key==="stock-motif")admS.stockForm.motif=el.value;
  if(key==="hist-query"){admS.histFilter.query=el.value;render();}
  if(key==="set-name"&&admS.settingsForm)admS.settingsForm.restaurantName=el.value;
  if(key==="set-phone"&&admS.settingsForm)admS.settingsForm.phone=el.value;
  if(key==="set-frais"&&admS.settingsForm)admS.settingsForm.fraisLivraison=parseInt(el.value)||0;
});
document.addEventListener("change",function(e){
  const el=e.target;const key=el.dataset.input;if(!key)return;
  if(key==="new-staff-role")admS.newStaff.role=el.value;
  if(key==="stock-type")admS.stockForm.type=el.value;
  if(key==="hist-type"){admS.histFilter.type=el.value;render();}
  if(key==="hist-payment"){admS.histFilter.payment=el.value;render();}
  if(key==="set-timer"&&admS.settingsForm)admS.settingsForm.timerMode=el.value;
  if(key==="set-wait"&&admS.settingsForm)admS.settingsForm.waitMode=el.value;
});

document.addEventListener("keydown",function(e){
  if(SESSION)return;
  if(!loginRole||loginRole==="client")return;
  if(/^\d$/.test(e.key)){pinAdd(e.key);e.preventDefault();return;}
  if(e.key==="Backspace"){pinDel();e.preventDefault();return;}
});

setInterval(function(){
  if(!SESSION)return;
  if(SESSION.role==="cuisine"){render();}
  if(SESSION.role==="client"&&clientS.screen==="tracking"&&clientS.timerRemaining>0){
    clientS.timerRemaining--;render();
  }
},1000);

(async function boot(){
  try {
    await seedIfEmpty();
    subscribeAll(render);
    render();
  } catch(e) {
    console.error(e);
    document.getElementById("root").innerHTML =
      '<div class="loader"><div class="loader-logo">⚠️</div>'+
      '<p class="loader-text" style="color:#ff7066;max-width:300px;text-align:center">Erreur : '+esc(e.message||e)+'</p>'+
      '<button onclick="location.reload()" style="margin-top:20px;padding:12px 24px;background:#ffc107;color:#0a0a0a;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer">Réessayer</button>'+
      '</div>';
  }
})();
</script>
</body>
</html>
