<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--creme);color:#1a1a1a}
.serif{font-family:Georgia,'Times New Roman',serif}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px}
.app{min-height:100vh;display:flex;flex-direction:column}
.loader{position:fixed;inset:0;background:var(--noir);color:var(--jaune);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.loader-logo{width:80px;height:80px;border-radius:50%;background:var(--jaune);color:var(--noir);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;margin-bottom:16px;font-family:Georgia,serif}
.loader-text{margin-top:20px;font-size:14px;color:#888;text-align:center;padding:0 20px}
.spin{width:40px;height:40px;border:4px solid #222;border-top-color:var(--jaune);border-radius:50%;animation:spin 1s linear infinite;margin-top:20px}

.login{min-height:100vh;background:var(--noir);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}

.login h1{font-size:26px;margin:0 0 20px;text-align:center;font-family:Georgia,serif}
.login h1 span{color:var(--jaune)}
.login-sub{font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:var(--jaune);margin-bottom:6px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px}
.role-btn{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:14px;text-align:left;color:white}
.role-btn .em{font-size:22px;margin-bottom:6px}

.pin-wrap{width:100%;max-width:340px}
.pin-display{display:flex;justify-content:center;gap:12px;margin:20px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #444}
.pin-dot.filled{background:var(--jaune);border-color:var(--jaune)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-key{aspect-ratio:1.6;background:#1a1a1a;border:1px solid #333;border-radius:12px;color:white;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center}
.pin-key.blank{background:transparent;border:none}
.pin-key.del{background:#333;font-size:20px}
.pin-error{color:#ff7066;font-size:13px;text-align:center;margin-top:12px}
.pin-back{display:block;margin:16px auto 0;color:#888;background:transparent;font-size:13px;text-decoration:underline;padding:8px}
.pin-hint{font-size:11px;color:#666;margin-top:14px;text-align:center;line-height:1.7}
.auth-input{width:100%;padding:12px;border:1px solid #333;border-radius:8px;font-size:16px;background:#1a1a1a;color:white;margin-top:6px}

.topbar-btn{background:transparent;color:white;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;min-height:40px}
.topbar-title{flex:1;font-family:Georgia,serif;font-size:15px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-sub{font-size:10px;color:#aaa;margin:0;text-align:center}
.topbar-logout{background:transparent;color:#ff7066;font-size:12px;padding:8px;font-weight:600}
.topbar-badge{background:rgba(255,193,7,0.15);color:var(--jaune);font-size:11px;padding:6px 10px;border-radius:8px;font-weight:700;white-space:nowrap}
.tabs-scroll{background:var(--noir);border-top:1px solid #333;padding:0 6px 8px;display:flex;gap:4px;flex-wrap:wrap}

.tabs-scroll .tab.active{background:var(--jaune);color:var(--noir)}
.bottom-nav{display:grid;background:white;border-top:2px solid var(--jaune);position:sticky;bottom:0;z-index:20}
.bottom-nav.cols-4{grid-template-columns:repeat(4,1fr)}
.bottom-nav.cols-3{grid-template-columns:repeat(3,1fr)}
.bn-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 12px;font-size:11px;font-weight:500;background:transparent;color:var(--gris);position:relative;min-height:56px}
.bn-btn.active{color:var(--jaune-fonce)}
.bn-btn .em{font-size:22px;line-height:1}
.bn-badge{position:absolute;top:6px;right:calc(50% - 24px);background:var(--rouge);color:white;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:bold}
.content{flex:1;padding:16px;width:100%}
.content-narrow{max-width:520px;margin:0 auto}
.section-title{font-family:Georgia,serif;font-size:22px;margin:0 0 4px}
.section-sub{font-size:13px;color:var(--gris);margin:0 0 16px}
.card{background:white;border:1px solid var(--sable);border-radius:12px;padding:14px}
.card+.card{margin-top:10px}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title{font-weight:600;margin:0;font-size:15px}
.card-sub{font-size:12px;color:var(--gris);margin:2px 0 0}
.btn{padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--noir);color:white}
.btn-accent{background:var(--jaune);color:var(--noir);font-weight:700}
.btn-success{background:var(--vert);color:white}
.btn-danger{background:var(--rouge);color:white}

.btn-block{display:flex;width:100%}
.btn-sm{padding:6px 12px;font-size:12px;min-height:36px}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;display:inline-block}
.badge-neutre{background:rgba(107,107,107,0.12);color:var(--gris)}
.badge-vert{background:rgba(45,122,62,0.12);color:var(--vert)}

.dish-name{font-weight:600;font-size:15px;margin:0}
.dish-desc{font-size:12px;color:var(--gris);margin:2px 0 0}
.dish-meta{display:flex;align-items:center;gap:10px;margin-top:6px}

.menu-header{background:var(--noir);color:white;padding:16px;position:sticky;top:0;z-index:10;border-bottom:2px solid var(--jaune)}
.cat-tabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-btn{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid var(--sable);background:white;color:var(--gris)}

.cat-btn.on-dark{background:transparent;border-color:#444;color:#aaa}
.cat-btn.on-dark.active{background:var(--jaune);color:var(--noir);border-color:var(--jaune)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-card{background:white;border:1px solid var(--sable);border-radius:12px;padding:14px;border-left:4px solid var(--jaune)}
.stat-label{font-size:12px;color:var(--gris);margin:0 0 4px}
.stat-value{font-family:Georgia,serif;font-size:22px;font-weight:bold;margin:0}
.table-wrap{background:white;border:1px solid var(--sable);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:#faf8f2;color:var(--gris)}
th{text-align:left;padding:10px 12px;font-weight:500;font-size:12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid #f0ede4;vertical-align:middle}
.progress-circle{position:relative;width:180px;height:180px;margin:0 auto 20px}
.progress-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.progress-circle .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.table-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.table-cell{aspect-ratio:1;background:white;border:1px solid var(--sable);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;min-height:56px}
.table-cell.active{background:var(--jaune);border-color:var(--jaune);color:var(--noir)}
.timer{font-family:monospace;font-size:20px;font-weight:bold}
.timer.urgent{color:var(--rouge)}
.timer.ok{color:var(--vert)}
.ticket{background:white;border:2px solid var(--sable);border-radius:16px;padding:14px}
.ticket.urgent{border-color:var(--rouge)}
.empty{text-align:center;color:var(--gris);padding:24px 12px;font-size:14px}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.gap-2{gap:8px}.gap-3{gap:12px}
.text-sm{font-size:13px}.text-xs{font-size:11px}
.muted{color:var(--gris)}.mono{font-family:monospace}.bold{font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--noir);color:white;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;border:2px solid var(--jaune);box-shadow:0 8px 24px rgba(0,0,0,0.3);max-width:90%;text-align:center}
.qr-card{background:white;border:2px solid var(--noir);border-radius:12px;padding:16px;text-align:center}
.qr-card img{width:180px;height:180px;display:block;margin:0 auto 10px}
.qr-card .qr-table-num{font-family:Georgia,serif;font-size:32px;font-weight:bold;color:var(--noir)}
.qr-card .qr-resto{font-family:Georgia,serif;font-size:16px;color:var(--jaune-fonce);font-weight:bold;margin-bottom:4px}
.qr-card .qr-hint{font-size:11px;color:var(--gris);margin-top:6px}
.cat-group{margin-bottom:24px}
.cat-group-title{font-family:Georgia,serif;font-size:18px;color:var(--noir);padding:8px 12px;background:var(--jaune);border-radius:8px;margin-bottom:8px;display:inline-block}
.alert-banner{background:rgba(192,57,43,0.1);border:2px solid var(--rouge);border-radius:12px;padding:14px;margin-bottom:16px}
.alert-banner strong{color:var(--rouge)}
#map{width:100%;height:320px;border-radius:12px;border:2px solid var(--sable);z-index:1}
.map-info{background:var(--noir);color:white;padding:12px 14px;border-radius:12px;margin-top:12px;border-left:4px solid var(--jaune)}
.map-info .dist{font-family:monospace;font-size:20px;font-weight:bold;color:var(--jaune)}
.chart-bar{display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar .bar{background:var(--jaune);width:100%;min-height:4px;border-radius:4px 4px 0 0}
.chart-bar .lbl{font-size:10px;color:var(--gris);white-space:nowrap}
.chart-bar .val{font-size:10px;font-weight:bold;font-family:monospace}
.chart-container{display:flex;align-items:flex-end;gap:4px;height:200px;padding:16px;background:white;border:1px solid var(--sable);border-radius:12px;overflow-x:auto}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:white;border-radius:16px;max-width:420px;width:100%;padding:24px;text-align:center;border:3px solid var(--jaune)}
.modal-card h2{font-family:Georgia,serif;font-size:22px;margin:0 0 12px}
.modal-card p{color:var(--gris);font-size:14px;margin-bottom:12px}
.pin-modal-input{text-align:center;font-size:28px;letter-spacing:0.8em;font-family:monospace;padding:12px 12px 12px 20px;width:220px;margin:12px auto;display:block;border:2px solid var(--sable);border-radius:12px;background:var(--creme);color:#000}
.pin-modal-input:focus{outline:none;border-color:var(--jaune)}
.recovery-code{font-family:monospace;font-size:24px;font-weight:bold;color:var(--noir);background:var(--creme);border:2px dashed var(--jaune);border-radius:12px;padding:16px;margin:16px 0;letter-spacing:0.1em;text-align:center}
.log-row{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #f0ede4;font-size:12px;gap:10px;align-items:flex-start}
.log-row:last-child{border-bottom:none}
.log-row .when{color:var(--gris);font-family:monospace;font-size:10px;margin-top:2px}
.log-ok{color:var(--vert);font-weight:600}
.log-fail{color:var(--rouge);font-weight:600}

.discreet-zone:hover,.discreet-zone:focus-within{opacity:1}
.discreet-zone input{width:60px;padding:4px;border:1px solid var(--sable);border-radius:4px;text-align:center;font-size:12px;background:transparent}
.discreet-zone button{background:transparent;color:var(--gris);font-size:11px;padding:4px 8px;text-decoration:underline}
.flow-step{background:#faf8f2;border-left:4px solid var(--jaune);padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:13px}
.role-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:2px solid var(--sable);font-size:13px;font-weight:600;background:white;color:var(--gris);cursor:pointer;user-select:none}
.role-chip.on{background:var(--jaune);color:var(--noir);border-color:var(--jaune)}
.role-chip.locked{opacity:0.4;cursor:not-allowed}
.momo-box{background:var(--noir);color:white;padding:16px;border-radius:12px;border:2px solid var(--jaune);text-align:center}
.momo-num{font-family:monospace;font-size:22px;font-weight:bold;color:var(--jaune);letter-spacing:0.05em;margin:8px 0}
.star-row{display:flex;gap:8px;justify-content:center;font-size:32px;margin:14px 0}
.star{cursor:pointer;color:#ddd;transition:color 0.15s;user-select:none}

.claim-opt.on .dot{background:var(--jaune);border-color:var(--jaune)}
@media print{@page{size:80mm auto;margin:0}body *{visibility:hidden}#qr-print-area,#qr-print-area *{visibility:visible}#qr-print-area{position:absolute;left:0;top:0;width:100%;padding:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:20px}#invoice-print,#invoice-print *{visibility:visible}#invoice-print{position:absolute;left:0;top:0;width:80mm;padding:2mm 3mm;font-family:'Courier New',monospace;font-size:11px;color:#000;background:#fff}#invoice-print .inv-line{border-top:1px dashed #000;margin:4px 0}}
#invoice-print{display:none;font-family:'Courier New',monospace}
</style>

<body>
<div id="root"><div class="loader"><div class="loader-logo">D&S</div><h1 style="font-family:Georgia,serif;margin:0 0 20px;color:var(--jaune)">Restaurant D&S</h1><div class="spin"></div><p class="loader-text">Connexion…</p></div></div>
<div id="invoice-print"></div>
<script>
(function(){
  function show(msg){ var r=document.getElementById('root'); if(r && r.querySelector('.loader')){ r.innerHTML='<div class="loader"><div class="loader-logo">⚠️</div><p class="loader-text" style="color:#ff7066;max-width:300px;text-align:center">'+msg+'</p><button onclick="location.reload()" style="margin-top:16px;padding:10px 20px;border-radius:10px;border:none;background:#fdc400;font-weight:700">Réessayer</button></div>'; } }
  window.addEventListener('error',function(e){ show('Erreur de chargement : '+(e.message||'inconnue')); });
  window.addEventListener('unhandledrejection',function(e){ show('Erreur : '+((e.reason&&e.reason.message)||e.reason||'inconnue')); });
  setTimeout(function(){ show('Connexion impossible. Ouvrez le lien directement dans Chrome (pas dans un aperçu) et vérifiez votre connexion internet.'); },12000);
})();
</script>

// ============================================================
function getBeninTime(){ const now=new Date(); return { hour:(now.getUTCHours()+1)%24, min:now.getUTCMinutes(), sec:now.getUTCSeconds() }; }
function getBeninHour(){ return getBeninTime().hour; }
function getOpenHour(){ return DATA.settings.openHour != null ? Number(DATA.settings.openHour) : 11; }
function getCloseHour(){ return DATA.settings.closeHour != null ? Number(DATA.settings.closeHour) : 2; }
function isWithinOpenHours(){
  const h=getBeninHour(); const open=getOpenHour(); const close=getCloseHour();
  if(open === close) return true;
  if(open < close) return h >= open && h < close;
  return h >= open || h < close;
}
function hasGraceActive(){ return Date.now() < Number(DATA.settings.graceUntil || 0); }
function getGraceRemainingMin(){ const ms = Number(DATA.settings.graceUntil||0) - Date.now(); return ms > 0 ? Math.ceil(ms/60000) : 0; }
function isAppAllowed(role){
  if(role === "admin") return true;
  if(isWithinOpenHours()) return true;
  if(hasGraceActive()){ if(!role) return true; return (DATA.settings.graceRoles||[]).includes(role); }
  return false;
}

function sendPush(title, message, targetRole){
  console.log("📤 PUSH → [" + (targetRole || "STAFF") + "] " + title + " : " + message);
  try{
    const url = webhookUrl(); const token = webhookToken();
    if(!url || !token){ console.warn("⚠️ Push non configuré"); return; }
    const body = { token, title, message };
    if(targetRole) body.targetRole = targetRole; else body.staffOnly = true;
    fetch(url, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body) }).catch(e=>console.warn("Push fetch error:", e));
  } catch(e){ console.warn("❌ Erreur push :", e); }
}
async function applyRoleTag(role){
  const MAX_TRIES = 12; const tagRole = role || "anonymous"; const isStaff = role && role !== "client";
  for(let i=0;i<MAX_TRIES;i++){
    try{
      const OS = window.OneSignal;
      if(OS && OS.User && typeof OS.User.addTag === "function"){
        await OS.User.addTag("role", tagRole); await OS.User.addTag("is_staff", isStaff ? "true" : "false");
        console.log("🏷️ Tag appliqué → role=" + tagRole); return true;
      }
    }catch(e){ console.warn("Tag tentative " + i + " échouée:", e); }
    await new Promise(r => setTimeout(r, 500));
  }
  return false;
}

async function seedIfEmpty() {

function money(n){return (n||0).toLocaleString("fr-FR")+" F";}
function nowDate(){const d=new Date();const y=d.getUTCFullYear();const m=String(d.getUTCMonth()+1).padStart(2,"0");const day=String(d.getUTCDate()).padStart(2,"0");return y+"-"+m+"-"+day;}
function fmtDate(iso){return new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"short"});}
function fmtDateTime(ts){const d=new Date(ts);return d.toLocaleDateString("fr-FR")+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});}
function timeAgo(ts){if(!ts)return "à l'instant";const m=Math.floor((Date.now()-ts)/60000);if(m<=0)return "à l'instant";if(m<60)return "il y a "+m+" min";return "il y a "+Math.floor(m/60)+"h";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function validPhoneBJ(p){return /^01\d{8}$/.test(String(p||"").replace(/\s/g,""));}

function bilanStart(){const now=new Date();const h=DATA.settings.bilanResetHour||6;const start=new Date(now);start.setHours(h,0,0,0);if(now.getHours()<h)start.setDate(start.getDate()-1);return start.getTime();}
function inCurrentBilan(o){ return (o.createdAt||0) >= bilanStart(); }

function haversineKm(lat1,lon1,lat2,lon2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(a));}
async function calcRoadDistanceKm(clientLat, clientLon){
  const rc = restoCoords();
  const url = "https://router.project-osrm.org/route/v1/driving/"+rc.lon+","+rc.lat+";"+clientLon+","+clientLat+"?overview=false&alternatives=false";
  try{const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),8000);const res=await fetch(url,{signal:ctrl.signal});clearTimeout(t);const data=await res.json();if(data.code==="Ok"&&data.routes&&data.routes[0])return {km:data.routes[0].distance/1000,source:"route"};}catch(e){}
  const straight=haversineKm(rc.lat,rc.lon,clientLat,clientLon);
  return { km: straight*1.4, source:"approx" };
}
function orderTimerInfo(o){const items=o.items.filter(i=>i.statut!=="Refusé");const maxTime=Math.max(...items.map(i=>i.time),0);const start=o.paidAt||o.createdAt;const deadline=start+maxTime*60*1000;const remainingMs=deadline-Date.now();const remainingSec=Math.floor(remainingMs/1000);const abs=Math.abs(remainingSec);const mm=String(Math.floor(abs/60)).padStart(2,"0");const ss=String(abs%60).padStart(2,"0");return { remainingMs, overdue: remainingMs<=0, text:(remainingMs<=0?"+":"")+mm+":"+ss, maxTime, urgent: remainingMs>0 && remainingMs<maxTime*60*1000*0.25 };}
function deliveryFeeFor(o){if(!o||o.type!=="livraison")return 0;if(o.deliveryKm!=null)return Math.round(o.deliveryKm*prixParKm());return 0;}
function repriceItems(items){return items.map(i=>{const d=DATA.menu.find(m=>m._docId===i.id);return d?{...i,price:d.price,time:d.time}:i;});}
function orderTotal(o){return o.items.filter(i=>i.statut!=="Refusé").reduce((s,i)=>s+i.price*i.qty,0);}
function orderGrandTotal(o){return orderTotal(o) + deliveryFeeFor(o);}
function orderIsFinal(o){ return o && (o.status==="servie" || o.status==="livree" || o.status==="refusee" || o.status==="annulee"); }

function subCol(list, col, key, tr, afterSet){

function authErrorMessage(e, pinMode){
  const c=(e && e.code) ? String(e.code) : "";
  if(c==="ds/role-mismatch") return "Accès refusé pour ce rôle";
  if(c==="auth/too-many-requests") return "Trop de tentatives. Réessayez dans quelques minutes.";
  if(c==="auth/network-request-failed") return "Pas de connexion internet";
  if(c.startsWith("auth/")) return pinMode ? "PIN incorrect" : "Identifiants incorrects";
  return "Erreur : "+((e && e.message) || c || "inconnue");
}

async function finishStaffLogin(expectedRole){
  const user=auth.currentUser;
  const snap=await getDoc(doc(db,"users",user.uid));
  const prof=snap.exists()?snap.data():null;
  if(!prof || prof.role!==expectedRole){ await resetToAnonymous(); throw {code:"ds/role-mismatch"}; }
  startStaffSubs(prof.role);
  loginRole=null; loginStaffId=null; loginPin=""; loginEmail=""; loginPassword=""; loginError=""; loginRecovery=null;
  A.login(prof.role,prof.name,user.uid);
  if(prof.role==="gerant"||prof.role==="admin") A.logAuth(prof.role,prof.email||"","✅ Connexion réussie");
  if(prof.role==="admin") adminMigrations();
}
async function restoreStaffSession(){
  const u=auth.currentUser; if(!u||u.isAnonymous) return;
  try{
    const snap=await getDoc(doc(db,"users",u.uid));
    if(snap.exists()){
      const p=snap.data();
      startStaffSubs(p.role);
      SESSION={role:p.role,name:p.name,uid:u.uid,userId:DEVICE_ID,since:Date.now()};
      setTimeout(loadOneSignal,200); applyRoleTag(p.role);

}

  // Table : numérotation intelligente (plus petit trou sinon max+1)
  async addTable(){
    const used = DATA.tables.map(t=>Number(t.number)).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
    let candidate = 1;
    for(let i=0;i<used.length;i++){ if(used[i] === candidate) candidate++; else if(used[i] > candidate) break; }
    if(candidate > 999) { throw new Error("Limite 999 tables atteinte"); }
    await addDoc(collection(db,"tables"),{number:candidate,token:Math.random().toString(36).slice(2,8)});
    return candidate;
  },

function statusBadge(o){
  if(o.status==="annulee")return '<span class="badge badge-neutre">Annulée</span>';
  if(o.status==="servie")return '<span class="badge badge-vert">Servie</span>';
  if(o.status==="livree")return '<span class="badge badge-vert">Livrée</span>';
  if(o.status==="refusee")return '<span class="badge badge-rouge">Refusée</span>';
  if(o.status==="att_verif_paiement")return '<span class="badge badge-rouge">Vérif paiement</span>';
  if(o.status==="att_collect")return '<span class="badge badge-orange">À encaisser</span>';

  return '<span class="badge badge-rouge">À valider</span>';
}

function screenClient(){
  const v=clientS, s=DATA.settings, menu=DATA.menu, tables=DATA.tables;
  const order=v.orderId?DATA.orders.find(o=>o._docId===v.orderId):null;

  // Si la commande est terminée et que le client a déjà noté/claimé → écran final
  if(order && orderIsFinal(order)){
    if(order.status==="refusee" && v.screen!=="fully_refused"){ v.screen="fully_refused"; }
    if(order.status==="livree"){
      const hasRating = !!order.rating;
      const hasClaim = !!order.claim;
      if(!hasRating && !hasClaim && v.screen!=="confirm_delivery" && v.screen!=="rate" && v.screen!=="claim" && v.screen!=="thanks"){
        v.screen = "confirm_delivery";
      }
      if(hasRating || hasClaim) v.screen = "thanks";
    }
    if(order.status==="servie" && v.screen==="tracking") v.screen="done";
  }

function renderDistancePanel(){if(clientS.deliveryLat==null)return '<div class="card" style="text-align:center;color:var(--gris);font-size:13px;margin-top:12px">Aucune position sélectionnée</div>';const fee=clientS.deliveryKm!=null?Math.round(clientS.deliveryKm*prixParKm()):0;return '<div class="map-info" style="margin-top:12px"><div class="flex between center"><div><div class="text-xs" style="color:#aaa">Distance route</div><div class="dist">'+(clientS.deliveryKm!=null?clientS.deliveryKm.toFixed(2)+" km":"Calcul…")+'</div></div><div style="text-align:right"><div class="text-xs" style="color:#aaa">Frais livraison</div><div class="dist">'+(fee?money(fee):"—")+'</div></div></div></div>';}
function updateDistancePanel(){const p=document.getElementById("distance-panel");if(p)p.innerHTML=renderDistancePanel();}
function initLeafletMap(){const mapEl=document.getElementById("map");if(!mapEl)return;if(mapInstance)destroyMap();const rc=restoCoords();mapInstance=L.map("map").setView([rc.lat,rc.lon],13);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OSM"}).addTo(mapInstance);L.marker([rc.lat,rc.lon]).addTo(mapInstance).bindPopup("🍽️ Restaurant D&S").openPopup();const lat=clientS.deliveryLat||rc.lat;const lon=clientS.deliveryLon||rc.lon;if(clientS.deliveryLat!=null){mapMarker=L.marker([lat,lon],{draggable:true}).addTo(mapInstance);mapMarker.on("dragend",()=>{const p=mapMarker.getLatLng();setClientPosition(p.lat,p.lng);});mapInstance.setView([lat,lon],15);}mapInstance.on("click",e=>{if(!mapMarker)mapMarker=L.marker([e.latlng.lat,e.latlng.lng],{draggable:true}).addTo(mapInstance);else mapMarker.setLatLng(e.latlng);mapMarker.off("dragend");mapMarker.on("dragend",()=>{const p=mapMarker.getLatLng();setClientPosition(p.lat,p.lng);});setClientPosition(e.latlng.lat,e.latlng.lng);});}
function setClientPosition(lat,lon){clientS.deliveryLat=lat;clientS.deliveryLon=lon;clientS.deliveryKm=null;updateDistancePanel();calcRoadDistanceKm(lat,lon).then(r=>{clientS.deliveryKm=r.km;updateDistancePanel();render();}).catch(e=>toast("Erreur calcul distance"));}
function destroyMap(){if(mapInstance){try{mapInstance.remove();}catch(e){}mapInstance=null;mapMarker=null;}}

    const cash=served.filter(o=>o.paymentMethod==="cash").reduce((s,o)=>s+orderGrandTotal(o),0);

  return '<div class="app">'+topbar({role:"Gérant",title:SESSION.name,homeAction:"ger-home"})+'<div class="tabs-scroll">'+[
    {k:"validation",l:"Validation"+((callBadge||pendingLiv.length)?' ⚠️'+(callBadge+pendingLiv.length):"")},
    {k:"claims",l:"🚨 Réclamations"+(claimBadge?" ("+claimBadge+")":"")},
    {k:"salle",l:"Salle"},
    {k:"livraisons",l:"🛵 Livraisons"+(livBadge?" ("+livBadge+")":"")},
    {k:"invoices",l:"🧾 Factures"+(invBadge?" ("+invBadge+")":"")},
    {k:"affectation",l:"Tables"},
    {k:"menuDuJour",l:"🍽️ Menu"+(todayMenu()===null?" ⚠️":"")},

}

  else if(v.tab==="history"){content='<h2 class="section-title">Historique</h2><p class="section-sub">'+done.length+' livrée(s)</p>'+(done.length===0?'<p class="empty">Aucune</p>':done.map(o=>'<div class="card card-row" style="margin-bottom:8px"><div style="min-width:0"><p class="card-title">'+esc(o.clientInfo?.address||"")+'</p><p class="card-sub">'+(o.servedAt?new Date(o.servedAt).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"")+'</p></div><span class="mono bold">'+money(Math.round((o.deliveryKm||0)*prixParKm()*LIVREUR_SHARE))+'</span></div>').join(""));}

}

function render(){
  const root=document.getElementById("root");
  if(mapInstance && (!SESSION || SESSION.role!=="client" || (clientS.screen!=="deliveryInfo"))) destroyMap();

  if(!SESSION){
    if(!isAppAllowed(null)){ root.innerHTML = screenClosed(); return; }
    root.innerHTML=screenLogin(); return;
  }
  if(!isAppAllowed(SESSION.role)){ SESSION=null; root.innerHTML = screenClosed(); return; }

  const saved=preserveInput();
  let html="";
  if(SESSION.role==="client")html=screenClient();
  else if(SESSION.role==="serveuse")html=screenServeuse();
  else if(SESSION.role==="gerant")html=screenGerant();
  else if(SESSION.role==="cuisine")html=screenCuisine();
  else if(SESSION.role==="livreur")html=screenLivreur();
  else if(SESSION.role==="admin")html=screenAdmin();
  if(SESSION.role==="admin" && pendingReset) html+=screenPinModal();
  root.innerHTML=html;
  restoreInput(saved);
  if(SESSION.role==="client" && clientS.screen==="deliveryInfo"){setTimeout(initLeafletMap,80);}
  setTimeout(()=>{
    const btn = document.getElementById("pwa-install-btn");
    if(btn && window.__deferredPrompt){ btn.style.background = "var(--jaune)"; btn.style.color = "var(--noir)"; }
  }, 200);
  if(pendingReset){
    setTimeout(()=>{ const el=document.getElementById("reset-pin-input"); if(el){ el.value=pendingReset.pin||""; el.focus(); } }, 60);
  }
}

function pinAdd(d){if(loginBusy||loginPin.length>=6)return;loginPin+=d;loginError="";if(loginPin.length===6){attemptPinLogin();}else render();}
function pinDel(){if(loginBusy)return;loginPin=loginPin.slice(0,-1);loginError="";render();}

function printInvoice(orderId){
  const o=DATA.orders.find(x=>x._docId===orderId);if(!o)return;
  const items=o.items.filter(i=>i.statut!=="Refusé");const sub=orderTotal(o);const fee=deliveryFeeFor(o);const total=sub+fee;
  const date=new Date(o.paidAt||o.createdAt);
  let html='<div style="text-align:center"><div style="font-size:16px;font-weight:bold">'+esc(DATA.settings.restaurantName||"Restaurant D&S")+'</div></div><div class="inv-line"></div><div style="font-size:11px"><div>Ticket: '+o._docId.slice(-8).toUpperCase()+'</div><div>Date: '+date.toLocaleDateString("fr-FR")+'</div><div>Type: '+(o.type==="livraison"?"LIVRAISON":"SUR PLACE")+'</div></div><div class="inv-line"></div>';

// Restauration commande client (le client relit uniquement sa propre commande)
function restoreClientOrder(){
  const savedOrderId=localStorage.getItem("ds_client_order");
  if(!savedOrderId) return;
  if(SESSION && SESSION.role!=="client") return;
  watchClientOrder(savedOrderId);
  const ci=setInterval(()=>{
    if(!DATA.orders.length) return;
    const o=DATA.orders.find(x=>x._docId===savedOrderId);
    if(o && o.status!=="refusee" && o.status!=="annulee"){
      clientS.orderId=savedOrderId;
      if(!SESSION || SESSION.role!=="client"){
        SESSION = { role:"client", name:"Client", userId:DEVICE_ID, since:Date.now() };
        applyRoleTag("client");
      }
      if(o.status==="att_validation" || o.status==="att_verif_paiement")clientS.screen="waiting";
      else if(o.status==="att_collect")clientS.screen="serving";
      else if(o.status==="att_paiement")clientS.screen="serving";
      else if(o.status==="payee")clientS.screen="tracking";
      else if(o.status==="servie") clientS.screen="done";
      else if(o.status==="livree"){
        clientS.screen = (o.rating || o.claim) ? "thanks" : "confirm_delivery";
      }
      clearInterval(ci); render();
    }else{localStorage.removeItem("ds_client_order");watchClientOrder(null);clearInterval(ci);}
  },500);
  setTimeout(()=>clearInterval(ci),15000);
}

// Gestion URL
let urlParamsHandled = false;
function handleUrlParams(){
  if(urlParamsHandled) return;
  if(SESSION && SESSION.role!=="client"){ urlParamsHandled = true; return; }
  if(!LOADED.menu || !LOADED.tables) return; // attendre menu ET tables (évite « Table introuvable » si le menu arrive avant)
  urlParamsHandled = true;

  const params = new URLSearchParams(window.location.search);
  const t = params.get("table");
  const staff = params.get("staff");
  const admin = params.get("admin");

  if(admin === "1"){ urlMode = "admin"; console.log("🔐 Lien ADMIN"); return; }
  if(staff === "1"){ urlMode = "staff"; console.log("🔐 Lien STAFF"); return; }
  if(t){
    const num = parseInt(t);
    if(num){
      const f = DATA.tables.find(x => x.number === num);
      if(f){
        urlMode = "table";
        SESSION = { role:"client", name:"Client (T"+num+")", userId:DEVICE_ID, since:Date.now(), fromTable:true };
        setTimeout(loadOneSignal, 200); applyRoleTag("client");
        clientS.mode = "sur_place"; clientS.tableId = f._docId; clientS.screen = "menu"; clientS.cart = {};
        console.log("📱 QR table " + num);
        return;
      } else { console.warn("⚠️ Table " + num + " introuvable"); }
    }
  }
  // Pas de params = lien général → direct livraison
  urlMode = "default";
  SESSION = { role:"client", name:"Client (Livraison)", userId:DEVICE_ID, since:Date.now(), isDelivery:true };
  setTimeout(loadOneSignal, 200); applyRoleTag("client");
  clientS.mode = "livraison"; clientS.screen = "menu"; clientS.cart = {};
  console.log("🛵 Lien livraison général");
}

function withTimeout(p, ms, label){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("délai dépassé : "+label)),ms))]); }
(async function boot(){
  try{
    // 1) attendre l'état de connexion Firebase, 2) sinon connexion anonyme (client)
    await withTimeout(new Promise(res=>{ const un=onAuthStateChanged(auth,()=>{ un(); res(); }); }),8000,"état de connexion Firebase");
    if(!auth.currentUser) await withTimeout(signInAnonymously(auth),10000,"connexion anonyme Firebase");
    startPublicSubs();
    await withTimeout(restoreStaffSession(),10000,"reprise de session");
    handleUrlParams();
    render();
    restoreClientOrder();
    setTimeout(loadOneSignal, 2000);
  }catch(e){
    console.error(e);
    const hint=(e&&e.code==="auth/operation-not-allowed")?"La connexion anonyme n'est pas activée dans Firebase Authentication.":(e&&e.code==="auth/unauthorized-domain")?"Ce domaine n'est pas autorisé dans Firebase Authentication.":"";
    document.getElementById("root").innerHTML='<div class="loader"><div class="loader-logo">⚠️</div><p class="loader-text" style="color:#ff7066;max-width:300px;text-align:center">Erreur : '+esc(hint||e.message||e)+(e&&e.code?' ('+esc(e.code)+')':'')+'</p><button onclick="location.reload()" style="margin-top:20px;padding:12px 24px;background:#ffc107;color:#0a0a0a;border:none;border-radius:8px;font-weight:bold;cursor:pointer">Réessayer</button></div>';
  }
})();
