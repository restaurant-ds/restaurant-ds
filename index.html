function buildReceiptHtml(o){
  const items=o.items.filter(i=>i.statut!=="Refusé");
  const subtotal=orderTotal(o);
  const frais=getDeliveryFee(o);
  const total=subtotal+frais;
  const d=new Date(o.createdAt);
  const dateStr=d.toLocaleDateString("fr-FR")+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  const invNum=o.invoiceNumber||("DS-"+o._docId.slice(-6).toUpperCase());
  let html='<div class="receipt-paper">';
  html+='<h2>Restaurant D&S</h2>';
  html+='<p class="r-sub">RESTAURANT DÊGUÈ D&S</p>';
  html+='<p class="r-center">📍 Cotonou, Bénin</p>';
  html+='<p class="r-center">📞 '+(DATA.settings.phone||"")+'</p>';
  html+='<div class="r-line"></div>';
  html+='<div class="r-row"><span>Facture :</span><span><b>'+esc(invNum)+'</b></span></div>';
  html+='<div class="r-row"><span>Date :</span><span>'+dateStr+'</span></div>';
  html+='<div class="r-row"><span>Type :</span><span>'+(o.type==="livraison"?"Livraison":"Sur place")+'</span></div>';
  if(o.type==="sur_place"){
    html+='<div class="r-row"><span>Table :</span><span>'+(o.tableNumber||"—")+'</span></div>';
    if(o.serveuseName) html+='<div class="r-row"><span>Serveuse :</span><span>'+esc(o.serveuseName)+'</span></div>';
  } else {
    if(o.clientInfo?.name) html+='<div class="r-row"><span>Client :</span><span>'+esc(o.clientInfo.name)+'</span></div>';
    if(o.clientInfo?.phone) html+='<div class="r-row"><span>Tél :</span><span>'+esc(o.clientInfo.phone)+'</span></div>';
    if(o.clientInfo?.address) html+='<div class="r-row"><span>Adresse :</span><span style="text-align:right;max-width:50%;font-size:10px">'+esc(o.clientInfo.address)+'</span></div>';
    if(o.deliveryDistanceKm) html+='<div class="r-row"><span>Distance :</span><span>'+o.deliveryDistanceKm+' km</span></div>';
    if(o.livreurName) html+='<div class="r-row"><span>Livreur :</span><span>'+esc(o.livreurName)+'</span></div>';
  }
  html+='<div class="r-line"></div>';
  html+='<div class="r-row"><span><b>ARTICLE</b></span><span><b>PRIX</b></span></div>';
  html+='<div class="r-line"></div>';
  items.forEach(it=>{
    html+='<div class="r-row"><span>'+it.qty+'x '+esc(it.name)+'</span><span>'+money(it.price*it.qty)+'</span></div>';
  });
  html+='<div class="r-line"></div>';
  html+='<div class="r-row"><span>Sous-total</span><span>'+money(subtotal)+'</span></div>';
  if(frais>0) html+='<div class="r-row"><span>Livraison ('+o.deliveryDistanceKm+' km)</span><span>'+money(frais)+'</span></div>';
  html+='<div class="r-total"><span>TOTAL</span><span>'+money(total)+'</span></div>';
  html+='<div class="r-line"></div>';
  html+='<div class="r-row"><span>Paiement</span><span>'+(o.paymentMethod==="cash"?"Cash":o.paymentMethod==="momo"?"Mobile Money":"—")+'</span></div>';
  if(o.paymentRef) html+='<div class="r-row"><span>Réf.</span><span style="font-size:10px">'+esc(o.paymentRef)+'</span></div>';
  html+='<div class="r-line"></div>';
  html+='<p class="r-center" style="margin-top:8px"><b>MERCI DE VOTRE VISITE !</b></p>';
  html+='<p class="r-center" style="font-size:9px">Conservez ce reçu pour toute réclamation</p>';
  html+='<p class="r-center" style="font-size:9px">Restaurant D&S © '+new Date().getFullYear()+'</p>';
  html+='</div>';
  return html;
}
function printReceipt(orderId){
  const o=DATA.orders.find(x=>x._docId===orderId);
  if(!o){toast("Commande introuvable");return;}
  const area=document.getElementById("receipt-print-area");
  area.innerHTML=buildReceiptHtml(o);
  // Marquer comme imprimée
  A.markInvoicePrinted(orderId);
  setTimeout(()=>{window.print();},300);
}

// ==================== RENDER ====================
function render(){
  const root=document.getElementById("root");
  if(!SESSION){root.innerHTML=screenLogin();return;}
  const saved=preserveInput();
  let html="";
  if(SESSION.role==="client")html=screenClient();
  else if(SESSION.role==="serveuse")html=screenServeuse();
  else if(SESSION.role==="gerant")html=screenGerant();
  else if(SESSION.role==="cuisine")html=screenCuisine();
  else if(SESSION.role==="livreur")html=screenLivreur();
  else if(SESSION.role==="admin")html=screenAdmin();
  root.innerHTML=html;
  restoreInput(saved);
}

function pinAdd(d){if(loginPin.length>=4)return;loginPin+=d;loginError="";
  if(loginPin.length===4){setTimeout(()=>{const u=DATA.staff.find(s=>s.role===loginRole&&s.pin===loginPin);if(u){A.login(loginRole,u.name);loginRole=null;loginPin="";loginError="";}else{loginError="PIN incorrect";loginPin="";render();}},150);}else render();}
function pinDel(){loginPin=loginPin.slice(0,-1);loginError="";render();}

function printQrCodes(type){
  const printArea=document.createElement("div");
  printArea.id="qr-print-area";
  if(type==="unique"){
    printArea.innerHTML='<div class="qr-card" style="max-width:400px;margin:0 auto"><p class="qr-resto">Restaurant D&S</p>'+
      '<img src="'+qrUrl(SITE_URL,500)+'" alt="QR">'+
      '<p style="font-size:15px;margin-top:12px">Commandez directement depuis votre téléphone</p></div>';
  } else {
    printArea.innerHTML=DATA.tables.map(t=>{
      const url=SITE_URL+"?table="+t.number;
      return '<div class="qr-card"><p class="qr-resto">Restaurant D&S</p>'+
        '<img src="'+qrUrl(url,400)+'" alt="QR Table '+t.number+'">'+
        '<p class="qr-table-num">Table '+t.number+'</p></div>';
    }).join("");
  }
  document.body.appendChild(printArea);
  setTimeout(()=>{window.print();setTimeout(()=>printArea.remove(),500);},300);
}

// ==================== HANDLERS ====================
document.addEventListener("click",async function(e){
  const el=e.target.closest("[data-action]"); if(!el) return;
  const action=el.dataset.action;
  const id=el.dataset.id;
  const idx=el.dataset.idx!==undefined?parseInt(el.dataset.idx):null;
  const v=clientS;

  if(action==="pick-role"){loginRole=el.dataset.role;loginPin="";loginError="";
    if(loginRole==="client"){A.login("client","Client");}else{render();}return;}
  if(action==="back-role"){loginRole=null;loginPin="";loginError="";render();return;}
  if(action==="pin-digit"){pinAdd(el.dataset.digit);return;}
  if(action==="pin-del"){pinDel();return;}

  if(action==="logout"){resetClient();
    srvS={tab:"tables",orderStep:"table",orderTable:null,orderCart:{},orderCat:"Plats"};
    gerS={tab:"validation",invoiceOrderId:null};
    admS={section:"menu",editingDish:null,newStaff:{name:"",role:"serveuse",pin:""},stockForm:{stockId:"",type:"Entrée",qty:0,motif:""},newStockItem:{name:"",unit:"kg",initial:0,threshold:0},histFilter:{type:"Tous",payment:"Tous",query:""},settingsForm:null,showNewStock:false};
    livS={tab:"available"};A.logout();return;}

  // CLIENT
  if(action==="client-mode"){v.mode=el.dataset.mode;v.screen="menu";render();return;}
  if(action==="client-home"){v.screen="landing";v.mode=null;v.cart={};v.orderId=null;v.refusedIdx=null;v.clientLat=null;v.clientLon=null;v.deliveryDistanceKm=null;v.deliveryFee=0;render();return;}
  if(action==="client-back"){
    if(v.screen==="menu")v.screen="landing";
    else if(v.screen==="table")v.screen="menu";
    else if(v.screen==="address")v.screen="menu";
    else if(v.screen==="cart")v.screen=v.mode==="sur_place"?"table":"address";
    render();return;}
  if(action==="client-cat"){v.cat=el.dataset.cat;render();return;}
  if(action==="client-add"){v.cart[id]=(v.cart[id]||0)+1;render();return;}
  if(action==="client-remove"){if(v.cart[id]>1)v.cart[id]--;else delete v.cart[id];render();return;}
  if(action==="client-cart"){v.screen=v.mode==="sur_place"?"table":"address";render();return;}
  if(action==="client-table"){v.tableId=id;v.screen="cart";render();return;}
  if(action==="client-to-cart"){v.screen="cart";render();return;}
  if(action==="client-cancel-wait"){v.screen="menu";v.orderId=null;localStorage.removeItem("ds_client_order");render();return;}
  if(action==="client-calc-distance"){
    const addr=v.info.address.trim();
    if(addr.length<5){toast("Saisissez votre adresse");return;}
    v.calculatingDistance=true;render();
    try{
      const geo=await geocodeAddress(addr);
      if(!geo){v.calculatingDistance=false;toast("Adresse introuvable. Précisez le quartier.");render();return;}
      v.clientLat=geo.lat;v.clientLon=geo.lon;
      const result=await calculateDeliveryFee(geo.lat,geo.lon);
      v.calculatingDistance=false;
      if(!result){toast("Impossible de calculer la distance");render();return;}
      v.deliveryDistanceKm=result.km;
      v.deliveryFee=result.fee;
      toast("Distance : "+result.km+" km → "+money(result.fee));
      render();
    }catch(err){v.calculatingDistance=false;toast("Erreur réseau — réessayez");render();}
    return;
  }
  if(action==="client-submit"){
    const items=DATA.menu.filter(m=>v.cart[m._docId]>0).map(d=>({id:d._docId,name:d.name,price:d.price,qty:v.cart[d._docId],time:d.time}));
    const orderData={type:v.mode==="sur_place"?"sur_place":"livraison",items};
    if(v.mode==="sur_place"){
      const t=DATA.tables.find(x=>x._docId===v.tableId);
      const day=DATA.affectation[nowDate()]||{};
      const srvId=day[v.tableId]||null;
      const srv=DATA.staff.find(s=>s._docId===srvId);
      orderData.tableId=v.tableId;orderData.tableNumber=t?t.number:null;
      orderData.serveuseId=srvId;orderData.serveuseName=srv?srv.name:null;
    }else{
      orderData.clientInfo={name:v.info.name,phone:v.info.phone.replace(/\s/g,""),address:v.info.address};
      orderData.deliveryDistanceKm=v.deliveryDistanceKm;
      orderData.deliveryFee=v.deliveryFee;
      orderData.clientLat=v.clientLat;orderData.clientLon=v.clientLon;
    }
    v.orderId=await A.addOrder(orderData);
    localStorage.setItem("ds_client_order", v.orderId);
    v.screen="waiting";render();return;}
  if(action==="client-remove-refused"){
    const order=DATA.orders.find(o=>o._docId===v.orderId);
    if(order){const newItems=order.items.filter((it,i)=>i!==v.refusedIdx);await A.updateOrder(order._docId,{items:newItems});}
    v.refusedIdx=null;v.screen="payment";render();return;}
  if(action==="client-pay"){
    const method=el.dataset.method;
    const ref=method==="momo"?"REF"+Math.floor(Math.random()*1000000):null;
    await A.markOrderPaid(v.orderId,method,ref);v.timerTotal=0;v.timerRemaining=0;render();return;}
  if(action==="client-edit-order"){
    const order=DATA.orders.find(o=>o._docId===v.orderId); if(!order) return;
    v.editCart={};
    order.items.filter(it=>it.statut!=="Refusé").forEach(it=>{v.editCart[it.id]=it.qty;});
    v.editingOrder=true;v.screen="editOrder";render();return;}
  if(action==="client-edit-cancel"){v.screen="payment";render();return;}
  if(action==="client-edit-cat"){v.cat=el.dataset.cat;render();return;}
  if(action==="client-edit-add"){v.editCart[id]=(v.editCart[id]||0)+1;render();return;}
  if(action==="client-edit-remove"){if(v.editCart[id]>1)v.editCart[id]--;else delete v.editCart[id];render();return;}
  if(action==="client-edit-save"){
    const order=DATA.orders.find(o=>o._docId===v.orderId); if(!order) return;
    const newItems=Object.entries(v.editCart).map(([did,q])=>{
      const dish=DATA.menu.find(d=>d._docId===did);
      return dish?{id:did,name:dish.name,price:dish.price,qty:q,time:dish.time,statut:"Validé",motif:null}:null;
    }).filter(Boolean);
    await A.updateOrder(order._docId,{items:newItems,editedAt:Date.now()});
    v.screen="payment";v.editingOrder=false;v.editCart={};toast("Commande mise à jour");render();return;}
  if(action==="client-call-serveuse"){
    const order=DATA.orders.find(o=>o._docId===v.orderId); if(!order) return;
    await A.callServeuse(order._docId);
    notify("🔔 Client appelle","Table "+(order.tableNumber||"—"));toast("Serveuse notifiée");render();return;}

  // SERVEUSE
  if(action==="srv-home"){srvS.tab="tables";srvS.orderStep="table";srvS.orderTable=null;srvS.orderCart={};render();return;}
  if(action==="srv-tab"){srvS.tab=el.dataset.tab;render();return;}
  if(action==="srv-pick-table"){srvS.orderTable=id;srvS.orderStep="menu";render();return;}
  if(action==="srv-back-table"){srvS.orderStep="table";srvS.orderTable=null;srvS.orderCart={};render();return;}
  if(action==="srv-cat"){srvS.orderCat=el.dataset.cat;render();return;}
  if(action==="srv-add"){srvS.orderCart[id]=(srvS.orderCart[id]||0)+1;render();return;}
  if(action==="srv-remove"){if(srvS.orderCart[id]>1)srvS.orderCart[id]--;else delete srvS.orderCart[id];render();return;}
  if(action==="srv-send"){
    const items=DATA.menu.filter(m=>srvS.orderCart[m._docId]>0).map(d=>({id:d._docId,name:d.name,price:d.price,qty:srvS.orderCart[d._docId],time:d.time}));
    const t=DATA.tables.find(x=>x._docId===srvS.orderTable);
    const me=DATA.staff.find(s=>s.name===SESSION.name&&s.role==="serveuse");
    await A.addOrder({type:"sur_place",tableId:srvS.orderTable,tableNumber:t?t.number:null,serveuseId:me?me._docId:null,serveuseName:SESSION.name,items});
    srvS.orderCart={};srvS.orderTable=null;srvS.orderStep="table";toast("Commande envoyée");render();return;}
  if(action==="srv-confirm-cash"){await A.confirmCash(id,true);toast("Cash confirmé — facture prête");render();return;}
  if(action==="srv-cash-issue"){if(!confirm("Signaler paiement NON reçu ?"))return;await A.confirmCash(id,false);toast("Signalé au gérant + cuisine");render();return;}
  if(action==="srv-served"){await A.markServed(id);toast("Servie !");render();return;}
  if(action==="srv-request-invoice"){await A.requestInvoice(id, SESSION.name);toast("Demande envoyée au gérant");render();return;}

  // GÉRANT
  if(action==="ger-home"){gerS.tab="validation";render();return;}
  if(action==="ger-tab"){gerS.tab=el.dataset.tab;render();return;}
  if(action==="ger-item-valid"){await A.setItemStatut(id,idx,"Validé");return;}
  if(action==="ger-item-refuse"){await A.setItemStatut(id,idx,"Refusé");return;}
  if(action==="ger-motif"){await A.setItemMotif(id,idx,el.dataset.motif);return;}
  if(action==="ger-validate"){await A.validateOrder(id);toast("Validée");return;}
  if(action==="ger-delete"){
    if(!confirm("⚠️ SUPPRIMER définitivement cette commande ?\n\nCette action est irréversible."))return;
    await A.deleteOrder(id);toast("Commande supprimée");return;}
  if(action==="ger-resolve-cash"){await A.resolveCashIssue(id);toast("Signal résolu");return;}
  if(action==="ger-affect"){const today=nowDate();const day=DATA.affectation[today]||{};
    const cur=day[el.dataset.table]===el.dataset.serveuse;
    await A.setAffectation(today,el.dataset.table,cur?null:el.dataset.serveuse);return;}
  if(action==="ger-print-invoice"){printReceipt(id);toast("Impression lancée — facture 80mm");return;}

  // CUISINE
  if(action==="cui-home"){render();return;}
  if(action==="cui-ready"){await A.markReady(id);toast("Prêt !");render();return;}

  // LIVREUR
  if(action==="liv-home"){livS.tab="available";render();return;}
  if(action==="liv-tab"){livS.tab=el.dataset.tab;render();return;}
  if(action==="liv-take"){
    const me=DATA.staff.find(s=>s.name===SESSION.name&&s.role==="livreur");
    if(me)await A.takeDelivery(id,me._docId,me.name);
    livS.tab="current";render();return;}
  if(action==="liv-enroute"){await A.setDeliveryStatus(id,"en_route");return;}
  if(action==="liv-done"){await A.markDelivered(id);render();return;}

  // ADMIN
  if(action==="admin-home"){admS.section="menu";admS.editingDish=null;render();return;}
  if(action==="admin-section"){admS.section=el.dataset.section;admS.editingDish=null;admS.showNewStock=false;render();return;}
  if(action==="admin-add-dish"){await A.addDish({name:"Nouveau plat",cat:"Plats",price:0,time:10,available:true,desc:""});return;}
  if(action==="admin-edit-dish"){admS.editingDish=id;render();return;}
  if(action==="admin-save-dish"){
    const row=el.closest("tr");
    const name=row.querySelector('[data-input="dish-name"]').value;
    const desc=row.querySelector('[data-input="dish-desc"]').value;
    const cat=row.querySelector('[data-input="dish-cat"]').value;
    const price=parseInt(row.querySelector('[data-input="dish-price"]').value)||0;
    const time=parseInt(row.querySelector('[data-input="dish-time"]').value)||0;
    const avail=row.querySelector('[data-input="dish-avail"]').checked;
    await A.updateDish(id,{name,desc,cat,price,time,available:avail});
    admS.editingDish=null;return;}
  if(action==="admin-del-dish"){if(confirm("Supprimer ?"))await A.removeDish(id);return;}
  if(action==="admin-add-staff"){await A.addStaff({...admS.newStaff});admS.newStaff={name:"",role:"serveuse",pin:""};render();return;}
  if(action==="admin-reset-pin"){const pin=await A.resetPin(id);toast("Nouveau PIN : "+pin);return;}
  if(action==="admin-del-staff"){if(confirm("Supprimer ?"))await A.removeStaff(id);return;}
  if(action==="admin-add-table"){await A.addTable();return;}
  if(action==="admin-del-table"){if(confirm("Supprimer cette table ?"))await A.removeTable(id);return;}
  if(action==="admin-print-all-qr"){printQrCodes("all");return;}
  if(action==="admin-print-unique-qr"){printQrCodes("unique");return;}
  if(action==="admin-toggle-new-stock"){admS.showNewStock=!admS.showNewStock;render();return;}
  if(action==="admin-create-stock"){
    const ns=admS.newStockItem;
    if(!ns.name||!ns.unit){toast("Nom et unité requis");return;}
    await A.addStockItem({name:ns.name,unit:ns.unit,initial:ns.initial||0,threshold:ns.threshold||0});
    admS.newStockItem={name:"",unit:"kg",initial:0,threshold:0};admS.showNewStock=false;
    toast("Créé ✓");return;}
  if(action==="admin-del-stock"){if(confirm("Supprimer cet ingrédient ?"))await A.removeStockItem(id);return;}
  if(action==="admin-add-move"){
    if(!admS.stockForm.stockId||!admS.stockForm.qty)return;
    await A.addStockMove({...admS.stockForm});
    admS.stockForm={stockId:admS.stockForm.stockId,type:"Entrée",qty:0,motif:""};
    toast("Enregistré");return;}
  if(action==="admin-save-settings"){await A.updateSettings(admS.settingsForm);admS.settingsForm=null;toast("Enregistré");return;}
  if(action==="admin-export-csv"){
    const paid=DATA.orders.filter(o=>["payee","servie","livree"].includes(o.status));
    const csv=["Date,Facture,Type,Adresse,Serveuse/Livreur,Client,Plats,Sous-total,Frais livr.,Total,Paiement"].concat(paid.map(o=>{
      const d=new Date(o.createdAt);
      const items=o.items.filter(i=>i.statut!=="Refusé").map(i=>i.qty+"x "+i.name).join("; ");
      const staff=o.type==="livraison"?(o.livreurName||""):(o.serveuseName||"");
      return [o.date,d.toLocaleTimeString("fr-FR"),o.invoiceNumber||"",o.type,o.clientInfo?.address||"",staff,o.clientInfo?.name||"",'"'+items+'"',orderTotal(o),getDeliveryFee(o),orderGrandTotal(o),o.paymentMethod||""].join(",");
    })).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="historique_ventes.csv";a.click();URL.revokeObjectURL(url);return;}
});

document.addEventListener("change",async function(e){
  const el=e.target;const key=el.dataset.input;const action=el.dataset.action;
  if(action==="ger-assign-livreur"){await A.assignLivreur(el.dataset.id,el.value||null);toast(el.value?"Assigné":"Retiré");return;}
  if(!key)return;
  if(key==="new-staff-role")admS.newStaff.role=el.value;
  if(key==="stock-type")admS.stockForm.type=el.value;
  if(key==="hist-type"){admS.histFilter.type=el.value;render();}
  if(key==="hist-payment"){admS.histFilter.payment=el.value;render();}
  if(key==="set-wait"&&admS.settingsForm)admS.settingsForm.waitMode=el.value;
});

document.addEventListener("input",function(e){
  const el=e.target;const key=el.dataset.input;if(!key)return;
  const v=clientS;
  if(key==="info-name")v.info.name=el.value;
  if(key==="info-phone")v.info.phone=el.value.replace(/[^\d]/g,"").slice(0,10);
  if(key==="info-address"){v.info.address=el.value;v.deliveryDistanceKm=null;v.deliveryFee=0;}
  if(key==="new-staff-name")admS.newStaff.name=el.value;
  if(key==="new-staff-pin"){admS.newStaff.pin=el.value.replace(/\D/g,"").slice(0,4);render();}
  if(key==="new-stock-name")admS.newStockItem.name=el.value;
  if(key==="new-stock-unit")admS.newStockItem.unit=el.value;
  if(key==="new-stock-initial")admS.newStockItem.initial=parseFloat(el.value)||0;
  if(key==="new-stock-threshold")admS.newStockItem.threshold=parseFloat(el.value)||0;
  if(key==="stock-id")admS.stockForm.stockId=el.value;
  if(key==="stock-qty")admS.stockForm.qty=parseFloat(el.value)||0;
  if(key==="stock-motif")admS.stockForm.motif=el.value;
  if(key==="hist-query"){admS.histFilter.query=el.value;render();}
  if(key==="set-name"&&admS.settingsForm)admS.settingsForm.restaurantName=el.value;
  if(key==="set-phone"&&admS.settingsForm)admS.settingsForm.phone=el.value;
  if(key==="set-prix-km"&&admS.settingsForm)admS.settingsForm.prixParKm=parseInt(el.value)||110;
});

document.addEventListener("keydown",function(e){
  if(SESSION)return;
  if(!loginRole)return;
  if(/^\d$/.test(e.key)){pinAdd(e.key);e.preventDefault();return;}
  if(e.key==="Backspace"){pinDel();e.preventDefault();return;}
});

setInterval(function(){
  if(!SESSION)return;
  if(SESSION.role==="cuisine"||SESSION.role==="serveuse"||SESSION.role==="gerant"){render();}
  if(SESSION.role==="client"&&clientS.screen==="tracking"&&clientS.timerRemaining>0){clientS.timerRemaining--;render();}
},1000);

if("Notification" in window && Notification.permission==="default"){setTimeout(()=>Notification.requestPermission(),3000);}

// Restauration côté client
(function restoreClientOrder(){
  const savedOrderId=localStorage.getItem("ds_client_order");
  if(!savedOrderId) return;
  const checkInterval=setInterval(()=>{
    if(!DATA.orders.length && !DATA.menu.length) return;
    const order=DATA.orders.find(o=>o._docId===savedOrderId);
    if(order && order.status!=="servie" && order.status!=="livree" && order.status!=="annulee"){
      clientS.orderId=savedOrderId;
      if(order.status==="att_validation") clientS.screen="waiting";
      else if(order.status==="att_paiement") clientS.screen="payment";
      else if(order.status==="payee") clientS.screen="tracking";
      clearInterval(checkInterval);
      if(SESSION && SESSION.role==="client") render();
    } else {
      localStorage.removeItem("ds_client_order");
      clearInterval(checkInterval);
    }
  }, 500);
  setTimeout(()=>clearInterval(checkInterval), 15000);
})();

// Lire ?table=N
(function checkUrlTable(){
  const params=new URLSearchParams(window.location.search);
  const t=params.get("table");
  if(t){
    clientS.urlTable=parseInt(t);
    clientS.mode="sur_place";
    const found=DATA.tables.find(x=>x.number===parseInt(t));
    if(found){clientS.tableId=found._docId;clientS.screen="menu";}
    else{clientS.screen="menu";}
  }
})();

(async function boot(){
  try{await seedIfEmpty();subscribeAll(render);render();}
  catch(e){console.error(e);
    document.getElementById("root").innerHTML='<div class="loader"><div class="loader-logo">⚠️</div>'+
      '<p class="loader-text" style="color:#ff7066;max-width:300px;text-align:center">Erreur : '+esc(e.message||e)+'</p>'+
      '<button onclick="location.reload()" style="margin-top:20px;padding:12px 24px;background:#ffc107;color:#0a0a0a;border:none;border-radius:8px;font-weight:bold;cursor:pointer">Réessayer</button></div>';}
})();
</script>
