<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Firebase D&S</title>
<style>
body{font-family:monospace;padding:16px;background:#f0f0f0;font-size:14px;line-height:1.8}
#log div{padding:4px 8px;margin:4px 0;border-radius:4px;background:white}
.ok{color:#1a7f37;border-left:4px solid #1a7f37}
.err{color:#c0392b;border-left:4px solid #c0392b}
.wait{color:#b8860b;border-left:4px solid #b8860b}
.info{color:#333;border-left:4px solid #666}
h1{font-size:16px;margin-top:0}
</style>
</head>
<body>
<h1>🔍 Diagnostic Firebase</h1>
<div id="log"></div>

<!-- Firebase COMPAT (pas de modules ES6, fonctionne partout) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
var log = function(msg, cls) {
  var el = document.getElementById('log');
  var div = document.createElement('div');
  div.className = cls || 'info';
  div.textContent = msg;
  el.appendChild(div);
};

log('1️⃣ Test de démarrage…', 'info');

// Vérifier que Firebase est chargé
setTimeout(function() {
  if (typeof firebase === 'undefined') {
    log('❌ Firebase non chargé — le CDN est bloqué', 'err');
    log('Solution : changez de réseau (WiFi/4G) ou réessayez plus tard', 'err');
    return;
  }
  
  log('✅ Firebase JS chargé (version ' + firebase.SDK_VERSION + ')', 'ok');
  
  // Étape 2 : Initialiser
  try {
    var app = firebase.initializeApp({
      apiKey: "AIzaSyBeTQ0zrxdusKXdaoCMiI0zfxRqCZp7nN0",
      authDomain: "restaurant-ds-494a6.firebaseapp.com",
      projectId: "restaurant-ds-494a6",
      storageBucket: "restaurant-ds-494a6.firebasestorage.app",
      messagingSenderId: "1026668587499",
      appId: "1:1026668587499:web:7ed7b77fd623070007d1ae"
    });
    log('✅ Firebase initialisé (projet: restaurant-ds-494a6)', 'ok');
  } catch(e) {
    log('❌ Erreur init : ' + e.message, 'err');
    return;
  }
  
  // Étape 3 : Authentification
  var auth = firebase.auth();
  log('⏳ Connexion anonyme…', 'wait');
  
  auth.signInAnonymously()
    .then(function(userCred) {
      log('✅ Connecté anonymement (UID: ' + userCred.user.uid.substring(0, 8) + '…)', 'ok');
      
      // Étape 4 : Firestore
      log('⏳ Test Firestore…', 'wait');
      var db = firebase.firestore();
      
      return db.collection('menu').limit(1).get();
    })
    .then(function(snap) {
      log('✅ Firestore répond (' + snap.size + ' doc trouvé)', 'ok');
      
      // Étape 5 : Écriture test
      log('⏳ Test écriture…', 'wait');
      var db = firebase.firestore();
      return db.collection('_test').doc('test_' + Date.now()).set({
        test: true,
        date: new Date().toISOString()
      });
    })
    .then(function() {
      log('✅ Écriture OK', 'ok');
      log('🎉 TOUT FONCTIONNE ! Le problème est ailleurs.', 'ok');
      log('👉 Envoyez-moi cette capture d\'écran.', 'info');
    })
    .catch(function(e) {
      log('❌ Erreur : ' + e.message, 'err');
      log('Code : ' + (e.code || 'inconnu'), 'err');
      log('👉 Envoyez-moi cette capture d\'écran.', 'info');
    });
}, 2000);

// Capturer toutes les erreurs
window.addEventListener('error', function(e) {
  log('❌ Erreur globale : ' + e.message, 'err');
});
window.addEventListener('unhandledrejection', function(e) {
  log('❌ Promesse rejetée : ' + (e.reason ? e.reason.message || e.reason : '?'), 'err');
});
</script>
</body>
</html>
