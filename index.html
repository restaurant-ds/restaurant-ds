<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant D&S</title>
<style>
:root{--noir:#0a0a0a;--jaune:#ffc107;--jaune-fonce:#e0a800;--creme:#f7f5ef;--sable:#e8e2d0;--vert:#2d7a3e;--rouge:#c0392b;--gris:#6b6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--creme);color:#1a1a1a}
.serif{font-family:Georgia,'Times New Roman',serif}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px}
.app{min-height:100vh;display:flex;flex-direction:column}
.loader{position:fixed;inset:0;background:var(--noir);color:var(--jaune);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:Georgia,serif}
.loader-logo{width:80px;height:80px;border-radius:50%;background:var(--jaune);color:var(--noir);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;margin-bottom:16px}
.loader-text{margin-top:20px;font-size:14px;color:#888;text-align:center;padding:0 20px}
.spin{width:40px;height:40px;border:4px solid #222;border-top-color:var(--jaune);border-radius:50%;animation:spin 1s linear infinite;margin-top:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.login{min-height:100vh;background:var(--noir);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.login-logo{width:80px;height:80px;border-radius:50%;background:var(--jaune);color:var(--noir);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;margin-bottom:16px;font-family:Georgia,serif}
.login h1{font-size:26px;margin:0 0 20px;text-align:center;font-family:Georgia,serif}
.login h1 span{color:var(--jaune)}
.login-sub{font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:var(--jaune);margin-bottom:6px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px}
.role-btn{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:14px;text-align:left;color:white}
.role-btn:active{background:#252525}
.role-btn .em{font-size:22px;margin-bottom:6px}
.role-btn .lab{font-weight:600;margin:0;font-size:14px}
.role-btn .desc{font-size:11px;color:#888;margin:2px 0 0}
.pin-wrap{width:100%;max-width:300px}
.pin-display{display:flex;justify-content:center;gap:12px;margin:20px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #444}
.pin-dot.filled{background:var(--jaune);border-color:var(--jaune)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-key{aspect-ratio:1.6;background:#1a1a1a;border:1px solid #333;border-radius:12px;color:white;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center}
.pin-key:active{background:var(--jaune);color:var(--noir)}
.pin-key.blank{background:transparent;border:none}
.pin-key.del{background:#333;font-size:20px}
.pin-error{color:#ff7066;font-size:13px;text-align:center;margin-top:12px}
.pin-back{display:block;margin:16px auto 0;color:#888;background:transparent;font-size:13px;text-decoration:underline;padding:8px}
.pin-hint{font-size:11px;color:#666;margin-top:14px;text-align:center;line-height:1.7}
.topbar{background:var(--noir);color:white;padding:8px 10px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--jaune)}
.topbar-btn{background:transparent;color:white;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;min-height:40px}
.topbar-btn:active{background:#252525}
.topbar-title{flex:1;font-family:Georgia,serif;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.topbar-sub{font-size:10px;color:#aaa;margin:0;text-align:center}
.topbar-logout{background:transparent;color:#ff7066;font-size:12px;padding:8px;font-weight:600}
.tabs-scroll{background:var(--noir);border-top:1px solid #333;padding:0 6px 8px;overflow-x:auto;display:flex;gap:4px;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs-scroll .tab{background:transparent;color:#aaa;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}
.tabs-scroll .tab.active{background:var(--jaune);color:var(--noir)}
.bottom-nav{display:grid;background:white;border-top:2px solid var(--jaune);position:sticky;bottom:0;z-index:20}
.bottom-nav.cols-4{grid-template-columns:repeat(4,1fr)}
.bottom-nav.cols-3{grid-template-columns:repeat(3,1fr)}
.bn-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 12px;font-size:11px;font-weight:500;background:transparent;color:var(--gris);position:relative;min-height:56px}
.bn-btn.active{color:var(--jaune-fonce)}
.bn-btn .em{font-size:22px;line-height:1}
.bn-badge{position:absolute;top:6px;right:calc(50% - 24px);background:var(--rouge);color:white;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:bold}
.content{flex:1;padding:16px;width:100%}
.content-narrow{max-width:520px;margin:0 auto}
.section-title{font-family:Georgia,serif;font-size:22px;margin:0 0 4px}
.section-sub{font-size:13px;color:var(--gris);margin:0 0 16px}
.card{background:white;border:1px solid var(--sable);border-radius:12px;padding:14px}
.card+.card{margin-top:10px}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title{font-weight:600;margin:0;font-size:15px}
.card-sub{font-size:12px;color:var(--gris);margin:2px 0 0}
.btn{padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--noir);color:white}
.btn-accent{background:var(--jaune);color:var(--noir);font-weight:700}
.btn-success{background:var(--vert);color:white}
.btn-danger{background:var(--rouge);color:white}
.btn-outline{background:transparent;border:2px solid var(--noir);color:var(--noir)}
.btn-ghost{background:transparent;border:1px solid var(--sable);color:var(--gris)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-block{display:flex;width:100%}
.btn-sm{padding:6px 12px;font-size:12px;min-height:36px}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;display:inline-block}
.badge-neutre{background:rgba(107,107,107,0.12);color:var(--gris)}
.badge-vert{background:rgba(45,122,62,0.12);color:var(--vert)}
.badge-orange{background:rgba(224,168,0,0.18);color:var(--jaune-fonce)}
.badge-rouge{background:rgba(192,57,43,0.12);color:var(--rouge)}
.input{width:100%;padding:12px;border:1px solid var(--sable);border-radius:8px;font-size:16px;background:white}
.input:focus{outline:none;border-color:var(--jaune);box-shadow:0 0 0 2px rgba(255,193,7,0.2)}
.cart-fab{position:fixed;bottom:16px;left:16px;right:16px;padding:16px;background:var(--noir);color:white;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 32px rgba(0,0,0,0.3);z-index:50;max-width:480px;margin:0 auto;border:2px solid var(--jaune)}
.cart-fab .total{color:var(--jaune);font-family:monospace;font-weight:bold}
.dish-row{background:white;border:1px solid var(--sable);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.dish-info{flex:1;min-width:0}
.dish-name{font-weight:600;font-size:15px;margin:0}
.dish-desc{font-size:12px;color:var(--gris);margin:2px 0 0}
.dish-meta{display:flex;align-items:center;gap:10px;margin-top:6px}
.dish-price{font-family:monospace;font-weight:bold}
.dish-time{font-size:12px;color:var(--rouge);font-weight:500}
.qty-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--noir);background:white;font-size:18px;display:flex;align-items:center;justify-content:center}
.qty-btn.add{background:var(--noir);color:white;border-color:var(--noir)}
.qty-val{font-family:monospace;font-weight:bold;min-width:22px;text-align:center;font-size:15px}
.menu-header{background:var(--noir);color:white;padding:16px;position:sticky;top:0;z-index:10;border-bottom:2px solid var(--jaune)}
.cat-tabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-btn{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid var(--sable);background:white;color:var(--gris)}
.cat-btn.active{background:var(--jaune);color:var(--noir);border-color:var(--jaune);font-weight:700}
.cat-btn.on-dark{background:transparent;border-color:#444;color:#aaa}
.cat-btn.on-dark.active{background:var(--jaune);color:var(--noir);border-color:var(--jaune)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-card{background:white;border:1px solid var(--sable);border-radius:12px;padding:14px;border-left:4px solid var(--jaune)}
.stat-label{font-size:12px;color:var(--gris);margin:0 0 4px}
.stat-value{font-family:Georgia,serif;font-size:22px;font-weight:bold;margin:0}
.table-wrap{background:white;border:1px solid var(--sable);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:#faf8f2;color:var(--gris)}
th{text-align:left;padding:10px 12px;font-weight:500;font-size:12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid #f0ede4;vertical-align:middle}
.progress-circle{position:relative;width:180px;height:180px;margin:0 auto 20px}
.progress-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.progress-circle .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.table-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.table-cell{aspect-ratio:1;background:white;border:1px solid var(--sable);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;min-height:56px}
.table-cell.active{background:var(--jaune);border-color:var(--jaune);color:var(--noir)}
.timer{font-family:monospace;font-size:20px;font-weight:bold}
.timer.urgent{color:var(--rouge)}
.timer.ok{color:var(--vert)}
.ticket{background:white;border:2px solid var(--sable);border-radius:16px;padding:14px}
.ticket.urgent{border-color:var(--rouge)}
.empty{text-align:center;color:var(--gris);padding:24px 12px;font-size:14px}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}
.gap-2{gap:8px}.gap-3{gap:12px}
.text-sm{font-size:13px}.text-xs{font-size:11px}
.muted{color:var(--gris)}.mono{font-family:monospace}.bold{font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--noir);color:white;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;border:2px solid var(--jaune);box-shadow:0 8px 24px rgba(0,0,0,0.3);max-width:90%;text-align:center}
.qr-card{background:white;border:2px solid var(--noir);border-radius:12px;padding:16px;text-align:center;page-break-inside:avoid}
.qr-card img{width:180px;height:180px;display:block;margin:0 auto 10px}
.qr-card .qr-table-num{font-family:Georgia,serif;font-size:32px;font-weight:bold;color:var(--noir)}
.qr-card .qr-resto{font-family:Georgia,serif;font-size:16px;color:var(--jaune-fonce);font-weight:bold;margin-bottom:4px}
.qr-card .qr-hint{font-size:11px;color:var(--gris);margin-top:6px}
.cat-group{margin-bottom:24px}
.cat-group-title{font-family:Georgia,serif;font-size:18px;color:var(--noir);padding:8px 12px;background:var(--jaune);border-radius:8px;margin-bottom:8px;display:inline-block}
.alert-banner{background:rgba(192,57,43,0.1);border:2px solid var(--rouge);border-radius:12px;padding:14px;margin-bottom:16px}
.alert-banner strong{color:var(--rouge)}
.zone-item{display:flex;align-items:center;gap:10px;padding:10px;background:white;border:1px solid var(--sable);border-radius:8px;margin-bottom:8px}
.zone-item input{padding:6px;border:1px solid var(--sable);border-radius:6px}
.distance-info{background:rgba(45,122,62,0.08);border:2px solid var(--vert);border-radius:12px;padding:12px;margin-top:8px}
.distance-info .val{font-family:monospace;font-weight:bold;color:var(--vert);font-size:16px}
/* FACTURE 80mm */
#receipt-print-area{display:none}
@media print{
  body *{visibility:hidden}
  #receipt-print-area,#receipt-print-area *{visibility:visible}
  #receipt-print-area{display:block!important;position:absolute;left:0;top:0;width:80mm;font-family:'Courier New',Courier,monospace;font-size:12px;line-height:1.4;color:#000;background:white;padding:2mm}
  #qr-print-area,#qr-print-area *{visibility:visible}
  #qr-print-area{position:absolute;left:0;top:0;width:100%;padding:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  .no-print{display:none!important}
}
.receipt-paper{width:80mm;font-family:'Courier New',Courier,monospace;font-size:12px;line-height:1.4;color:#000;background:white;padding:4mm;border:1px dashed #999;margin:0 auto}
.receipt-paper h2{font-size:15px;text-align:center;margin:0 0 2px}
.receipt-paper .r-sub{text-align:center;font-size:10px;margin:0 0 8px}
.receipt-paper .r-line{border-top:1px dashed #000;margin:6px 0}
.receipt-paper .r-row{display:flex;justify-content:space-between;font-size:12px}
.receipt-paper .r-total{display:flex;justify-content:space-between;font-weight:bold;font-size:14px;margin-top:4px}
.receipt-paper .r-center{text-align:center;font-size:11px;margin:4px 0}
</style>

<body>
<div id="root"><div class="loader"><div class="loader-logo">D&S</div><h1 style="font-family:Georgia,serif;margin:0 0 20px;color:var(--jaune)">Restaurant D&S</h1><div class="spin"></div><p class="loader-text">Connexion…</p></div></div>
<div id="receipt-print-area"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, limit, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyBeTQ0zrxdusKXdaoCMiI0zfxRqCZp7nN0", authDomain: "restaurant-ds-494a6.firebaseapp.com", projectId: "restaurant-ds-494a6", storageBucket: "restaurant-ds-494a6.firebasestorage.app", messagingSenderId: "1026668587499", appId: "1:1026668587499:web:7ed7b77fd623070007d1ae" };
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

// Coordonnées GPS du restaurant D&S
const RESTO_LAT = 6.43737;
const RESTO_LON = 2.34484;
const PRIX_PAR_KM = 110; // F CFA par kilomètre

let DEVICE_ID = localStorage.getItem("ds_device_id");
if (!DEVICE_ID) { DEVICE_ID = "dev_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); localStorage.setItem("ds_device_id", DEVICE_ID); }

let SESSION = null;
let DATA = { menu:[], staff:[], tables:[], affectation:{}, orders:[], stock:[], stockMoves:[], settings:{}, zones:[] };
const SITE_URL = "https://restaurant-ds.github.io/restaurant-ds/";

const SEED = {
  menu: [
    { id:"m1", name:"Salade César", cat:"Entrées", price:2500, time:5, available:true, desc:"Romaine, parmesan, croûtons" },
    { id:"m2", name:"Beignets de crevettes", cat:"Entrées", price:3000, time:10, available:true, desc:"Pâte croustillante, sauce pimentée" },
    { id:"m3", name:"Poulet DG", cat:"Plats", price:5000, time:18, available:true, desc:"Poulet mijoté, plantain, légumes" },
    { id:"m4", name:"Poisson braisé", cat:"Plats", price:5500, time:20, available:true, desc:"Grillé au feu de bois, attiéké" },
    { id:"m5", name:"Riz sauté aux légumes", cat:"Plats", price:3500, time:12, available:true, desc:"Riz wok, légumes de saison" },
    { id:"m6", name:"Attiéké poisson", cat:"Plats", price:4000, time:15, available:true, desc:"Semoule de manioc, poisson frit" },
    { id:"m7", name:"Salade de fruits", cat:"Desserts", price:1500, time:4, available:true, desc:"Fruits frais" },
    { id:"m8", name:"Tarte au citron", cat:"Desserts", price:2000, time:3, available:true, desc:"Pâte sablée, crème citron" },
    { id:"m9", name:"Jus de bissap", cat:"Boissons", price:1000, time:2, available:true, desc:"Hibiscus glacé" },
    { id:"m10", name:"Eau minérale", cat:"Boissons", price:500, time:1, available:true, desc:"" }
  ],
  staff: [
    { id:"s1", name:"Aïcha", role:"serveuse", pin:"4821" },
    { id:"s2", name:"Fatou", role:"serveuse", pin:"3390" },
    { id:"s3", name:"Moussa", role:"cuisine", pin:"1234" },
    { id:"s4", name:"Ibrahim", role:"gerant", pin:"0000" },
    { id:"s5", name:"Salif", role:"livreur", pin:"5678" },
    { id:"s6", name:"Admin D&S", role:"admin", pin:"9999" }
  ],
  tables: Array.from({length:25},(_,i)=>({ id:"t"+(i+1), number:i+1, token:Math.random().toString(36).slice(2,8) })),
  stock: [
    { id:"st1", name:"Poulet", unit:"kg", initial:30, threshold:5 },
    { id:"st2", name:"Poisson", unit:"kg", initial:25, threshold:5 },
    { id:"st3", name:"Riz", unit:"kg", initial:80, threshold:15 },
    { id:"st4", name:"Huile", unit:"L", initial:40, threshold:8 },
    { id:"st5", name:"Légumes", unit:"kg", initial:20, threshold:5 }
  ],
  zones: [],
  settings: { restaurantName:"Restaurant D&S", phone:"27 20 00 00 00", fraisLivraison:1000, prixParKm:110, timerMode:"auto", waitMode:"max" }
};

async function seedIfEmpty() {
  const check = await getDocs(query(collection(db, "menu"), limit(1)));
  if (!check.empty) return;
  const batch = writeBatch(db);
  SEED.menu.forEach(m => batch.set(doc(db, "menu", m.id), m));
  SEED.staff.forEach(s => batch.set(doc(db, "staff", s.id), s));
  SEED.tables.forEach(t => batch.set(doc(db, "tables", t.id), t));
  SEED.stock.forEach(s => batch.set(doc(db, "stock", s.id), s));
  batch.set(doc(db, "settings", "main"), SEED.settings);
  await batch.commit();
}

function money(n){return (n||0).toLocaleString("fr-FR")+" F";}
function nowDate(){return new Date().toISOString().slice(0,10);}
function fmtDate(iso){return new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"short"});}
function timeAgo(ts){if(!ts)return "à l'instant";const m=Math.floor((Date.now()-ts)/60000);if(m<=0)return "à l'instant";if(m<60)return "il y a "+m+" min";return "il y a "+Math.floor(m/60)+"h";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function validPhoneBJ(p){return /^01\d{8}$/.test(String(p||"").replace(/\s/g,""));}
function orderTimerInfo(o){
  const items=o.items.filter(i=>i.statut!=="Refusé");
  const maxTime=Math.max(...items.map(i=>i.time),0);
  const start=o.paidAt||o.createdAt;
  const deadline=start+maxTime*60*1000;
  const remainingMs=deadline-Date.now();
  const remainingSec=Math.floor(remainingMs/1000);
  const abs=Math.abs(remainingSec);
  const mm=String(Math.floor(abs/60)).padStart(2,"0");
  const ss=String(abs%60).padStart(2,"0");
  return { remainingMs, overdue: remainingMs<=0, text: (remainingMs<=0?"+":"")+mm+":"+ss, maxTime, urgent: remainingMs>0 && remainingMs < maxTime*60*1000*0.25 };
}
function qrUrl(text, size){ size=size||400; return "https://api.qrserver.com/v1/create-qr-code/?size="+size+"x"+size+"&data="+encodeURIComponent(text); }

function preserveInput(){
  const active=document.activeElement;
  if(!active||!active.dataset||!active.dataset.input) return null;
  return { key:active.dataset.input, start:active.selectionStart, end:active.selectionEnd, value:active.value };
}
function restoreInput(saved){
  if(!saved) return;
  const el=document.querySelector('[data-input="'+saved.key+'"]');
  if(el){ el.focus(); try{ el.setSelectionRange(saved.start, saved.end); }catch(e){} }
}

function subscribeAll(onUpdate) {
  const sub = (col, key, tr) => onSnapshot(collection(db, col), snap => {
    const arr = []; snap.forEach(d => arr.push({ ...d.data(), _docId: d.id }));
    DATA[key] = tr ? tr(arr) : arr; onUpdate();
  });
  sub("menu", "menu");
  sub("staff", "staff");
  sub("tables", "tables", arr => arr.sort((a,b)=>a.number-b.number));
  sub("stock", "stock");

  onSnapshot(collection(db, "affectation"), snap => { const obj={}; snap.forEach(d => obj[d.id]=d.data()); DATA.affectation=obj; onUpdate(); });
  onSnapshot(doc(db, "settings", "main"), snap => { if (snap.exists()) DATA.settings=snap.data(); onUpdate(); });

// ============ CALCUL DISTANCE OSRM ============
async function geocodeAddress(address){
  try{
    const url="https://nominatim.openstreetmap.org/search?format=json&q="+encodeURIComponent(address+" Bénin")+"&limit=1";
    const res=await fetch(url,{headers:{"Accept":"application/json"}});
    const data=await res.json();
    if(data&&data.length>0) return {lat:parseFloat(data[0].lat),lon:parseFloat(data[0].lon),display:data[0].display_name};
    return null;
  }catch(e){ console.error("Geocode error:",e); return null; }
}
async function calculateDistanceKm(fromLat,fromLon,toLat,toLon){
  try{
    const url="https://router.project-osrm.org/route/v1/driving/"+fromLon+","+fromLat+";"+toLon+","+toLat+"?overview=false";
    const res=await fetch(url);
    const data=await res.json();
    if(data&&data.routes&&data.routes.length>0){
      const meters=data.routes[0].distance;
      return { km: meters/1000, meters: meters };
    }
    return null;
  }catch(e){ console.error("OSRM error:",e); return null; }
}
async function calculateDeliveryFee(clientLat,clientLon){
  const dist=await calculateDistanceKm(RESTO_LAT,RESTO_LON,clientLat,clientLon);
  if(!dist) return null;
  const km=Math.round(dist.km*10)/10;
  const fee=Math.round(km*PRIX_PAR_KM);
  return { km: km, fee: fee };
}
function getDeliveryFee(o){
  if(!o||o.type!=="livraison") return 0;
  if(o.deliveryFee!=null) return o.deliveryFee;
  return DATA.settings.fraisLivraison||0;
}

  if(o.status==="annulee") return '<span class="badge badge-neutre">Annulée</span>';
  if(o.status==="servie") return '<span class="badge badge-vert">Servie</span>';
  if(o.status==="livree") return '<span class="badge badge-vert">Livrée</span>';

}

        '<button class="btn btn-accent btn-block" style="padding:14px" data-action="client-submit">Envoyer</button>'+
      '</div>':"")+
    '</div>';
  }
  if(v.screen==="waiting"){
    return '<div class="login"><div class="spin" style="border-color:#222;border-top-color:var(--jaune)"></div>'+
      '<p class="login-sub" style="margin-top:20px">Envoyée</p>'+
      '<h1 class="serif" style="text-align:center">En attente validation</h1>'+
      '<p style="color:#aaa;text-align:center;margin:0 0 24px">Le gérant examine…</p>'+
      '<button class="btn btn-ghost btn-block" style="max-width:280px" data-action="client-cancel-wait">Annuler</button></div>';
  }
  if(v.screen==="refused"&&order){
    const it=order.items[v.refusedIdx];
    if(!it){v.screen="payment";return screenClient();}
    return '<div class="app">'+topbar({title:"Plat indisponible",homeAction:"client-home"})+
      '<div class="content content-narrow" style="text-align:center;padding-top:20px">'+
        '<div style="font-size:56px;margin-bottom:16px">❌</div>'+
        '<h2 class="section-title">Plat indisponible</h2>'+
        '<div class="card" style="margin:16px 0;text-align:left"><p class="card-title">'+it.qty+'× '+esc(it.name)+'</p>'+
        '<p style="color:var(--rouge);font-size:13px;margin:6px 0 0">'+esc(it.motif||"Indisponible")+'</p></div>'+
        '<button class="btn btn-accent btn-block" style="padding:14px" data-action="client-remove-refused">Continuer sans ce plat</button></div></div>';
  }
  if(v.screen==="payment"&&order){
    const total=orderGrandTotal(order);
    const frais=getDeliveryFee(order);
    return '<div class="app">'+topbar({title:"Paiement",homeAction:"client-home"})+
      '<div class="content content-narrow"><p class="section-sub">Choisissez votre paiement.</p>'+
        '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">'+
          '<button class="card card-row" data-action="client-pay" data-method="momo" style="text-align:left;cursor:pointer;border:2px solid var(--sable)">'+
            '<div><p class="card-title">📱 Mobile Money</p><p class="card-sub">Orange / MTN</p></div></button>'+
          '<button class="card card-row" data-action="client-pay" data-method="cash" style="text-align:left;cursor:pointer;border:2px solid var(--sable)">'+
            '<div><p class="card-title">💵 Cash</p><p class="card-sub">'+(order.type==="livraison"?"Au livreur":"À la serveuse")+'</p></div></button>'+
        '</div>'+
        (frais>0?'<div class="flex between text-sm muted" style="margin-bottom:6px"><span>Frais livraison ('+order.deliveryDistanceKm+' km)</span><span class="mono">'+money(frais)+'</span></div>':"")+
        '<div class="card" style="display:flex;justify-content:space-between;align-items:center;border-left:4px solid var(--jaune)">'+
          '<span class="bold">Total</span><span class="mono" style="font-size:22px;font-weight:bold">'+money(total)+'</span></div>'+
        '<button class="btn btn-ghost btn-block" style="margin-top:16px" data-action="client-edit-order">✏️ Modifier la commande</button>'+
      '</div></div>';
  }
  if(v.screen==="editOrder"&&order){
    const cats=["Entrées","Plats","Desserts","Boissons"];
    const dishes=menu.filter(d=>d.cat===v.cat&&d.available);
    const items=menu.filter(m=>v.editCart[m._docId]>0);
    const total=items.reduce((sum,d)=>sum+d.price*v.editCart[d._docId],0);
    return '<div class="app" style="padding-bottom:100px">'+
      '<div class="topbar"><button class="topbar-btn" data-action="client-edit-cancel">← Annuler</button>'+
        '<div style="flex:1;min-width:0"><p class="topbar-sub">Modification</p><div class="topbar-title">Ma commande</div></div><span></span></div>'+
      '<div class="menu-header"><div class="cat-tabs" style="margin-top:0">'+cats.map(c=>'<button class="cat-btn on-dark '+(v.cat===c?"active":"")+'" data-action="client-edit-cat" data-cat="'+c+'">'+c+'</button>').join("")+'</div></div>'+
      '<div class="content content-narrow" style="padding-top:12px">'+
        dishes.map(d=>'<div class="dish-row"><div class="dish-info"><p class="dish-name">'+esc(d.name)+'</p>'+(d.desc?'<p class="dish-desc">'+esc(d.desc)+'</p>':"")+'</div>'+
          '<div class="qty-controls">'+(v.editCart[d._docId]>0?'<button class="qty-btn" data-action="client-edit-remove" data-id="'+d._docId+'">−</button><span class="qty-val">'+v.editCart[d._docId]+'</span>':"")+'<button class="qty-btn add" data-action="client-edit-add" data-id="'+d._docId+'">+</button></div></div>').join("")+
      '</div>'+
      (items.length>0?'<div style="position:fixed;bottom:16px;left:16px;right:16px;max-width:480px;margin:0 auto"><button class="btn btn-accent btn-block" style="padding:16px" data-action="client-edit-save">Enregistrer ('+items.reduce((s,d)=>s+v.editCart[d._docId],0)+') — '+money(total)+'</button></div>':"")+
    '</div>';
  }
  if(v.screen==="tracking"&&order){
    const allItems=order.items.filter(i=>i.statut!=="Refusé");
    const waitMin=s.waitMode==="sum"?allItems.reduce((a,i)=>a+i.time,0):Math.max(...allItems.map(i=>i.time),0);
    if(!v.timerTotal){v.timerTotal=Math.max(6,Math.round(waitMin*1.5));v.timerRemaining=v.timerTotal;}
    const ready=order.readyAt, served=order.status==="servie"||order.status==="livree";
    const mm=String(Math.floor(v.timerRemaining/60)).padStart(2,"0");
    const ss=String(v.timerRemaining%60).padStart(2,"0");
    const progress=v.timerTotal?1-v.timerRemaining/v.timerTotal:1;
    const circ=2*Math.PI*86, dash=circ*(1-progress);
    return '<div class="app">'+topbar({title:"Suivi",homeAction:"client-home"})+
      '<div style="background:var(--noir);color:white;flex:1;padding:24px 20px 40px;display:flex;flex-direction:column;align-items:center">'+
        '<p class="login-sub">'+(order.type==="livraison"?"Livraison — "+order.deliveryDistanceKm+" km":"Table "+(order.tableNumber||""))+'</p>'+
        '<h1 class="serif" style="text-align:center;font-size:20px;margin:8px 0 20px;color:white">'+(served?"Terminée":ready?"Prête !":"En cours")+'</h1>'+
        '<div class="progress-circle"><svg><circle cx="90" cy="90" r="86" stroke="#2a2a2a" stroke-width="10" fill="none"/><circle cx="90" cy="90" r="86" stroke="'+(ready?"#2d7a3e":"#ffc107")+'" stroke-width="10" fill="none" stroke-dasharray="'+circ+'" stroke-dashoffset="'+dash+'" stroke-linecap="round"/></svg>'+
          '<div class="center">'+(ready?'<div style="font-size:48px">✅</div>':'<span class="mono" style="font-size:26px;font-weight:bold;color:white">'+mm+':'+ss+'</span>')+'</div></div>'+
        '<div style="width:100%;max-width:280px;margin-bottom:20px">'+
          [{l:"Validée",d:true},{l:"Payée",d:true},{l:"Préparation",d:true},{l:"Prête",d:!!ready},{l:order.type==="livraison"?"Livrée":"Servie",d:served}].map(st=>'<div class="flex center gap-2" style="margin-bottom:6px"><div style="width:10px;height:10px;border-radius:50%;background:'+(st.d?"#2d7a3e":"#444")+'"></div><span style="color:'+(st.d?"white":"#666")+'">'+st.l+'</span></div>').join("")+
        '</div>'+
        (order.callCount?'<p class="text-xs" style="color:'+(order.escalated?"#ff7066":"#aaa")+';margin-bottom:12px">📣 '+(order.escalated?"Gérant notifié":"Serveuse notifiée")+'</p>':"")+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'+
          '<button class="btn btn-accent" data-action="client-call-serveuse">🔔 Appeler serveuse</button>'+
          '<a href="tel:'+(s.phone||"").replace(/\s/g,"")+'" class="btn btn-ghost" style="text-decoration:none;color:var(--jaune);border-color:#444">📞 Restaurant</a></div>'+
      '</div></div>';
  }
  if(v.screen==="cancelled"){
    return '<div class="app">'+topbar({title:"Annulée",homeAction:"client-home"})+
      '<div class="content content-narrow" style="text-align:center;padding-top:60px">'+
        '<div style="font-size:64px;margin-bottom:20px">🚫</div>'+
        '<h2 class="section-title" style="font-size:24px">Commande annulée</h2>'+
        '<p class="muted" style="margin-bottom:24px">Le gérant a annulé votre commande.</p>'+
        '<button class="btn btn-accent" style="padding:14px 32px" data-action="client-home">Retour</button></div></div>';
  }
  if(v.screen==="done"){
    return '<div class="app">'+topbar({title:"Terminé",homeAction:"client-home"})+
      '<div class="content content-narrow" style="text-align:center;padding-top:60px">'+
        '<div style="font-size:64px;margin-bottom:20px">🎉</div>'+
        '<h2 class="section-title" style="font-size:26px">Bon appétit !</h2>'+
        '<button class="btn btn-accent" style="padding:14px 32px;margin-top:20px" data-action="logout">Terminer</button></div></div>';
  }
  return "";
}

// ==================== SERVEUSE ====================
function screenServeuse(){
  const me=DATA.staff.find(s=>s.name===SESSION.name&&s.role==="serveuse");
  const today=nowDate();
  const day=DATA.affectation[today]||{};
  const tableIds=me?Object.entries(day).filter(([tid,sid])=>sid===me._docId).map(([tid])=>tid):[];
  const myTables=DATA.tables.filter(t=>tableIds.includes(t._docId));
  const myActiveOrders=DATA.orders.filter(o=>o.serveuseId===(me&&me._docId)&&o.status==="payee"&&!o.servedAt);
  const cashOrders=DATA.orders.filter(o=>o.serveuseId===(me&&me._docId)&&o.paymentMethod==="cash"&&o.status==="payee"&&!o.servedAt);
  const paidOrders=DATA.orders.filter(o=>(o.type==="sur_place"&&o.serveuseId===(me&&me._docId))||(o.type==="livraison"&&o.livreurId===(me&&me._docId)),).filter(o=>o.paidConfirmedAt && !o.servedAt);
  const v=srvS; let content="";
  if(v.tab==="tables"){
    content='<h2 class="section-title">Mes tables du jour</h2><p class="section-sub">Affectées par le gérant</p>'+
      (myTables.length===0?'<p class="empty">Aucune table affectée.</p>':
        myTables.map(t=>{
          const o=myActiveOrders.find(x=>x.tableId===t._docId);
          const timer=o?orderTimerInfo(o):null;
          return '<div class="card"><div class="card-row">'+
            '<div class="flex center gap-3"><div style="width:44px;height:44px;border-radius:50%;background:var(--noir);color:var(--jaune);display:flex;align-items:center;justify-content:center;font-weight:bold">'+t.number+'</div>'+
            '<div><p class="card-title">Table '+t.number+'</p><p class="card-sub">'+(o?statusBadge(o):"Libre")+'</p></div></div>'+
            (timer?'<div class="mono bold '+(timer.overdue||timer.urgent?"timer urgent":"timer ok")+'">'+timer.text+'</div>':"")+
          '</div></div>';
        }).join(""));
  } else if(v.tab==="order"){
    if(v.orderStep==="table"){
      content='<h2 class="section-title">Nouvelle commande</h2>'+
        (myTables.length===0?'<p class="empty">Aucune table affectée</p>':
          '<div class="table-grid">'+myTables.map(t=>'<button class="table-cell" data-action="srv-pick-table" data-id="'+t._docId+'">'+t.number+'</button>').join("")+'</div>');
    } else {
      const cats=["Entrées","Plats","Desserts","Boissons"];
      const dishes=DATA.menu.filter(d=>d.cat===v.orderCat&&d.available);
      const items=DATA.menu.filter(m=>v.orderCart[m._docId]>0);
      const total=items.reduce((sum,d)=>sum+d.price*v.orderCart[d._docId],0);
      const t=DATA.tables.find(x=>x._docId===v.orderTable);
      content='<div style="padding-bottom:100px">'+
        '<div class="flex between center" style="margin-bottom:12px"><button class="btn btn-ghost btn-sm" data-action="srv-back-table">← Changer</button>'+
        '<h2 class="section-title" style="font-size:18px;margin:0">Table '+(t?t.number:"")+'</h2><span></span></div>'+
        '<div class="cat-tabs" style="margin:12px 0">'+cats.map(c=>'<button class="cat-btn '+(v.orderCat===c?"active":"")+'" data-action="srv-cat" data-cat="'+c+'">'+c+'</button>').join("")+'</div>'+
        dishes.map(d=>'<div class="dish-row"><div class="dish-info"><p class="dish-name">'+esc(d.name)+'</p><p class="dish-desc">'+money(d.price)+' · ~'+d.time+' min</p></div>'+
          '<div class="qty-controls">'+(v.orderCart[d._docId]>0?'<button class="qty-btn" data-action="srv-remove" data-id="'+d._docId+'">−</button><span class="qty-val">'+v.orderCart[d._docId]+'</span>':"")+'<button class="qty-btn add" data-action="srv-add" data-id="'+d._docId+'">+</button></div></div>').join("")+
        (items.length>0?'<div class="cart-fab" data-action="srv-send"><span class="label">Envoyer ('+items.reduce((s,d)=>s+v.orderCart[d._docId],0)+')</span><span class="total">'+money(total)+'</span></div>':"")+
      '</div>';
    }
  } else if(v.tab==="cash"){
    content='<h2 class="section-title">Encaissements</h2><p class="section-sub">Confirmer ou signaler</p>'+
      (cashOrders.length===0?'<p class="empty">Rien à encaisser</p>':
        cashOrders.map(o=>{
          const issue=o.cashIssue==="non_recu";
          return '<div class="card" style="border-left:4px solid '+(issue?"var(--rouge)":"var(--jaune)")+'">'+
            '<div class="card-row" style="margin-bottom:12px"><span class="bold">Table '+(o.tableNumber||"—")+'</span><span class="mono bold">'+money(orderTotal(o))+'</span></div>'+
            (issue?'<p class="text-sm" style="color:var(--rouge);margin-bottom:8px">⚠️ Signalé : paiement non reçu.</p>':"")+
            '<button class="btn btn-success btn-block" style="margin-bottom:8px" data-action="srv-confirm-cash" data-id="'+o._docId+'">💰 Argent reçu — Confirmer</button>'+
            (!issue?'<button class="btn btn-danger btn-block" data-action="srv-cash-issue" data-id="'+o._docId+'">❌ Non reçu — Signaler</button>':"")+
          '</div>';
        }).join(""));
  } else if(v.tab==="suivi"){
    content='<h2 class="section-title">Suivi des commandes</h2><p class="section-sub">'+myActiveOrders.length+' active(s)</p>'+
      (myActiveOrders.length===0?'<p class="empty">Aucune commande active</p>':
        myActiveOrders.map(o=>{
          const ready=!!o.readyAt; const timer=orderTimerInfo(o);
          const border=o.cashIssue?"var(--rouge)":(ready?"var(--vert)":(timer.urgent||timer.overdue?"var(--rouge)":"var(--jaune)"));
          return '<div class="card" style="margin-bottom:10px;border-left:4px solid '+border+'">'+
            '<div class="flex between center" style="margin-bottom:8px"><div><p class="card-title">Table '+(o.tableNumber||"—")+'</p><p class="card-sub">'+money(orderTotal(o))+'</p></div>'+
              '<div style="text-align:right">'+statusBadge(o)+
              '<p class="mono bold '+(timer.urgent||timer.overdue?"timer urgent":"timer ok")+'" style="margin-top:4px;font-size:14px">'+timer.text+'</p></div></div>'+
            '<ul style="margin:0 0 10px 0;padding-left:20px;font-size:13px;color:#555">'+o.items.filter(i=>i.statut!=="Refusé").map(it=>'<li>'+it.qty+'× '+esc(it.name)+'</li>').join("")+'</ul>'+
            (ready&&!o.cashIssue?'<button class="btn btn-success btn-block" data-action="srv-served" data-id="'+o._docId+'">✓ J\'ai servi</button>':'<p class="text-xs muted" style="text-align:center">'+(o.cashIssue?"En attente paiement client":"Attente cuisine…")+'</p>')+
          '</div>';
        }).join(""));
  } else if(v.tab==="factures"){
    // NOUVEAU : factures pour la serveuse
    content='<h2 class="section-title">Factures</h2><p class="section-sub">Commandes payées — demandez l\'impression au gérant</p>'+
      (paidOrders.length===0?'<p class="empty">Aucune facture disponible</p>':
        paidOrders.map(o=>{
          const req=o.invoiceRequested;
          return '<div class="card" style="margin-bottom:10px;border-left:4px solid '+(req?"var(--jaune)":"var(--vert)")+'">'+
            '<div class="flex between center" style="margin-bottom:6px">'+
              '<div><p class="card-title">'+(o.type==="livraison"?"Livraison":"Table "+(o.tableNumber||"—"))+'</p>'+
              '<p class="card-sub">'+(o.invoiceNumber||"Facture en cours")+' · '+money(orderGrandTotal(o))+'</p></div>'+
              (o.invoicePrinted?'<span class="badge badge-vert">Imprimée ✓</span>':
                req?'<span class="badge badge-orange">⏳ Demandée</span>':
                '<span class="badge badge-neutre">Disponible</span>')+
            '</div>'+
            (o.clientInfo?.name?'<p class="text-xs muted">Client : '+esc(o.clientInfo.name)+'</p>':"")+
            (o.type==="livraison"?'<p class="text-xs muted">Frais livr. : '+money(getDeliveryFee(o))+' ('+o.deliveryDistanceKm+' km)</p>':"")+
            (!req?'<button class="btn btn-accent btn-block" style="margin-top:8px" data-action="srv-request-invoice" data-id="'+o._docId+'">🧾 Demander l\'impression au gérant</button>':
              '<p class="text-xs" style="color:var(--jaune-fonce);text-align:center;margin-top:8px">En attente d\'impression par le gérant…</p>')+
          '</div>';
        }).join(""));
  }
  const suiviBadge=myActiveOrders.filter(o=>o.readyAt).length;
  const facturesBadge=paidOrders.filter(o=>!o.invoiceRequested).length;
  return '<div class="app" style="max-width:520px;margin:0 auto">'+
    topbar({role:"Serveuse",title:SESSION.name,homeAction:"srv-home"})+
    '<div class="content">'+content+'</div>'+
    '<div class="bottom-nav" style="grid-template-columns:repeat(5,1fr)">'+
      [{key:"tables",em:"🗂️",label:"Tables"},{key:"order",em:"🛍️",label:"Commander"},{key:"cash",em:"💰",label:"Encaisser",badge:cashOrders.length},{key:"suivi",em:"📋",label:"Suivi",badge:suiviBadge},{key:"factures",em:"🧾",label:"Factures",badge:facturesBadge}].map(t=>'<button class="bn-btn '+(v.tab===t.key?"active":"")+'" data-action="srv-tab" data-tab="'+t.key+'"><span class="em">'+t.em+'</span><span>'+t.label+'</span>'+(t.badge>0?'<span class="bn-badge">'+t.badge+'</span>':"")+'</button>').join("")+
    '</div></div>';
}

// ==================== GÉRANT ====================

  const delivering=DATA.orders.filter(o=>o.type==="livraison"&&o.status==="payee"&&!o.servedAt);
  const livreurs=DATA.staff.filter(s=>s.role==="livreur");

      (pending.length===0?'<p class="empty">Rien en attente</p>':

            '<span class="badge '+(o.type==="livraison"?"badge-orange":"badge-neutre")+'">'+(o.type==="livraison"?"Livraison":"Place")+'</span></div>'+
            o.items.map((it,idx)=>{

              return '<div style="margin-bottom:10px"><div class="flex between center" style="margin-bottom:6px">'+
                '<span style="'+(it.statut==="Refusé"?"text-decoration:line-through;color:var(--rouge)":"")+';font-size:14px">'+it.qty+'× '+esc(it.name)+'</span>'+
                '<div class="flex gap-2">'+
                  '<button class="qty-btn '+(it.statut==="Validé"?"add":"")+'" style="'+(it.statut==="Validé"?"background:var(--vert);border-color:var(--vert)":"")+'" data-action="ger-item-valid" data-id="'+o._docId+'" data-idx="'+idx+'">✓</button>'+

                '</div></div>'+

              '<button class="btn btn-danger btn-sm" data-action="ger-delete" data-id="'+o._docId+'">🗑️</button>'+
            '</div></div>';

      '</div>'+
      '<div><h2 class="section-title" style="font-size:17px">⏳ En attente paiement ('+awaitingPay.length+')</h2>'+
      '<p class="text-xs muted" style="margin-bottom:10px">Si le client ne paye pas, supprimez la commande.</p>'+
      (awaitingPay.length===0?'<p class="empty">Aucune</p>':
        awaitingPay.map(o=>'<div class="card" style="margin-bottom:10px">'+
          '<p class="card-title">'+(o.type==="livraison"?"Livr. — "+(o.clientInfo?.name||""):"Table "+(o.tableNumber||"—"))+'</p>'+
          '<p class="card-sub">'+money(orderGrandTotal(o))+(o.deliveryDistanceKm?' · '+o.deliveryDistanceKm+' km':"")+' · '+timeAgo(o.createdAt)+'</p>'+
          '<div class="flex gap-2" style="margin-top:8px">'+
            '<button class="btn btn-danger btn-sm" style="flex:1" data-action="ger-delete" data-id="'+o._docId+'">🗑️ Supprimer cette commande</button>'+
          '</div>'+
        '</div>').join(""))+
      '</div></div>';
  } else if(v.tab==="salle"){
    content='<h2 class="section-title">👥 Salle en direct ('+live.length+')</h2>'+
      (live.length===0?'<p class="empty">Aucune commande</p>':
        '<div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">'+
        live.map(o=>{
          const timer=orderTimerInfo(o);
          const border=o.cashIssue?"var(--rouge)":(timer.overdue?"var(--rouge)":timer.urgent?"var(--jaune-fonce)":"var(--vert)");
          return '<div class="card" style="border-left:4px solid '+border+'">'+
            '<div class="flex between center"><div><p class="card-title">Table '+(o.tableNumber||"—")+'</p>'+
            '<p class="card-sub">'+money(orderTotal(o))+' · '+(o.paymentMethod||"")+'</p></div>'+
            '<div style="text-align:right">'+statusBadge(o)+
            '<p class="mono bold '+(timer.overdue||timer.urgent?"timer urgent":"timer ok")+'" style="margin-top:6px">'+timer.text+'</p></div></div>'+
            (o.escalated?'<p class="text-xs" style="color:var(--rouge);margin-top:8px;font-weight:600">⚠️ Client a appelé '+o.callCount+' fois</p>':"")+
          '</div>';
        }).join("")+'</div>');
  } else if(v.tab==="livraisons"){
    content='<h2 class="section-title">🛵 Livraisons à dispatcher</h2><p class="section-sub">'+delivering.length+' en cours</p>'+
      (delivering.length===0?'<p class="empty">Aucune livraison</p>':
        delivering.map(o=>{
          const assigned=livreurs.find(l=>l._docId===o.livreurId);
          return '<div class="card" style="margin-bottom:12px">'+
            '<p class="card-title">'+esc(o.clientInfo?.name||"Client")+'</p>'+
            '<p class="card-sub">📍 '+esc(o.clientInfo?.address||"")+'</p>'+
            '<p class="text-xs muted" style="margin-top:4px">📞 '+esc(o.clientInfo?.phone||"")+' · '+money(orderGrandTotal(o))+' · '+o.deliveryDistanceKm+' km</p>'+
            '<a href="tel:'+(o.clientInfo?.phone||"").replace(/\s/g,"")+'" class="btn btn-ghost btn-sm" style="margin-top:6px;text-decoration:none">📞 Appeler</a>'+
            '<div style="margin-top:10px"><label class="text-xs muted bold">ASSIGNER</label>'+
            '<select class="input" style="margin-top:4px" data-action="ger-assign-livreur" data-id="'+o._docId+'">'+
              '<option value="">— Non assignée —</option>'+
              livreurs.map(l=>'<option value="'+l._docId+'" '+(o.livreurId===l._docId?"selected":"")+'>'+esc(l.name)+'</option>').join("")+
            '</select></div>'+
            (assigned?'<p class="text-sm" style="margin-top:8px;color:var(--vert)"><strong>'+esc(assigned.name)+'</strong></p>':"")+
          '</div>';
        }).join(""));
  } else if(v.tab==="factures"){
    // Gérant : impressions factures demandées
    const toPrint=DATA.orders.filter(o=>o.invoiceRequested && !o.invoicePrinted);
    const printed=DATA.orders.filter(o=>o.invoicePrinted).slice(0,10);
    content='<h2 class="section-title">🧾 Factures à imprimer ('+toPrint.length+')</h2>'+
      (toPrint.length===0?'<p class="empty">Aucune demande d\'impression</p>':
        toPrint.map(o=>'<div class="card" style="margin-bottom:10px;border-left:4px solid var(--jaune)">'+
          '<p class="card-title">'+(o.type==="livraison"?"Livraison":"Table "+(o.tableNumber||"—"))+' — '+(o.invoiceNumber||"—")+'</p>'+
          '<p class="card-sub">'+money(orderGrandTotal(o))+' · demandé par '+esc(o.invoiceRequestedBy||"serveuse")+' · '+timeAgo(o.invoiceRequestedAt)+'</p>'+
          '<button class="btn btn-accent btn-block" style="margin-top:8px" data-action="ger-print-invoice" data-id="'+o._docId+'">🖨️ Imprimer la facture 80 mm</button>'+
        '</div>').join(""))+
      (printed.length>0?'<h2 class="section-title" style="font-size:15px;margin-top:20px">Dernières imprimées</h2>'+
        '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Facture</th><th>Total</th></tr></thead><tbody>'+
        printed.map(o=>'<tr><td>'+fmtDate(o.date)+'</td><td class="mono">'+esc(o.invoiceNumber||"—")+'</td><td class="mono">'+money(orderGrandTotal(o))+'</td></tr>').join("")+'</tbody></table></div>':"");
  } else if(v.tab==="affectation"){
    const today=nowDate();
    const day=DATA.affectation[today]||{};
    const serveuses=DATA.staff.filter(s=>s.role==="serveuse");
    content='<h2 class="section-title">Affectation du jour</h2><p class="section-sub">'+new Date(today).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})+'</p>'+
      '<p class="text-sm muted" style="margin-bottom:14px">Touchez une case pour assigner.</p>'+
      '<div class="table-wrap"><table><thead><tr><th>Table</th>'+serveuses.map(s=>'<th>'+esc(s.name)+'</th>').join("")+'</tr></thead>'+
      '<tbody>'+DATA.tables.map(t=>'<tr><td><strong>Table '+t.number+'</strong></td>'+serveuses.map(s=>{const checked=day[t._docId]===s._docId;return '<td><button class="qty-btn" style="'+(checked?"background:var(--jaune);color:var(--noir);border-color:var(--jaune)":"")+'" data-action="ger-affect" data-table="'+t._docId+'" data-serveuse="'+s._docId+'">'+(checked?"✓":"")+'</button></td>';}).join("")+'</tr>').join("")+'</tbody></table></div>';
  } else if(v.tab==="bilan"){
    const served=DATA.orders.filter(o=>o.status==="servie"||o.status==="livree");
    const totalCA=served.reduce((s,o)=>s+orderGrandTotal(o),0);
    const today=nowDate();
    const todayCA=served.filter(o=>o.date===today).reduce((s,o)=>s+orderGrandTotal(o),0);
    const cash=served.filter(o=>o.paymentMethod==="cash").reduce((s,o)=>s+orderGrandTotal(o),0);
    const momo=served.filter(o=>o.paymentMethod==="momo").reduce((s,o)=>s+orderGrandTotal(o),0);
    const panier=served.length?Math.round(totalCA/served.length):0;
    const dishStats={};
    served.forEach(o=>o.items.filter(i=>i.statut!=="Refusé").forEach(i=>{if(!dishStats[i.name])dishStats[i.name]={qty:0,ca:0};dishStats[i.name].qty+=i.qty;dishStats[i.name].ca+=i.qty*i.price;}));
    const top=Object.entries(dishStats).sort((a,b)=>b[1].qty-a[1].qty).slice(0,5);
    const flop=Object.entries(dishStats).sort((a,b)=>a[1].qty-b[1].qty).slice(0,5);
    const alertStock=DATA.stock.filter(s=>stockQty(s._docId)<=s.threshold);
    content='<h2 class="section-title">Bilan</h2>'+
      '<div class="stats-grid" style="margin-bottom:20px">'+
        '<div class="stat-card"><p class="stat-label">CA aujourd\'hui</p><p class="stat-value">'+money(todayCA)+'</p></div>'+
        '<div class="stat-card"><p class="stat-label">CA total</p><p class="stat-value">'+money(totalCA)+'</p></div>'+
        '<div class="stat-card"><p class="stat-label">Commandes</p><p class="stat-value">'+served.length+'</p></div>'+
        '<div class="stat-card"><p class="stat-label">Panier moyen</p><p class="stat-value">'+money(panier)+'</p></div>'+
        '<div class="stat-card"><p class="stat-label">Cash</p><p class="stat-value">'+money(cash)+'</p></div>'+
        '<div class="stat-card"><p class="stat-label">MoMo</p><p class="stat-value">'+money(momo)+'</p></div>'+
        '<div class="stat-card"><p class="stat-label">Stock alerte</p><p class="stat-value">'+alertStock.length+'</p></div>'+
      '</div>'+
      '<div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">'+
        '<div class="card"><p class="bold" style="margin-bottom:10px">📈 Top 5</p>'+(top.length===0?'<p class="empty">Aucune vente</p>':top.map(([n,st])=>'<div class="flex between text-sm" style="margin-bottom:4px"><span>'+esc(n)+'</span><span class="mono muted">'+st.qty+' · '+money(st.ca)+'</span></div>').join(""))+'</div>'+
        '<div class="card"><p class="bold" style="margin-bottom:10px">📉 À promouvoir</p>'+(flop.length===0?'<p class="empty">Aucune vente</p>':flop.map(([n,st])=>'<div class="flex between text-sm" style="margin-bottom:4px"><span>'+esc(n)+'</span><span class="mono muted">'+st.qty+'</span></div>').join(""))+'</div>'+
      '</div>';
  }
  const livBadge=delivering.filter(o=>!o.livreurId).length;
  const callBadge=calls.length + cashIssues.length;
  const factBadge=invoiceRequests.length;
  return '<div class="app">'+topbar({role:"Gérant",title:SESSION.name,homeAction:"ger-home"})+
    '<div class="tabs-scroll">'+
      [{k:"validation",l:"Validation"+(callBadge?' ⚠️'+callBadge:"")},{k:"salle",l:"Salle"},{k:"livraisons",l:"🛵 Livraisons"+(livBadge?" ("+livBadge+")":"")},{k:"factures",l:"🧾 Factures"+(factBadge?" ("+factBadge+")":"")},{k:"affectation",l:"Tables"},{k:"bilan",l:"Bilan"}].map(t=>'<button class="tab '+(v.tab===t.k?"active":"")+'" data-action="ger-tab" data-tab="'+t.k+'">'+t.l+'</button>').join("")+
    '</div>'+
    '<div class="content">'+content+'</div></div>';
}

// ==================== CUISINE ====================
function screenCuisine(){
  const active=DATA.orders.filter(o=>o.status==="payee"&&!o.readyAt);
  const ready=DATA.orders.filter(o=>o.readyAt&&o.status==="payee");
  const ticket=(o)=>{
    const allItems=o.items.filter(i=>i.statut!=="Refusé");
    const t=orderTimerInfo(o);
    const hasIssue=o.cashIssue==="non_recu";
    return '<div class="ticket '+(t.urgent||t.overdue||hasIssue?"urgent":"")+'">'+
      '<div class="flex between" style="margin-bottom:12px">'+
        '<div><p class="serif" style="font-size:19px;font-weight:bold;margin:0">Table '+(o.tableNumber||"—")+'</p><p class="text-xs muted">'+timeAgo(o.createdAt)+'</p></div>'+
        '<div class="timer '+(t.urgent||t.overdue?"urgent":"ok")+'">'+t.text+'</div></div>'+
      '<ul style="margin:0 0 14px 0;padding-left:20px;font-size:14px">'+allItems.map(i=>'<li>'+i.qty+'× '+esc(i.name)+'</li>').join("")+'</ul>'+
      (hasIssue?'<div class="alert-banner" style="padding:10px;margin-bottom:10px"><strong>⚠️ ATTENTION</strong><p class="text-xs" style="margin-top:4px">Paiement signalé NON reçu. Confirmez avant de préparer.</p></div>':'')+
      '<button class="btn btn-outline btn-block" data-action="cui-ready" data-id="'+o._docId+'">Marquer prêt</button></div>';
  };
  return '<div class="app">'+topbar({role:"Cuisine",title:SESSION.name,homeAction:"cui-home"})+
    '<div class="content">'+
      '<h2 class="section-title" style="font-size:17px">👨‍🍳 File ('+active.length+')</h2>'+
      (active.length===0?'<p class="empty">Aucune commande</p>':'<div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">'+active.map(ticket).join("")+'</div>')+
      (ready.length>0?'<h2 class="section-title" style="font-size:17px;margin-top:24px">✅ Prêtes ('+ready.length+')</h2>'+
        '<div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">'+ready.map(o=>'<div class="card" style="border:2px solid var(--vert)"><p class="bold">Table '+(o.tableNumber||"—")+'</p><ul style="margin:8px 0;padding-left:20px;font-size:14px">'+o.items.filter(i=>i.statut!=="Refusé").map(i=>'<li>'+i.qty+'× '+esc(i.name)+'</li>').join("")+'</ul></div>').join("")+'</div>':"")+
    '</div></div>';
}

function screenLivreur(){
  const me=DATA.staff.find(s=>s.name===SESSION.name&&s.role==="livreur");
  const available=DATA.orders.filter(o=>o.type==="livraison"&&o.status==="payee"&&!o.livreurId);
  const mine=DATA.orders.filter(o=>o.livreurId===(me&&me._docId)&&o.status!=="livree"&&o.status!=="annulee");
  const done=DATA.orders.filter(o=>o.livreurId===(me&&me._docId)&&o.status==="livree"&&o.date===nowDate());
  const v=livS;let content="";
  if(v.tab==="available"){
    content='<h2 class="section-title">Disponibles</h2><p class="section-sub">'+available.length+' dispo</p>'+
      (available.length===0?'<p class="empty">Aucune livraison disponible</p>':
        available.map(o=>'<div class="card" style="margin-bottom:12px">'+
          '<p class="bold">📍 '+esc(o.clientInfo?.address||"")+'</p>'+
          '<p class="text-xs muted">'+esc(o.clientInfo?.name||"")+' · '+esc(o.clientInfo?.phone||"")+'</p>'+
          '<p class="text-xs muted">Distance : '+o.deliveryDistanceKm+' km</p>'+
          '<div class="flex between center" style="margin-top:10px"><span class="mono bold">'+money(orderGrandTotal(o))+'</span>'+
          '<button class="btn btn-accent btn-sm" data-action="liv-take" data-id="'+o._docId+'">Je prends</button></div></div>').join(""));
  } else if(v.tab==="current"){
    content='<h2 class="section-title">Mes livraisons</h2>'+
      (mine.length===0?'<p class="empty">Aucune livraison en cours</p>':
        mine.map(o=>'<div class="card" style="border:2px solid var(--jaune);margin-bottom:14px">'+
          '<p class="bold">📍 '+esc(o.clientInfo?.address||"")+'</p><p class="text-sm" style="margin:4px 0 12px">'+esc(o.clientInfo?.name||"")+'</p>'+
          '<div class="grid-2" style="margin-bottom:12px">'+
            '<a href="tel:'+(o.clientInfo?.phone||"").replace(/\s/g,"")+'" class="btn btn-ghost" style="text-decoration:none">📞 Appeler</a>'+
            '<a href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(o.clientInfo?.address||"")+'" target="_blank" class="btn btn-ghost" style="text-decoration:none">🧭 Itinéraire</a>'+
          '</div>'+
          '<div style="background:#faf8f2;padding:10px;border-radius:8px;margin-bottom:12px">'+
            '<ul style="margin:0;padding-left:20px;font-size:14px">'+o.items.filter(i=>i.statut!=="Refusé").map(i=>'<li>'+i.qty+'× '+esc(i.name)+'</li>').join("")+'</ul>'+
            '<p class="mono bold" style="margin-top:6px">'+money(orderGrandTotal(o))+'</p></div>'+
          ((!o.deliveryStatus||o.deliveryStatus==="prise")?'<button class="btn btn-primary btn-block" data-action="liv-enroute" data-id="'+o._docId+'">🧭 En route</button>':"")+
          (o.deliveryStatus==="en_route"?'<button class="btn btn-success btn-block" data-action="liv-done" data-id="'+o._docId+'">✅ Livrée</button>':"")+
        '</div>').join(""));
  } else if(v.tab==="history"){
    content='<h2 class="section-title">Historique du jour</h2><p class="section-sub">'+done.length+' livrée(s)</p>'+
      (done.length===0?'<p class="empty">Aucune livraison terminée</p>':
        done.map(o=>'<div class="card card-row" style="margin-bottom:8px"><div style="min-width:0"><p class="card-title">'+esc(o.clientInfo?.address||"")+'</p><p class="card-sub">'+(o.servedAt?new Date(o.servedAt).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"")+'</p></div><span class="mono bold">'+money(orderGrandTotal(o))+'</span></div>').join(""));
  }
  return '<div class="app" style="max-width:520px;margin:0 auto">'+
    topbar({role:"Livreur",title:SESSION.name,homeAction:"liv-home"})+
    '<div class="content">'+content+'</div>'+
    '<div class="bottom-nav cols-3">'+[{key:"available",em:"📦",label:"Dispos",badge:available.length},{key:"current",em:"🧭",label:"En cours",badge:mine.length},{key:"history",em:"📋",label:"Historique"}].map(t=>'<button class="bn-btn '+(v.tab===t.key?"active":"")+'" data-action="liv-tab" data-tab="'+t.key+'"><span class="em">'+t.em+'</span><span>'+t.label+'</span>'+(t.badge>0?'<span class="bn-badge">'+t.badge+'</span>':"")+'</button>').join("")+'</div></div>';
}

// ==================== ADMIN ====================

  const v=admS;
  const sections=[{key:"menu",em:"🍽️",label:"Menu"},{key:"staff",em:"👥",label:"Personnel"},{key:"tables",em:"📱",label:"Tables & QR"},{key:"stock",em:"📦",label:"Stock"},{key:"history",em:"📊",label:"Historique"},{key:"settings",em:"⚙️",label:"Paramètres"}];
  let content="";
  if(v.section==="menu"){
    const cats=["Entrées","Plats","Desserts","Boissons"];
    const byCat={}; cats.forEach(c=>byCat[c]=[]);
    DATA.menu.forEach(d=>{ if(!byCat[d.cat]) byCat[d.cat]=[]; byCat[d.cat].push(d); });

      const dishes=byCat[cat];

      content+='<div class="cat-group"><div class="cat-group-title">'+esc(cat)+' ('+dishes.length+')</div>'+
        '<div class="table-wrap"><table><thead><tr><th>Plat</th><th>Prix</th><th>Cuisson</th><th>Dispo</th><th></th></tr></thead><tbody>'+
        dishes.map(d=>v.editingDish===d._docId?'<tr>'+

          '<td><input class="input" type="number" data-input="dish-price" value="'+d.price+'" style="padding:6px;width:80px"></td>'+
          '<td><input class="input" type="number" data-input="dish-time" value="'+d.time+'" style="padding:6px;width:60px"></td>'+
          '<td><input type="checkbox" data-input="dish-avail" '+(d.available?"checked":"")+' style="width:20px;height:20px"></td>'+
          '<td style="white-space:nowrap"><select class="input" data-input="dish-cat" style="padding:6px;display:inline-block;width:auto">'+cats.map(c=>'<option '+(d.cat===c?"selected":"")+'>'+c+'</option>').join("")+'</select> <button class="btn btn-success btn-sm" data-action="admin-save-dish" data-id="'+d._docId+'">✓</button></td></tr>':'<tr>'+
          '<td><strong>'+esc(d.name)+'</strong>'+(d.desc?'<br><span class="text-xs muted">'+esc(d.desc)+'</span>':"")+'</td>'+
          '<td class="mono">'+money(d.price)+'</td><td>'+d.time+' min</td>'+
          '<td><span class="badge '+(d.available?"badge-vert":"badge-rouge")+'">'+(d.available?"Oui":"Non")+'</span></td>'+
          '<td style="text-align:right;white-space:nowrap"><button class="btn btn-ghost btn-sm" data-action="admin-edit-dish" data-id="'+d._docId+'">✏️</button>'+
          '<button class="btn btn-ghost btn-sm" style="color:var(--rouge)" data-action="admin-del-dish" data-id="'+d._docId+'">🗑️</button></td></tr>').join("")+
        '</tbody></table></div></div>';
    });
  } else if(v.section==="staff"){
    content='<h2 class="section-title" style="font-size:19px;margin-bottom:16px">Personnel</h2>'+
      '<div class="card" style="margin-bottom:16px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">'+
